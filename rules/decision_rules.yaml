# =============================================================================
# M20-b2D2 -- `lectin` means carbohydrate binding, not receptor binding.
#
# SHADOW. Nothing reads this. `stage2.annotation_term_map` is unchanged and `lectin`
# is still in `positive_rbp_terms` on the live path.
#
# M20-b2D1 measured two counter-examples that a single-valued rule cannot hold at once:
#
#   N136cp1a1 CDS0100   free-text `collectin, c-type lectin` from a human HHpred hit.
#                       Adjudicated `ambiguous_rbp_associated`, ground_truth_rbp=false.
#                       Reads supports_receptor_binding today, from the bare word.
#
#   T4 gp35 / PS52031   a curated GG_LECTIN PROSITE profile on a protein whose truth
#                       role is apparatus_only. Promoted by both readers.
#
# And it measured the scale: of 366 receptor-binding readings in 156,987 records, 24
# involve `lectin` and 14 rest on it alone -- all 14 the same description, one candidate.
# So this is not a large-volume defect. It is a small, precise one about what the word
# is allowed to claim.
#
# The rule is NOT "delete lectin". A carbohydrate-binding fold is a real observation and
# the adjudication for CDS0100 explicitly weighed it. The rule is that the observation
# does not by itself answer the receptor-binding question.
# =============================================================================
lectin_interpretation:
  # ADOPTED 2026-09-03 as M20-b2D4, and adopted NARROWLY: only the demoting half.
  #
  #   live      lectin alone -> uninformative      (by removal from positive_rbp_terms)
  #   NOT live  lectin + context -> receptor_binding
  #
  # The rescue half is design history, kept for the record and for the reasoning it
  # carries -- not a switch waiting to be flipped. M20-b2D3 established it has no real
  # input anywhere in UniProtKB. Re-proposing it needs new evidence, not a re-reading of
  # this block.
  status: M20B2D4_ADOPTED
  live: true
  live_rescue_branch: false
  adopted:
    date: 2026-09-03
    change: "stage2.annotation_term_map.positive_rbp_terms: `lectin` removed"
    encoding_why: >
      adopted as a pure removal because that is the exact transformation every measured
      D2/D3 delta was computed under. A dedicated carbohydrate_binding category was
      rejected: `sequence_homology` treats every category except UNINFORMATIVE as
      informative when computing positive_fraction, so a sixth category would move
      consensus denominators on unrelated records -- a change to the homology rule
      wearing this milestone's name.
    prereg: M20B2D4_PREREGISTRATION.md
    gate: scripts/m20b2d4_acceptance.py
    delta: benchmark/m20b2d4/M20B2D4_DELTA.json
    known_limitation: >
      `lectin` is not re-declared in any other list, so a text whose only signal was
      lectin now reads UNINFORMATIVE with matched=[] -- the output cannot distinguish
      "a lectin term was seen and discounted" from "nothing matched". Accepted because
      the alternative encoding was not the one measured; first candidate for follow-up.

  # The folding that caused the problem, undone. These are two different evidence
  # sources and the vocabulary currently treats them as one claim.
  sources:
    free_text_term:
      examples: [lectin, "c-type lectin", collectin, "carbohydrate-binding"]
      what_it_is: "a word in an annotation somebody else wrote"
    curated_signature:
      examples: [PS52031]
      what_it_is: "a specific profile matched on this candidate's own sequence"
    they_are_not_the_same_claim: true
    why: >
      the free-text case that motivated this is a human pulmonary surfactant protein
      reached by HHpred; the signature case is a PROSITE profile on a phage tail-fibre
      hinge. Reading both as `positive_rbp` is the folding, not the finding.

  # Both default to the same place, and it is not `positive`.
  default:
    role: carbohydrate_binding
    direction: uninformative
    interpretation_confidence: moderate
    direct_rbp_requires_context: true
    why: >
      binding a carbohydrate is a molecular activity. Binding the HOST RECEPTOR is a
      claim about what that activity is for, on this protein, in this virion. The first
      does not establish the second.

  # What may promote it. Literal, and deliberately not a parser: the first thing a
  # parser would be asked to judge is `collectin, c-type lectin, alpha-helical coiled
  # coil`, where the answer is not in the words.
  context_required:
    kinds:
      - id: receptor_contact_context
        terms: [distal tip, distal receptor, receptor-binding tip, receptor binding,
                receptor-binding, host recognition, host-recognition, adsorption,
                tip adhesin, receptor-contacting]
        why: "the annotation itself asserts receptor contact, not merely a fold"
      - id: curated_signature_reviewed_for_rbp
        accessions: {}
        curation_status: EMPTY_PENDING_REVIEW
        why: >
          an accession someone has reviewed AND recorded as receptor-contacting. Empty
          on purpose: M20-b1 already refused to invent accession-level science, and
          PS52031 is not a candidate for it -- the panel showed it does not separate
          RBP from apparatus, but showed nothing about whether it is useful elsewhere.
    not_nlp: true

  # What the panel did and did not establish about the one signature seen.
  ps52031_gg_lectin:
    established: "cannot stand alone as direct-RBP evidence (T4 gp35, apparatus_only)"
    NOT_established: "that it is negative, or worthless in other phage proteins"
    treatment: same_as_free_text_default
    treatment_why: >
      one apparatus_only control is enough to refuse a promotion and not enough to
      assign a negative. It is demoted to context-required, not to counter-evidence.

  # Adoption is gated on evidence for BOTH halves of the rule, not just the half the
  # corpus happens to exercise. The demoting half is supported by real data; the rescue
  # half currently fires on zero real records and is reachable only via a synthetic
  # probe. A contract validated on one side only is a contract half-measured.
  adoption_gates:
    - id: real_contextual_rescue_observed
      requires: ">= 1 real annotation where lectin + receptor-contact context keeps the
                 receptor-binding direction"
      observed: 0
      status: NOT_MET_AND_SEARCHED
      searched_on: 2026-09-03
      evidence: benchmark/m20b2d3/D3_RESULT.json
      gate: scripts/m20b2d3_rescue_search.py
      why: >
        without it, `lectin + context -> supports_receptor_binding` is a design intention
        rather than a measured behaviour, and the contract is indistinguishable from
        deleting the term for every input that actually exists.
      why_the_status_changed: >
        the gate is still NOT_MET and the number is still 0, but 0 now means something
        different. It was "nobody has looked". It is now "looked, across UniProtKB, and
        the annotation this branch was written for does not exist" -- see
        rescue_branch_reachability.searched. A gate that stays unmet after a real search
        is evidence about the design, not a task still outstanding.
    - id: negative_side_validated
      requires: "real records where lectin alone no longer supports receptor binding"
      observed: 14
      status: MET
  live_adoption_supported: false

  # STRUCTURAL FINDING, M20-b2D3 panel design, 2026-09-02. Half the context list cannot
  # do any work, and that narrows the rescue branch far more than "unobserved" suggested.
  #
  #   already promote on their own -- rescue is a no-op there:
  #     receptor binding, receptor-binding, receptor-binding tip, adsorption, tip adhesin
  #     (the last two via `adhesin`, which is itself a positive term)
  #
  #   context-only -- the ONLY strings where the branch changes an outcome:
  #     distal tip, distal receptor, host recognition, host-recognition,
  #     receptor-contacting
  #
  # So the branch fires only where `lectin` is the SOLE positive driver AND one of five
  # specific phrases appears. Bordetella phage BPP-1 Mtd (Q775D6) is the best real
  # candidate found -- a published tropism determinant carrying SUPFAM SSF56436 C-type
  # lectin-like -- and even it does not exercise the branch: its name already contains
  # `receptor-binding`, so it reads RB with or without the lectin evidence.
  #
  # This is not a reason to widen the context list. Widening it toward terms that already
  # promote would make the branch look used while changing nothing.
  rescue_branch_reachability:
    context_terms_total: 10
    context_terms_that_promote_alone: 5
    context_terms_that_can_rescue: 5
    real_records_exercising_it: 0
    best_real_candidate_examined: Q775D6
    best_real_candidate_exercises_branch: false

    # SEARCHED 2026-09-03 (M20-b2D3). The read-only UniProt search this block called for
    # has been run. It did not find the missing positive control, and it found rather
    # more than "absent": see benchmark/m20b2d3/ and scripts/m20b2d3_rescue_search.py.
    searched:
      date: 2026-09-03
      scope: "UniProtKB, read-only. Nothing was uploaded."
      corpus_accessions: 1546
      effective_rescues_found: 0
      status: OBSERVED_ZERO      # not UNOBSERVED: 47 records entered the branch
      what_that_means: >
        1546 accessions were scored with the product's own classifier. 47 of them
        DID enter the rescue branch and not one had its outcome changed by it, because
        in every case the context term was one of the five that already promote alone.
        This is a measured zero over inputs that reach the code, which is a stronger
        statement than the UNOBSERVED recorded for the B3 candidate tier.
      full_index_conjunctions: >
        UniProt's own index, not a substring scan: viral `lectin` AND each of the five
        context-only phrases returns 0 for all five. `distal receptor` and
        `receptor-contacting` match NO UniProtKB entry in any taxon -- they are
        unattested phrases, not merely unattested next to lectin.
      only_cooccurrence_anywhere: >
        The single place in UniProtKB where lectin meets a context-only phrase is 20
        nematode extracellular-matrix proteins (collagen IV, laminin, integrin), where
        `distal tip` denotes the C. elegans distal tip CELL. None is viral, none is an
        RBP. So the phrase is not just unused here -- its dominant real-world sense
        belongs to another field entirely, which is an argument against widening the
        context list toward it rather than for.
      coverage_caveat: >
        `lectin` free-text was shown to cover signature-borne evidence rather than
        assumed to: the union of the free-text, SUPFAM SSF56436 and PROSITE PS52031
        viral sets is 1085, exactly the free-text set's own size, so both signature
        sets are subsets of it. A conjunction on `lectin` therefore does not miss
        SUPFAM/PROSITE-only records.

    implication: >
      if no real annotation is found where lectin is the sole positive driver alongside a
      context-only phrase, the honest conclusion is that contextual rescue is a reasonable
      design that current evidence does not require. The live strategy would then be a
      conservative `lectin` with no rescue branch, rather than a symmetric rule with an
      unused half.

  regression_cases:
    - id: n136_cds0100_free_text
      text: "Pulmonary surfactant-associated protein D; collectin, c-type lectin"
      live_today: supports_receptor_binding
      shadow_expected: uninformative
      role_expected: carbohydrate_binding
    - id: t4_gp35_signature
      text: "GG_LECTIN"
      live_today: supports_receptor_binding
      shadow_expected: uninformative
    - id: contextual_rescue
      text: "GG_LECTIN distal tip"
      shadow_expected: supports_receptor_binding
      why: >
        the sensitivity control. Without it this contract is indistinguishable from
        deleting `lectin`, which is the outcome D1 argued against.
      # CORRECTED 2026-09-03 (M20-b2D3). The text used to be
      # `GG_LECTIN distal receptor-binding tip`, which could not do this job: it
      # contains `receptor-binding`, itself a positive term, so it reads
      # supports_receptor_binding with `lectin` deleted from the vocabulary. The
      # control therefore passed whether or not the rescue branch existed -- the
      # exact failure it was written to exclude. `distal tip` is context-only, so
      # the probe now reads uninformative without the branch and RB with it.
      discriminating: true
      reads_without_lectin: uninformative

    - id: contextual_rescue_noop_control
      text: "lectin adsorption"
      shadow_expected: supports_receptor_binding
      why: >
        the other half of the control. `adsorption` is itself a positive term, so the
        branch FIRES here and changes nothing. A rescue count that includes cases like
        this one measures how often the code ran, not how often it mattered.
      discriminating: false
      reads_without_lectin: supports_receptor_binding

# ============================================================================
localisation_contract:
  # ADOPTED 2026-09-03 as M20-b2E4, at BOTH migration sites in one change.
  #   E1 measured the defect, E2 wrote and proved the contract, E3 pinned the migration
  #   boundary and pre-wrote the gates, E4 landed it.
  status: M20B2E4_ADOPTED
  live: true
  adopted:
    date: 2026-09-03
    sites_changed_together:
      - rbpfinder/evidence/domain_profile.py    # from_interproscan returns N records
      - rbpfinder/classify/tiers.py             # rb_localisation reads all, returns list
    why_together: >
      landing one alone creates a real intermediate semantics: either N region records
      that nothing reads, or a localisation reading every record while upstream still
      emits one elected representative. Neither half-state should ever exist on disk.
    not_changed: >
      evidence_families.decorrelate. Family counting still collapses many D records to at
      most one independent D, so the adoption's attribution is pure localisation
      decoupling with no family policy mixed in.
    counter_example_frozen: scripts/pre_e4_localisation.py
    gate: scripts/m20b2e4_acceptance.py
  milestone: M20-b2E1 measured the defect; M20-b2E2 is this contract; M20-b2E4 adopted it.

  # WHAT IS WRONG TODAY. `domain_profile.from_interproscan` selects ONE representative
  # hit with `min(cands, key=RANK[category])` and then takes direction, region, strength
  # and accession from it. Category ties are broken by the order the provider emitted its
  # matches, so one function is doing two unrelated jobs at once:
  #
  #     ontology interpretation   what does this evidence MEAN
  #     evidence localisation     WHERE on the protein is it
  #
  # M20-b2E1 measured the consequence: with identical rules and identical hits, merely
  # reversing the hit list changes the reported region on 6 of 12 multi-hit artifacts,
  # with the direction unchanged in every one. On P22 tailspike the two answers are
  # 111-667 (the receptor-binding pectate-lyase beta-helix) and 7-109 (the N-terminal
  # capsid-binding domain) -- opposite ends of the protein and opposite biology.
  problem:
    kind: localisation_under_determined_by_evidence
    not_a: provenance_drift
    measured_by: scripts/m20b2e1_region_coupling_audit.py
    evidence: benchmark/m20b2e1/E1_RESULT.json

  # THE SHAPE OF THE FIX. Not a cleverer representative. P22 shows that no scalar
  # ordering -- lowest e-value, longest span, best category -- can be justified as
  # nominating one domain to stand for the whole protein's RBP evidence, because the
  # domains describe different biological parts. So stop electing one.
  #
  #     InterPro artifact -> per-hit interpretation -> 0..N region-level D records
  #                       -> candidate-level reducer -> D counts ONCE as a family
  #
  # Keeping every region and not double-counting are not in tension: de-correlation
  # already collapses many D records to one D family.
  model:
    emit: region_level_records
    per_record_fields: [accession, description, query_start, query_end, direction,
                        strength, origin]
    representative_hit: forbidden_in_science
    family_contribution: at_most_one_D

  invariants:
    - id: permutation_invariance
      requires: >
        any reordering of the same hit set yields an equivalent region-record set after
        canonical sort
    - id: no_representative_hit_science
      requires: >
        candidate direction, strength and family do not depend on the first, the last, or
        the provider's hit order
    - id: region_preservation
      requires: "two distinct qualifying spans produce two records; neither is dropped"
    - id: family_decorrelation
      requires: "N region-level D records still contribute at most one independent D"
    - id: direction_reduction_explicit
      requires: >
        when region records disagree in direction, the reduction rule comes from this
        file and never from list order
    - id: display_not_science
      requires: >
        any single `representative domain` the report may show is display-only and must
        not feed tier, family or localisation

  # INVARIANT 5, stated rather than left to whoever reads the list first.
  direction_reduction:
    rule: most_informative_category
    how: >
      reduce over the CATEGORIES the region records carry, not over the records. The most
      RBP-informative category present wins, using the same `terms.RANK` ordering the
      project already uses. Reducing over categories is order-independent by
      construction; reducing over records is not, because picking a record forces a
      tie-break.
    ties_are_not_broken: >
      deliberately. If two records share the winning category there is nothing to choose
      between them -- both are kept as localisation, and neither becomes `the` hit.
    disagreement_is_expected: >
      region A supporting receptor binding while region B reads apparatus is the NORMAL
      case for a multi-domain tail protein, not a conflict to resolve away. The candidate
      answers two questions separately: what is the D direction, and which regions support
      which reading.

  # INVARIANT 6 has a second consumer that is easy to miss. `evidence_families.decorrelate`
  # marks ONE record per family `counts_as_independent`, chosen with a STABLE sort on
  # (strength, tool) -- so equal-strength records from the same tool fall back to input
  # order. `tiers.rb_localisation` then reads regions from `counted(records)` only.
  # Emitting N region records therefore does NOT fix localisation on its own: the order
  # dependence simply moves one layer down.
  localisation_source:
    read_from: all_region_records_carrying_the_reduced_direction
    not_from: counted_records_only
    why: >
      `counts_as_independent` answers "how many independent families support this
      candidate" -- a de-correlation question. Localisation answers "where is the
      evidence". Using the same marked record for both is the same conflation as the
      representative hit, one layer down.
    hull_vs_list:
      status: DECIDED
      decided: 2026-09-03
      decision: span_list_is_canonical
      measured_by: scripts/m20b2e2_localisation_shadow.py
      what_was_measured: >
        `rb_localisation` reported a HULL, min(start)..max(end) over the counted RB
        records. With every region preserved, the hull covers >=90% of the protein on 4 of
        12 multi-hit artifacts -- P22 tailspike collapses to 1-667 of 667 aa, P04415 to
        2-898 of 898 aa from 18 spans.
      why: >
        a hull does not say where the evidence is; it asserts that everything between the
        leftmost and rightmost hit is evidence. Nothing supports the residues in the gaps.
        For a multi-domain tail protein that is exactly the wrong claim -- the gaps are
        where the OTHER domains are.
      canonical: >
        a LIST of spans, each carrying its own accession, description, direction and
        strength. Discrete evidence stays discrete.
      display_hull:
        allowed: true
        constraint: >
          derived, display-only summary. It must never be an EvidenceRecord's canonical
          region, and no scientific branching -- tier, family, role, localisation truth --
          may read it.

  # ==========================================================================
  # M20-b2E3 -- the live-adoption DESIGN. Still shadow: this pins the migration
  # boundary so that adoption is a mechanical step with gates already written, not a
  # judgement call made while editing rbpfinder/.
  adoption_design:
    status: M20B2E3_DESIGN_ADOPTED_BY_E4
    live: true

    # Two sites, and BOTH are required. Changing only the first looks like a fix and is
    # not one: `decorrelate` marks a single record per family with a STABLE sort on
    # (strength, tool), so equal-strength same-tool records fall back to input order, and
    # `rb_localisation` reads regions from `counted(records)`. Emit N records without
    # touching the second site and the provider-order dependence simply sinks one layer.
    migration_sites:
      - id: domain_profile
        file: rbpfinder/evidence/domain_profile.py
        change: >
          one artifact -> N region-level D records. No scientific representative hit is
          produced at all.
        removes: "_best(cands) as a source of direction, region, strength and accession"
      - id: localisation_read_path
        file: rbpfinder/classify/tiers.py
        change: >
          rb_localisation reads every region record carrying the REDUCED direction,
          not counted(records).
        keeps: >
          evidence_families.decorrelate unchanged -- family counting still collapses many
          D records to at most one independent D. Preserving regions and not
          double-counting are independent questions.

    # The order is the whole point. Selecting a region first and reading its direction is
    # `_best()` again under another name.
    reducer_order:
      step_1_direction: >
        reduce over the CATEGORIES present in the region records, by the rule in
        direction_reduction. This is the candidate-level D direction.
      step_2_localisation: >
        keep the region records whose direction equals the reduced direction. Those spans,
        as a list, are the canonical localisation.
      forbidden: >
        choosing a region first and letting it determine the direction. That reintroduces
        a representative hit and with it the provider-order tie-break.

    migration_gates:
      - id: order_permutation
        requires: "any hit order -> an identical canonical span set"
      - id: family_invariance
        requires: >
          N region-level D records give the same independent-family count and the same
          tier_e as the single-record design. Keeping regions must not inflate E.
      - id: no_synthetic_fill
        requires: >
          every residue interval in the canonical localisation is covered by at least one
          real hit span. A gap between two hits is not evidence.
        worked_example:
          hits: ["10-50", "200-250"]
          canonical_must_be: ["10-50", "200-250"]
          canonical_must_not_be: "10-250"
          unless: "explicitly labelled display_hull, with no downstream scientific reader"

# ============================================================================
hhpred_recording_contract:
  status: M20B2F2_DESIGN
  live: false
  purpose: >
    turn the HHpred input layer from UNOBSERVED into at least one real observation. This
    is NOT a benchmark and NOT a reader migration -- it captures one raw result so that
    M20-b2F1's frequency questions become answerable at all.

  # M20-b2F1 could measure structure and exposure but not frequency, because there is not
  # a single .hhr on this machine. 450 of 450 recorded hhpred records already localise
  # from one elected alignment span, and the hits that lost are gone. So the recorded
  # output cannot tell us how many candidate hits or spans a real result carries.
  why:
    f1_limit: "0 .hhr on disk; frequency UNOBSERVED, not zero"
    what_450_of_450_proves: "that every saved record IS compressed"
    what_it_cannot_prove: >
      how many hits, spans or ties each of those elections discarded. The losers are not
      recoverable, so the 450 must never be used to estimate compression frequency.

  control:
    accession: P12528
    protein: "Tailspike protein, Salmonella phage P22 (gp9)"
    why_this_one: >
      published RBP, public sequence, and already the InterPro-side control on this
      machine (CONTROL_P22_TSP, and the M21-d AUTO control). Its InterPro artifact carries
      8 hits across TWO clearly separate regions -- an N-terminal capsid-binding domain
      around 1-113 and the receptor-binding pectate-lyase beta-helix around 111-667.
      That gives an independent expectation to test the HHpred result against: if HHpred
      also reports hits in both regions, compression is observed on real data rather than
      on a synthetic probe.
    discriminating: >
      chosen because it CAN show the effect. A single-domain protein would produce one
      region and the recording would be consistent with any hypothesis.
    sensitivity: >
      published and public. SMA / W073 sequences are NOT eligible and must never be
      submitted -- see the standing remote-consent rule. Submitting even this one is an
      outbound action requiring explicit authorisation at the time.

  # What a recording must preserve. `original hit order` is the subtle one and it is
  # recorded for a reason that changed during F1: `hhpred.read()` sorts by rank, so file
  # order never reaches the reader. The RANK is therefore what matters, and a recording
  # that silently reordered or renumbered rows would destroy the only evidence of how the
  # provider itself broke ties.
  must_preserve:
    - id: raw_bytes
      requires: "the .hhr stored verbatim, with a sha256, never reformatted"
    - id: all_hit_rows_parse
      requires: "every row of the hit table is parsed; a dropped row is a lost span"
    - id: query_spans
      requires: "every parsed hit carries a query_span"
    - id: probabilities
      requires: "every parsed hit carries probability_pct"
    - id: rank_order
      requires: >
        ranks are preserved exactly as the provider assigned them, and the parsed order
        is rank order. This is what decides ties, so it is the evidence, not metadata.
    - id: replayable
      requires: >
        the reader reproduces its records from the stored raw file alone, with no network
        and no other state

  not_in_scope:
    - "migrating the HHpred reader -- that is M20-b2G1, and only after this exists"
    - "any change to rbpfinder/"
    - "using the recording as a benchmark; one protein is one observation"

  # ==========================================================================
  # THE CAPTURE REQUEST, frozen 2026-09-03 BEFORE any authorisation, so that nothing is
  # decided in the moment of submitting. NOTHING HAS BEEN SUBMITTED.
  capture_request:
    # CLOSED 2026-09-04 by freeze_after_first: the first real .hhr was captured and
    # passed every clause. Outcome = multiple_qualifying_spans (11 qualifying hits, 8
    # positive_rbp spans, 1 reported region). A second control is a NEW milestone.
    status: CLOSED_RECORDED
    submitted: true
    recording: benchmark/m20b2f2/recorded/P12528.raw.hhr
    result: benchmark/m20b2f2/F2_RESULT.json
    outcome: multiple_qualifying_spans
    # Settled 2026-09-03: the user performs the submission by hand in the MPI
    # Bioinformatics Toolkit. Recorded because the two of us had briefly assigned it to
    # each other, and "who performs the outbound action" is not a detail to rediscover on
    # the day. Claude's part begins after the raw file exists.
    performed_by: user_manual_toolkit_submission
    claude_role: "validate the recording after it is saved; never submit"

    control:
      accession: P12528
      protein: "Tail spike protein (gp9), Salmonella phage P22"
      classification: public / published control
      length_aa: 667
      query_sha256: 5265ffe282eb1bd1994e9cf6866a200bcce5af28064483c061730d974d9e7dc2
      query_file: benchmark/m20b2f2/P12528.query.fasta
      fetched: "UniProtKB, read-only, 2026-09-03"
      # The sequence is byte-identical to the InterPro control already on disk
      # (CONTROL_P22_TSP.5265ffe282eb.interproscan.json -- the artifact name carries the
      # same hash prefix). So the HHpred result will be comparable against a KNOWN
      # 8-hit, two-region InterPro result on the very same residues, not merely against a
      # similar protein.
      comparable_to: benchmark/fixtures/interpro_recorded/CONTROL_P22_TSP.5265ffe282eb.interproscan.json

    service:
      name: HHpred
      mode: single-sequence query only
      note: >
        this project's HHpred results have always arrived by a manual/cloud route -- the
        543 HHPRED_BATCH.tsv files are submission manifests for a human. There is no
        stable public HHpred API wired into this codebase, and none is being written
        here. Capture is expected to be a human action against the MPI Bioinformatics
        Toolkit, followed by saving the .hhr and running the validator.

    transmitted:
      - "the P12528 amino-acid sequence, and nothing else"
    not_transmitted:
      - "SMA / W073 sequences"
      - "any genome"
      - "any user file"
      - "any benchmark metadata, candidate id, or run identifier"

    capture:
      - raw .hhr bytes, verbatim
      - service or job identifier, if the service exposes one
      - submitted_at / retrieved_at
      - query_sha256
      - service / version / database metadata, if exposed

    paths:
      dir: benchmark/m20b2f2/recorded/
      raw: benchmark/m20b2f2/recorded/P12528.raw.hhr
      metadata: benchmark/m20b2f2/recorded/P12528.metadata.json
      parsed: benchmark/m20b2f2/recorded/P12528.parsed.json
      rules:
        - "a separate directory; it must not overwrite or sit beside a synthetic fixture"
        - "raw.hhr is stored exactly as received and is never rewritten"
        - "parsed.json is DERIVED and can never substitute for raw"

    execution_constraints:
      - id: allowlist
        requires: "the accession is hard-coded to P12528; no other query is permitted"
      - id: max_one_submission
        requires: "at most ONE submission; a second is a contract violation, not a retry"
      - id: no_duplicate_job
        requires: >
          once a job_id exists, retries poll it and never create a second job -- the
          M16-d/M19-d guard-placement rule, applied here
      - id: raw_before_interpretation
        requires: "the raw bytes are written to disk BEFORE anything is parsed or judged"
      - id: verify_query_hash
        requires: "the submitted sequence hashes to control.query_sha256"
      - id: no_credentials_in_artifacts
        requires: >
          no email, token or credential is written into the artifact, metadata,
          provenance or any other file -- the standing EBI-email rule
      - id: validator_after_capture
        requires: >
          scripts/m20b2f2_recording_contract.py runs on the recording and every clause
          passes: alignment-block count, parsed hit count, query spans, probabilities,
          ranks, replayability
      - id: capture_is_not_validation
        requires: >
          a successful capture says the recording is well-formed. It says NOTHING about
          whether HHpred's answer is scientifically right.
      - id: freeze_after_first
        requires: >
          ONE control, and F2 closes the moment the first real .hhr is recorded and
          validated. A second control is a new milestone decision, never a continuation
          of this one.
        why: >
          the three outcomes are all acceptable, and two of them are uninformative. If
          adding another control stayed inside F2, an uninformative result would invite
          "just one more" until the interesting outcome appeared -- which is sampling
          until the answer changes, the exact failure the outcome classification was
          written to prevent. Deciding to record a second control is allowed; doing it
          silently under this milestone's name is not.

    # F2 answers exactly one question, and three outcomes are all acceptable.
    question: >
      does ONE real HHpred result contain multiple qualifying spans that the current
      reader compresses into a single elected region?
    outcomes:
      - id: multiple_qualifying_spans
        meaning: "compression observed once on REAL data"
        is_failure: false
      - id: single_qualifying_span
        meaning: >
          this control did not exhibit it; compression frequency remains unresolved. NOT
          evidence that compression does not happen.
        is_failure: false
      - id: no_usable_hits
        meaning: >
          the recording succeeded and the scientific question stays UNOBSERVED
        is_failure: false
    failure_is_only: >
      a transport, capture or parser-contract violation. The scientific outcome cannot
      fail this milestone -- confusing "the control was uninformative" with "the
      milestone failed" is how a negative result gets quietly retried until it changes.

# ============================================================================
region_evidence_contract:
  status: M20B2G1_SHADOW
  live: false
  scope: provider-independent; InterProScan, HHpred, and any future span-bearing provider

  # M20-b2E4 decoupled localisation from ontology interpretation for InterProScan, and
  # M20-b2F2's real HHpred result showed the decoupling is necessary but NOT sufficient.
  # HHpred returned 2XC1_B: a template covering 2-667 of a 667 aa query at p=100.0. That
  # is excellent evidence that the protein IS a P22-family tailspike. It is no evidence
  # at all about WHERE the receptor-binding region sits, because it excludes nothing.
  #
  # So simply "every qualifying span joins the canonical list" is wrong: it would admit
  # 2-667 and dilute the localisation back to the whole protein, differing from the old
  # representative-hit defect only in arriving there by another route.
  problem:
    identity_is_not_localisation: >
      a near-whole-query template supports DIRECTION and IDENTITY strongly, and supports
      LOCALISATION not at all
    observed: benchmark/m20b2f2/F2_RESULT.json
    why_provider_independent: >
      InterProScan's signatures happen to be domain-scoped, so this never surfaced there.
      The rule must key on the SPAN and what the evidence can discriminate, never on the
      provider's name -- otherwise every new provider needs its own special case.

  # Per-record, before any aggregation.
  localisation_capability:
    values: [localising, non_localising]
    rule: >
      a span is non_localising when it covers at least `near_whole_query_fraction` of the
      query, because it then excludes essentially nothing and cannot discriminate one
      region from another. Everything else is localising.
    near_whole_query_fraction: 0.95
    threshold_basis:
      measured_on: "P12528, 667 aa, both providers, 2026-09-04"
      distribution: >
        positive-hit coverage falls in three bands: an N-terminal cluster at 0.154-0.219,
        a C-terminal beta-helix cluster at 0.825-0.838 on which HHpred and InterProScan
        AGREE, and whole-protein templates at 0.999-1.000. The gap between 0.838 and
        0.999 is where the threshold belongs.
      why_not_lower: >
        the C-terminal beta-helix covers 0.838 and IS localising -- it excludes residues
        1-106, which is precisely the other domain. A threshold at or below 0.84 would
        discard the single most informative span on this protein.
      why_this_number: >
        0.95 means "excludes less than 5% of the query" -- under 34 residues here. It is
        a judgement, stated as one, with margin on both sides: 0.11 above the beta-helix
        and 0.05 below the whole-protein templates.
      also_catches: >
        the `source: manual` full-length fallback both readers emit when a hit carries no
        span. Those were always non-localising; nothing named them before.
    sanity_property: >
      a near-whole-query span contains every other span in the record set. That is a
      cross-check on the threshold, not the rule -- with a single hit it holds trivially.

  # Two steps, and the order is the point (M20-b2E3's reducer_order, extended).
  aggregation:
    step_1_direction:
      reads: every qualifying evidence record, localising or not
      why: >
        a whole-query template is real evidence about what the protein is. Excluding it
        from the direction would throw away the strongest structural support on the
        record.
    step_2_localisation:
      reads: >
        only records whose direction equals the reduced direction AND whose
        localisation_capability is `localising`
      why: "identity supports the claim; only a discriminating span can place it"
    forbidden:
      - "letting a non_localising span into the canonical span list"
      - "choosing a representative hit at either step"
      - "deriving localisation before the direction is reduced"

  # The state that must never be faked.
  localisation_status:
    values: [resolved, unresolved_no_localising_span, not_applicable]
    unresolved_is_not_full_length: >
      when a direction is supported but no localising span carries it, the answer is
      `unresolved_no_localising_span` and the span list is EMPTY. It is never `aa 1-N`.
      Reporting the full length there would dress "we have no localisation information"
      as "the whole protein is the localisation" -- the same lie the hull told, arrived
      at from the other side.
    relation_to_hull: >
      a hull remains display-only (M20-b2E3). A hull over an empty list is not a full
      protein; it is nothing, and nothing is the honest output.

  gates:
    - id: A
      requires: "a whole-query template never becomes localisation"
    - id: B
      requires: "a domain-scoped positive hit is retained"
    - id: C
      requires: >
        whole-query + domain together: the direction may use both, the localisation uses
        only the domain hit
    - id: D
      requires: >
        whole-query positives ONLY: the direction is still supported, and the
        localisation is unresolved with an empty span list -- never a fabricated
        full-length region
    - id: E
      requires: "provider order and hit order do not affect any output"
    - id: F
      requires: "family de-correlation is unaffected; D still counts at most once"
    - id: G
      requires: "the hull stays display-only and never flows back into science"

# ============================================================================
direction_provenance:
  status: M20B2G2_SHADOW
  live: false
  scope: >
    every span-bearing evidence record, any provider. Audit only -- nothing is reclassified
    on the live path.

  # M20-b2G1 answered "may this span localise at all". It did not answer "is the direction
  # on this span supported by THIS REGION". On the real P12528 result those come apart
  # sharply:
  #
  #   1LKT_E  "TAILSPIKE PROTEIN; VIRUS PROTEIN, SALMONELLA PHAGE P22 ..."   span 6-109
  #           says what the TEMPLATE PROTEIN is. Nothing in it is a claim about residues
  #           6-109. It is currently read as supports_receptor_binding for that region.
  #
  #   2V5I_A  "... TAILSPIKE; O-ANTIGEN BINDING AND HYDROLYSIS"              span 107-665
  #           names a binding activity, and the span is where that activity was aligned.
  #
  # Both carry tailspike vocabulary. Only the second says anything region-local.
  question: >
    is the receptor-binding direction on this span supported by the region itself, or only
    by the identity of the protein the template came from?

  classes:
    - id: whole_protein_annotation
      means: "the span covers the query; G1 already calls it non_localising"
    - id: region_local_function
      means: "the title names a binding or catalytic ACTIVITY -- a thing a domain does"
    - id: domain_function
      means: "the title names a domain or fold explicitly, without an activity word"
    - id: protein_identity_only
      means: "the title names what the PROTEIN is, and nothing about this region"
    - id: generic_protein_name
      means: "no positive vocabulary at all -- a bare name or locus tag"
  precedence: [whole_protein_annotation, region_local_function, domain_function,
               protein_identity_only, generic_protein_name]

  # Partitioned out of the EXISTING positive_rbp_terms rather than invented, so this audit
  # cannot smuggle in new vocabulary under the name of a provenance study. Every term below
  # already appears in stage2.annotation_term_map.positive_rbp_terms.
  partition_of_positive_terms:
    activity_or_binding:
      [receptor binding, receptor-binding, adsorption, depolymerase, glycoside hydrolase,
       glycosidase, glycosyl hydrolase, sialidase, neuraminidase, hyaluronidase,
       hyaluronate lyase, pectate lyase, pectin lyase, polysaccharide lyase,
       endo-alpha-sialidase, endosialidase, endoglucanase, xylanase, carbohydrate-binding,
       carbohydrate binding, CBM, LamG, laminin G, laminin-G, discoidin, concanavalin]
    identity_or_part:
      [tail spike, tailspike, adhesin, host range]
    why_this_split: >
      `tailspike` names a virion part. `endorhamnosidase` or `O-antigen binding` names
      something a stretch of residues DOES. The first is an identity claim about the
      protein; the second is a functional claim that a span can carry.
    honest_limit: >
      this is a LEXICAL partition of titles, not ground truth about the proteins. It says
      what a title asserts, not whether the assertion is correct. Treat the counts as a
      measurement of the annotation corpus, never as biology.
    domain_markers: [domain, fold, beta-helix, "_C", "_N", "_sf"]

  # The proposal the audit measures. NOT adopted.
  proposed_restriction:
    rule: >
      protein_identity_only and generic_protein_name evidence may support the
      CANDIDATE-level direction, but may not place a region-level direction.
    rationale: >
      "this template is a tailspike" is evidence that the candidate is a tailspike. It is
      not evidence that the residues the template happened to align to are the
      receptor-binding region.
    status: MEASURED_NOT_ADOPTED

# ============================================================================
# Promoted to a system principle 2026-09-05, after M20-b2G1 measured it.
hull_principle:
  statement: >
    a hull is not merely a lossy summary. On the real P12528 result the hull over the six
    discrete spans G1 recovers is 2-667 -- byte-identical to the wrong answer the live
    reader produces today. The hull therefore DESTROYS exactly the information the whole
    localisation programme exists to recover.
  rules:
    - "a hull is display-only and may never re-enter tier, family, role or localisation"
    - "a hull is not shown by default; it is produced only on explicit request"
    - "a hull over an empty span list is nothing, never the full protein length"
  measured_by: benchmark/m20b2g1/G1_RESULT.json

# ============================================================================
region_local_vocabulary:
  status: M20B2H1_SHADOW
  live: false
  purpose: >
    M20-b2G2 stalled at RESTRICTION_NOT_YET_ACTIONABLE because the vocabulary cannot
    express region-local function. This audit measures WHICH phrases would close that gap
    and what each would cost. It adopts nothing.

  # Two classes, kept apart deliberately. Binding a receptor and enzymatically processing
  # it are both RBP biology and they are NOT the same mechanism; assuming one direction and
  # one strength for both is the kind of folding M20-b2D1 was written about.
  candidate_classes:
    - id: receptor_interaction
      means: "the annotation states an interaction with a host-surface structure"
      candidates: ["O-antigen binding", "lipopolysaccharide binding", "LPS binding"]
    - id: enzymatic_receptor_processing
      means: "the annotation states catalytic processing of a host-surface polymer"
      candidates: [endorhamnosidase, "O-antigen hydrolysis", "polysaccharide depolymerase"]
      caution: >
        an enzyme acting on a surface polymer is evidence of receptor ENGAGEMENT, not
        automatically of receptor BINDING as the primary role. Do not assume the two
        classes deserve the same direction or the same strength.

  # Measured on the real corpus before anything is proposed. These are the reason the
  # candidates above are all MULTI-WORD.
  token_traps:
    - token: binding
      finding: >
        93 occurrences in non-positive real annotation text, and essentially all of them
        are nucleic-acid or cofactor binding: single-stranded DNA-binding protein, RNA-
        binding, GTP-binding, ATP-binding, calcium binding. Promoting the bare token would
        read DNA-replication machinery as receptor-binding.
    - token: O-antigen
      finding: >
        every occurrence in the corpus is `O-antigen CONVERSION` -- GtrA/GtrB/GtrC, host
        LPS seroconversion enzymes carried by the phage. Promoting the bare token would
        read a glucosyl-transferase as an RBP. The receptor claim lives in the PHRASE
        `O-antigen binding`, not in the token.
    - token: hydrolysis / hydrolase
      finding: >
        already a declared high_noise term, and W073cp2a2 CDS0004 is a standing hard
        negative precisely because PHROG calls that Ig-adapter rod a `hydrolase`. The
        registry pre-registers the regression: if a hydrolase keyword ever lifts it back to
        R1/R2, high-noise handling has broken.
    - token: "-ase suffix"
      finding: >
        the corpus is dominated by terminase (948), polymerase (645), exonuclease (392),
        endonuclease (376), ligase (302), helicase (251), kinase (238). An enzyme-suffix
        heuristic is not a receptor heuristic.

  acceptance_bar:
    - "corpus identity frozen before any delta is quoted"
    - "a published positive control the phrase MUST promote"
    - "an apparatus / non-RBP counter-control it must NOT promote"
    - "a known-bad implementation control that the gate is shown to catch"
    - >
      no phrase is admitted because it sounds biologically right; each must be shown to
      change the corpus in a way that is measured and bounded
  adopted: none

# ============================================================================
# PERMANENT PRINCIPLE, promoted 2026-09-05 from M20-b2H1.
lexical_validation_principle:
  statement: >
    a lexical candidate is not validated unless it OCCURS in the corpus used to measure its
    downstream effect.
  why: >
    M20-b2H1 measured six candidate phrases against 550 recorded runs and every one moved
    zero records. That zero is UNOBSERVED-on-relevant-input, not evidence of safety: the
    phrases simply do not appear in that corpus. Reading it as "no effect, therefore safe"
    would adopt vocabulary whose behaviour has never been seen.
  how_to_apply:
    - "report corpus REACH (how many records contain the candidate) before any delta"
    - "reach = 0 is a blocked measurement, never a passed safety check"
    - "a delta of 0 over reach of 0 must be labelled UNOBSERVED, never OBSERVED_ZERO"
  related: [region_local_vocabulary, direction_provenance]

# ============================================================================
evidence_accumulation:
  status: M20B2I1_OPEN
  live: false
  changes_interpretation: false
  purpose: >
    accumulate real multi-hit structural/profile inputs through the normal product path, so
    that the region-function questions M20-b2G2 and M20-b2H1 stalled on become measurable.
    This milestone collects evidence; it does not reinterpret any.

  # Measured 2026-09-05, before anything was proposed.
  measured_state:
    recorded_runs: 550
    raw_artifacts_on_disk:
      interproscan_json: 9
      hhpred_hhr: 1
      foldseek_json: 0
      hhpred_batch_manifests: 543
    candidates_carrying_more_than_one_record_of_any_tool: 0
    what_that_means: >
      the recorded corpus is entirely a PRE-M20b2E4 artefact: every reader that produced it
      emitted exactly one record per provider per candidate, so no candidate in it can
      exhibit multi-span behaviour for any provider. The raw inputs that would let those
      records be re-derived were mostly not kept -- 543 HHpred submission manifests exist
      against 1 saved .hhr, and 29539 foldseek_structure records against 0 saved foldseek
      outputs.
    consequence: >
      the bottleneck is RETENTION, not vocabulary and not rules. No amount of term-list work
      can be validated on a corpus that structurally cannot contain the phenomenon.

  # Two eras, and they must not be silently pooled -- the same lesson as the B3 baseline
  # lineage.
  corpus_eras:
    pre_E4: >
      one evidence record per provider per candidate. The 550 recorded runs. Cannot show
      multi-span behaviour by construction.
    post_E4: >
      InterProScan emits N region-level records. No run has been recorded in this era yet.
    rule: >
      a delta measured across the boundary mixes a reader-generation change with whatever
      is under test. Label the era of any corpus before quoting a number from it.

  retention_requirements:
    - id: raw_bytes_kept
      requires: "the provider's raw output is stored verbatim beside the run"
    - id: losers_survive
      requires: >
        the hits that did not win an election are recoverable -- either because the reader
        emits them as records (InterProScan, post-E4) or because the raw artefact was kept
        (any provider)
    - id: era_labelled
      requires: "every accumulated run records which reader generation produced it"
    - id: no_interpretation_change
      requires: "accumulation changes no rule, no vocabulary and no reader"

  unblocks:
    m20b2h1: >
      the candidate phrases become measurable once corpus REACH for at least one of them is
      greater than zero. Reach, then the standard acceptance chain -- reach alone is not
      adoption.
    m20b2g2: >
      the region-level direction restriction becomes measurable once records exist whose
      provenance classes are populated from real multi-hit inputs rather than from one
      recording.

# ============================================================================
# HARD CONSTRAINT, promoted 2026-09-05 from evidence_accumulation.corpus_eras.
corpus_era_constraint:
  statement: >
    a corpus belongs to a reader generation, and two generations must never be pooled into
    one number. Every quoted corpus figure names its era.
  eras:
    - id: pre_E4_single_record_reader
      means: >
        one evidence record per provider per candidate. Cannot exhibit multi-region
        behaviour by construction. The 550 recorded runs are all of this era.
    - id: post_E4_multi_region_reader
      means: >
        InterProScan emits N region-level records. No run has been recorded in this era yet.
  rules:
    - "label the era before quoting any count, delta or rate from a corpus"
    - >
      a change measured ACROSS the boundary must not be attributed by default to the
      vocabulary or rule under test -- the reader generation changed too, and that
      explanation has to be excluded before any other one is offered
    - >
      pooling the two eras into a single denominator is an error even when the totals look
      compatible; the generations answer different questions
  why: >
    the same failure the B3 baseline lineage was built to prevent, one level up: a
    conclusion silently re-pointed at a measurement that is not the one it was drawn from.
  related: [evidence_accumulation, lexical_validation_principle]

# ============================================================================
confirmed_rbp_designation:
  status: M22A_SHADOW
  live: false
  milestone: >
    M22, prompted by round-2 field testing plus expert review. The reference workflow
    (a prior manual RBP-hunting session, read in full) always converged on a NAMED set of
    confirmed candidates -- never a bare tier list. Primary/Rescue answers "worth testing";
    this answers "independently corroborated", as a layer on top, not a replacement.

  rule:
    predicate: rbpfinder.classify.tiers.confirmed_rbp
    requires: >
      tier_r == R1 AND at least 2 independent DIRECT families (subset of {T, D, S}),
      each individually reaching strength == strong
    why_narrower_than_R1: >
      R1 already permits a single strong hit plus one weak second family. A confirmed
      designation should mean two independently strong lines of evidence agree, matching
      what the reference workflow actually required before calling a candidate settled
      (Foldseek sequence identity >90% AND HHpred structural probability ~100%, not one
      strong result and one weak one).
    no_weighted_score: >
      still purely categorical, like tier_r/tier_e -- the frozen non-goal (no weighted
      total score) is not reopened. This is a stricter family-count-and-strength rule,
      the same shape tiers.assign already uses, not a new scoring axis.

  scope:
    applies_to: >
      Primary-tier candidates only. Rescue can never be confirmed_rbp by construction --
      it exists because evidence was NOT sufficient, and a candidate whose new evidence
      reaches R1 already changes set_membership through the existing mechanism, not
      through this flag.
    multiple_per_genome: >
      not forced to a singleton. A genome with two independently corroborated candidates
      (matching the reference session's RBP1 central fibre + RBP2 glycan-binding fibre)
      reports both as confirmed_rbp, ranked as usual, not merged or arbitrated.

  # MEASURED 2026-09-08 on the two clean corpora (benchmark/m8b/, 11 published references;
  # benchmark/stage2_48_m14e/, the frozen M14D-era 48-genome SMA set -- neither carries the
  # M7C ablation split or the run_K11 pipeline-version drift the first pass of this
  # measurement mixed in and had to back out of). Every recorded run in both is fully
  # automated: HHpred/AlphaFold/Foldseek default to MANUAL_HANDOFF (`evidence_acquisition`)
  # and were never manually run for this snapshot, so every candidate's D family comes only
  # from `pharokka_phrog` (capped moderate) and every S only from `local_blast_db`
  # (also moderate here). confirmed_rbp requires >=2 independently STRONG direct families,
  # and a purely-automated run structurally cannot supply that -- not a rule defect, the
  # exact gap M22-b's interactive loop exists to close.
  #
  # The closest real case makes the rule's shape legible anyway: P435cp1a1_CDS_0023 IS
  # Salvovirus RBP2 (the glycan-binding fibre from the reference manual-hunting session --
  # HHpred ~98%, Foldseek 92.7% identity in that session's own real submissions). In THIS
  # recorded snapshot it already carries D=strong (hhpred) and is one BLAST-strength notch
  # from S=strong -- the nearest miss in either corpus, and a real RBP, not a decoy.
  adoption_gates:
    - id: non_vacuity
      status: UNOBSERVED_ON_AUTOMATED_ONLY_CORPUS
      requires: "neither 0 nor all R1 candidates in the canonical corpus"
      observed: "0 of 5 R1 candidates confirm in m8b + stage2_48_m14e"
      why_unobserved_not_failed: >
        UNOBSERVED means no automated-only run in either corpus supplies a second
        independently-strong direct family for any candidate to reach -- not that the
        predicate was tried and found wanting. Distinguishing this from a genuine
        OBSERVED_ZERO (evidence present, co-occurrence genuinely absent) is the same
        discipline the D3 and H1 milestones already established for this project.
      closest_case: "P435cp1a1_CDS_0023 (Salvovirus RBP2): D=strong, S=moderate"
      not_a_reason_to: "lower the strength bar to make the gate fire on weaker evidence"
      resolved_by: M22-b's interactive loop supplying a real manual HHpred/Foldseek result
    - id: negative_control
      requires: "every SMA_hard_negatives.tsv entry stays confirmed_rbp=false"
      status: MET
    - id: corpus_derived_positive_control
      status: UNOBSERVED_ON_AUTOMATED_ONLY_CORPUS
      requires: >
        at least one real genome in the canonical corpus has >=2 confirmed_rbp candidates,
        found by measurement rather than asserted from an external truth table
      why_unobserved_not_failed: same as non_vacuity above -- one shared root cause
      note: >
        the reference session's own Salvovirus P435cp1a1 genome (RBP1=CDS_0019 central
        gpJ fibre, RBP2=CDS_0023 glycan-binding fibre) is exactly the multi-candidate case
        this gate wants; only CDS_0023 is recorded in this project's benchmark corpus, and
        with automated-only evidence. Confirms the predicate can reach the right ANSWER
        given real manual evidence; the automated corpus alone cannot supply it.
    - id: no_regression
      requires: >
        adoption changes no existing tier_r, tier_e, set_membership or completeness
        statement anywhere in the recorded corpus -- confirmed_rbp is a read-only
        annotation on top of what R1 already decided
      status: MET
  gate: scripts/m22a_confirmed_shadow.py
  status_of_gate: >
    RAN 2026-09-08. Two of four gates MET (negative_control, no_regression). Two are
    UNOBSERVED_ON_AUTOMATED_ONLY_CORPUS, not failed -- see each gate's note. Not yet
    adopted: the rule's SHAPE is validated (correct negative control, correct closest-miss
    identification, no side effects on existing classification) but its non-vacuity has
    never been positively demonstrated on real interactively-confirmed evidence. Adopting
    to live before that exists would ship a designation nobody has seen actually fire.

# ============================================================================
# M22-e. Named and frozen 2026-09-08, prompted by the user formalising M22-d's shape
# into a permanent product capability rather than leaving it as an implicit consequence
# of how bulk_cli.py happened to be written.
bulk_local_evidence_mode:
  status: NAMED_ARCHITECTURE
  live: true
  milestone: "M22-d built it; M22-e names it and gates the two invariants it depends on"

  statement: >
    Bulk is orchestration across independent single-genome runs, and screens locally
    whatever a family already supports locally -- it is never a whole-workflow automator,
    and it never becomes a second, merged science layer above the per-genome one.

  # The capability table, as a rule-file artefact rather than a passing remark, so a
  # future session extending `bulk` has something to check itself against.
  capability_matrix:
    - family: sequence_homology
      provider: local_blast_db
      bulk_capable: local
      note: already fully local; nothing to add
    - family: domain_profile
      provider: interproscan
      bulk_capable: remote_automated
      note: >
        EBI REST path already exists (M21-d), consent required exactly as for one run.
        InterProScan 6's native-Windows local install is a real opportunity, deliberately
        DEFERRED to its own pass -- large member-database download, Nextflow/container
        runtime, not undertaken alongside this milestone.
    - family: domain_profile
      provider: hhpred
      bulk_capable: manual_only
      note: >
        HH-suite has no native Windows build (confirmed from its own GitHub releases:
        Linux/conda/Docker only). This project already avoids WSL. Not a design choice --
        a platform wall, the same shape AlphaFold's GPU requirement already is.
    - family: structural
      provider: foldseek
      bulk_capable: manual_only
      note: same platform wall as hhpred, already documented for this provider elsewhere
    - family: structural
      provider: alphafold
      bulk_capable: manual_only
      note: >
        GPU requirement makes local infeasible on a typical bench machine; there is also
        no remote job API to automate against. AlphaFold is a manual EVIDENCE PROVIDER,
        never a bulk executor -- see invariant_af3_manual below.

  # Two invariants. Both MEASURED against the real code below, not merely stated.
  invariants:
    - id: af3_manual_under_bulk
      statement: >
        no global bulk flag may move AlphaFold off MANUAL_HANDOFF. A user is free to
        request it explicitly and be REFUSED (UnsupportedMode, exit 1, clear reason) --
        that is a request answered honestly. What must never happen is a global
        `--evidence-mode auto` silently carrying AlphaFold along with it.
      mechanism: >
        already provided by evidence_acquisition.resolve_all(), not new code:
        UnsupportedMode raised for a GLOBAL request is caught and the provider's
        default_mode is used instead, WITH a stated reason; the same exception from an
        EXPLICIT per-provider request (--alphafold-mode auto) is allowed to propagate.
        `bulk run` passes its shared flags through to the exact same resolve_all() every
        single-genome run already uses -- there is no separate bulk-only mode-resolution
        path that could drift from it.
      gate: scripts/m22e_bulk_architecture_invariants.py
    - id: no_unified_candidate_pool
      statement: >
        the candidate/tier/evidence boundary stays the single genome. `bulk` writes
        exactly two KINDS of file above the per-genome level: orchestration progress
        (BULK_RUN_SUMMARY.json -- phage_id/exit_code/tier COUNTS only, no CandidateState,
        no EvidenceRecords) and batch-REQUEST merges (MERGED_<PROVIDER>_BATCH.tsv and its
        return template -- raw sequences and administrative columns, not a classification
        result). Nothing at the --out-root level may carry a tier_r, a direction, an
        evidence family, or a cds_id's classification -- those exist only inside each
        genome's own --out/<phage_id>/run_result.json, exactly as a single run produces.
      why: >
        preserves return_binding's existing safe-rejection audit chain (a foreign cds_id
        is refused per-genome, with a reason, the same as always) and means every
        genome's result is independently interpretable with no other genome's file
        present -- the property M22-d's own design already leaned on without stating it.
      gate: scripts/m22e_bulk_architecture_invariants.py

# ============================================================================
# M23. Named 2026-09-08, prompted by the user identifying a real architectural gap:
# reachability, not annotation quality, is Stage 1's real bottleneck.
d_wide_nomination_shadow:
  status: M23_SHADOW
  live: false
  milestone: >
    M22-e closed the bulk-orchestration work. Asked what still limits Stage 1 nomination
    beyond annotation quality, the code trace showed D-family evidence is entirely
    downstream of the nomination gate: `_build_acquisition_plan` in rbpfinder/cli.py only
    ever builds INTERPRO_BATCH.tsv rows for CDS already inside `pool` (the C1-C5 union). A
    CDS no channel nominates gets no domain-profile evidence at all, not even a `not_run`
    record -- nomination_unreachable, a strictly worse failure mode than a false negative,
    because no amount of better evidence INTERPRETATION downstream can ever reach it.

  rule_shape: >
    domain_hit(whitelist) -> nomination ONLY. Never -> tier_r/tier_e, never treated as
    direct receptor-binding evidence. A hit adds a CDS to `pool`; the existing S/D/T/G
    machinery does all the actual classification once it is there. Nomination and
    classification stay separated, exactly as every other channel (C1-C5) already keeps
    them -- and this separation is load-bearing here specifically because candidate
    whitelist domains (beta-helix, collagen-like repeat, FN3 repeat) are broad structural
    motifs with real presence outside RBPs; treating a hit as positive evidence rather than
    mere reach would be a false-precision trap the user named explicitly.

  measurement_questions:
    - "how many known RBPs (across the two clean corpora) does this channel hit at all?"
    - "of those, how many were already in-pool?"
    - "how many were pool-external -- i.e. genuinely new reach?"
    - "how much nomination noise does it introduce on hard negatives / ambiguous controls?"
  primary_metric: >
    rescued known-RBP / newly-nominated CDS / hard-negative introductions -- NOT raw hit
    count. Re-hitting candidates already in the pool does not close the architectural gap;
    only reach into previously-unreachable CDS does.

  deprioritized:
    - id: machine_learning_family
      reason: >
        the M evidence family is a real, currently-unfilled placeholder
        (audit/completeness.py's genome_wide_T_or_M_available already accepts an ml_results
        argument nothing populates) -- but an ML nomination/classification signal would be
        unvalidatable before real corpus accumulation exists to check it against, matching
        the standing reach-before-delta discipline. Revisit after M22's evidence-
        accumulation direction has produced real multi-provider corpus growth.
    - id: c1_adaptive_window
      reason: >
        C1's fixed CDS/kb window extension (vs C4's genome-relative adaptive-gap
        percentile) is ordinary recall tuning on an ALREADY-reachable path, not a
        reachability fix -- lower priority, lower cost, does not block this milestone.

  # MEASURED 2026-09-08, before any pilot was built. Both gold files
  # (benchmark/m8b/m8b_per_rbp.json, benchmark/stage2_48_m14e/per_rbp_attribution.tsv)
  # already carry an in_pool field per known RBP -- checking them cost zero new data.
  # Of 131 known-RBP rows across both corpora, exactly ONE is in_pool=false: lambda's stf
  # (mapping_confidence: low_ambiguous, no cds_id). Investigated by hand against
  # benchmark/m8b/lambda/all_CDS_screening.tsv: ECTOUAEA_CDS_0024 (401aa) and
  # ECTOUAEA_CDS_0026 (314aa), both "tail fiber protein", both already nominated via C1+C2,
  # match the well-documented historical split of lambda's frameshift-fused stf gene into
  # two separately annotated ORFs (tfa/stf). The gold row's empty cds_id reflects that the
  # REFERENCE (fused) protein could not be cleanly BLAST-mapped to either fragment alone --
  # a ground-truth MAPPING artefact, not a nomination-reachability failure. Both real
  # fragments were already correctly in the pool.
  corpus_reach_check:
    status: UNOBSERVED_NO_POSITIVE_CASE_IN_CURRENT_CORPUS
    gate: scripts/m23_dwide_corpus_reach.py
    result_file: benchmark/m23/M23_CORPUS_REACH_RESULT.json
    finding: >
      0 of 131 known-RBP gold rows across the two clean corpora are a genuine, resolvable,
      pool-external case. The architectural gap remains real (proven by the cli.py code
      trace, independent of this corpus) -- this corpus was never built to exercise it.
    why_not_a_pilot_yet: >
      spending real InterProScan AUTOMATED_REMOTE submission budget on a "submit
      everything, see what sticks" pilot right now would measure noise (question 4)
      against zero confirmed signal (questions 1-3) -- the corpus cannot answer the
      question the pilot exists to ask. No submission was made in this pass.
    reopen_condition: >
      resume the moment a genuinely pool-external known-RBP with a resolvable cds_id
      appears in either gold corpus -- most likely path: the M22 evidence-accumulation
      direction growing stage2_48_m14e or adding new confirmed multi-RBP genomes over time.

  # Scoped but deliberately unbuilt, so resuming is fast rather than a re-investigation.
  scoped_for_reopening:
    submission_mechanism: >
      rbpfinder/providers/interpro_remote.InterProSession is real, already validated live
      once (scripts/m21d_interpro_live.py), and takes an arbitrary records_by_id/
      selected_ids pair -- not wired into cli.py's normal run path (deliberately, per
      MILESTONE_21.md). A pilot calls it directly rather than routing through `rbpfinder
      run`. evidence_acquisition.providers.interproscan already declares
      automation_implemented: true; only the CLI wiring is intentionally absent.
    domain_whitelist: >
      interpro_evidence.direction_ontology (by_interpro_accession / by_signature_accession)
      is currently {}, curation_status: EMPTY_PENDING_REVIEW -- no existing accession
      whitelist exists anywhere in the project to reuse; one starts from zero when this
      resumes, checked against rbpfinder/parse/interproscan.read()'s `accession`
      (member-DB signature) and `entry_accession` (integrated IPR) fields.
    noise_sample_for_q4: >
      benchmark/SMA_hard_negatives.tsv has exactly three standing rows, all W073cp2a2 --
      too thin alone for an honest noise-rate estimate. Pair with a random background
      sample of pool-external, non-RBP-labelled CDS from all_CDS_screening.tsv's
      is_candidate=no rows, available for free, rather than relying on the three alone.
    selection_cap_note: >
      the current nominated-pool InterProScan flow caps at
      interpro_evidence.candidate_selection.max_candidates: 24, explicitly to bound
      unnecessary transmission of unpublished sequence. A future "submit everything" pilot
      bypasses that cap by design and must say so plainly in its own disclosure -- same
      remote-consent-contract treatment as any other real submission, not a special case.
