%YAML 1.2
---
# RBPfinder v1 — machine-readable decision rules
# Every threshold used anywhere in the skill lives here. Nothing is hardcoded elsewhere.
# `calibration: pending` means the value is an expert-derived starting point with NO
# empirical support yet. Such values MUST be reported as heuristics in every output and
# MUST be re-fit once the benchmark exists.

meta:
  version: "1.0.0-spec"
  scope: "Caudoviricetes"
  optimises: "complete-recall@K"
  provenance: "reverse-engineered from SMA phage work (SOP_v0.md); not yet calibrated"

# ---------------------------------------------------------------------------
# GLOBAL INVARIANTS — enforced as assertions, not guidelines.
# ---------------------------------------------------------------------------
invariants:
  nomination_is_add_only:
    rule: "No Stage 1 channel may remove a candidate from pool P."
    enforcement: "assert len(P_after_channel) >= len(P_before_channel)"
  absence_is_not_counter_evidence:
    rule: "Null/zero/low-confidence results may never reduce a candidate's tier."
    applies_to: [interproscan_zero_hits, blast_no_hit, low_plddt, low_iptm, low_ptm]
  architecture_is_soft_prior:
    rule: "Architecture may not gate pool entry, audit execution, or completeness."
    forbidden_uses: [stopping_rule, pool_filter, audit_skip, completeness_declaration]
  k_is_not_a_stopping_rule:
    rule: "k_default sets display size and the Recall@K reporting parameter only."
    forbidden_uses: [truncating_candidate_set, terminating_search, skipping_stage6]
  every_cds_has_a_reason:
    rule: "all_CDS_screening.tsv must contain one row per CDS with a non-empty reason."

# ---------------------------------------------------------------------------
# STAGE 0
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# DATA POLICY -- decided ONCE per run, obeyed by every stage
#
# The real question is not "EBI or local BLAST?" It is: may the user's sequences
# leave this machine? A user should not have to know that HHpred's web server,
# EBI BLAST, InterProScan online, Foldseek Web and the AlphaFold Server all
# upload the sequence, while a local BLAST database and an existing .hhr file do
# not. RBPfinder knows which providers transmit data; the user only decides
# whether transmission is permitted at all.
# ---------------------------------------------------------------------------
data_policy:
  decided_at: stage0_after_qc
  asked: once_per_run
  default: private
  forbidden: "asking per protein, or per tool, which backend to use"

  # 2026-08-20: the user granted a STANDING authorisation for remote submission on
  # this project. Recorded here rather than assumed at each call site.
  #
  # One limit that authorisation does NOT lift: phage-annotation.org asks users not to
  # run bulk annotation. Permission to send data off the machine is not permission to
  # ignore a service's terms -- those are separate constraints and both must hold.
  # Consequence: the SMA 48 stay on Mode A (83 local pharokka GenBanks already cover
  # them), and the cloud route is used for PUBLIC genomes, where uploading carries no
  # disclosure risk at all.
  standing_authorisation:
    granted: true
    granted_on: "2026-08-20"
    scope: "remote submission permitted for this project"
    does_not_override: "third-party service terms, including the bulk-annotation request"
    still_per_run_flag: "--allow-remote is still required, so every run records what it did"

  modes:
    private:
      description: "unpublished genomes, internal lab or company data"
      existing_results: use
      local_search: allowed
      remote_submission: forbidden
      on_missing: "emit a STAGE2_REQUIRED / STAGE3_REQUIRED breakpoint; never upload"
      chain: "cached result -> local database -> breakpoint"
    remote_allowed:
      description: "published or otherwise shareable sequences"
      existing_results: use
      local_search: allowed
      remote_submission: allowed
      requires_explicit_run_authorization: true
      authorization_scope: "this run only; never persisted to disk or config"
      chain: "cached result -> local provider -> remote provider"
    import_only:
      description: >
        the user has already run BLAST / HHpred / InterProScan / Foldseek / AF3 by hand.
        RBPfinder runs no search of any kind and only parses what exists. This is the mode
        the SMA benchmark runs in.
      existing_results: use
      local_search: forbidden
      remote_submission: forbidden
      on_missing: "record as not_run; emit a breakpoint"

  # Each provider declares whether it transmits the sequence off this machine.
  # The executor derives what may run; the user never answers a per-tool question.
  provider_registry:
    - {id: existing_hhr_import,      family: D, transmits: false, kind: cached}
    - {id: existing_interpro_import, family: D, transmits: false, kind: cached}
    - {id: existing_blast_import,    family: S, transmits: false, kind: cached}
    # a local BLAST result that was written to disk by an earlier run. Replaying it
    # runs no search, so it is `cached`, not `local_search` -- import_only must be
    # able to reproduce a benchmark from the artefacts without touching blastp.
    - {id: existing_local_blast_import, family: S, transmits: false, kind: cached}
    # a remote result already written to disk. Replaying it sends nothing, so it is
    # `cached` like every other import -- the transmission happened when ebi_blastp ran.
    - {id: existing_remote_blast_import, family: S, transmits: false, kind: cached}
    - {id: existing_foldseek_import, family: T, transmits: false, kind: cached}
    - {id: existing_af3_import,      family: T, transmits: false, kind: cached}
    - {id: local_blast_db,           family: S, transmits: false, kind: local_search}
    - {id: local_foldseek,           family: T, transmits: false, kind: local_search}
    - {id: ebi_blastp,               family: S, transmits: true,  kind: remote}
    - {id: ebi_interproscan,         family: D, transmits: true,  kind: remote}
    - {id: hhpred_web,               family: D, transmits: true,  kind: remote}
    - {id: foldseek_web,             family: T, transmits: true,  kind: remote}
    - {id: alphafold_server,         family: T, transmits: true,  kind: remote}
    # Genome annotation, not an evidence family: it produces the INPUT the executor
    # analyses rather than a record about a protein. Registered all the same, because an
    # unregistered provider is refused -- which is how this omission was caught.
    - {id: galaxy_europe_pharokka,   family: null, transmits: true,  kind: remote}
    # Manual / low-volume only. The service asks users not to run bulk annotation,
    # so it must never be selected automatically -- an automated product that works
    # invites exactly the repeated submission they asked people not to do.
    # Re-classified 2026-08-28 after reading its current public API and terms. It is a
    # documented, key-free REST service whose own API page exists for scripted
    # single-genome use; what its terms discourage is BULK, which RBPfinder forbids in
    # code. The earlier `manual only` label was an over-reading of an accurate note.
    - {id: phage_annotation_server,  family: null, transmits: true,  kind: remote,
       usage: scripted_single_genome, automatic_submission: true, bulk_use: forbidden}

  enforcement:
    rule: "a provider whose transmits=true may run ONLY in remote_allowed WITH run authorization"
    on_blocked: "record the record as not_run with the policy as the reason; never silently substitute"
    forbidden: "falling back to a remote provider because a local one returned nothing"

  # What the user actually sees. Not a list of tool choices.
  user_facing_summary:
    - "data handling mode: {mode}"
    - "external sequence submission: {remote}"
    - "local databases: {local}"
    - "missing remote evidence: {on_missing}"


# ---------------------------------------------------------------------------
# DATABASE ACQUISITION -- design frozen 2026-08-22, IMPLEMENTATION DEFERRED.
#
# Written now because the proxy on the build machine exposed a real product
# problem, but deliberately NOT implemented yet: M7C has frozen acceptance
# criteria, a downloader mid-run and an ablation about to execute. Changing the
# download path now would mix "validate the Stage 2 data strategy" with
# "rebuild the install mechanism", and any oddity in the ablation would have an
# extra variable behind it.
#
# Implement after Stage 2 is FROZEN.
# ---------------------------------------------------------------------------
database_acquisition:
  status: DESIGN_FROZEN_IMPLEMENTATION_DEFERRED
  implement_after: stage2_frozen

  # Separation of concerns. The biology decides WHICH database is needed; the
  # resolver decides HOW to obtain it. A rule saying "DB_HOST = Klebsiella genus"
  # must never know whether the bytes came from UniProt, a lab share or a mirror.
  separation:
    rbpfinder_decides: "what database is needed (DB_PHAGE / DB_HOST specification)"
    resolver_decides: "how to obtain it"
    forbidden: "letting acquisition details leak into the database-selection rules"

  priority:
    - preexisting_blast_db
    - direct_compressed_download
    - rest_stream
    - rest_cursor_pagination

  # ---- URL construction (M15C maintenance, 2026-08-25) ---------------------
  # Found by the first real query, and unfindable before it: the fixture queries were
  # simple enough that string concatenation happened to work. A real UniProt query is
  # not. `(taxonomy_id:2731619) AND (length:[150 TO 170])` interpolated raw made curl
  # read the brackets as a glob range and reject the URL before a single byte was sent.
  #
  # curl's globbing is only the loudest symptom. Spaces, `&`, `+`, `#`, `?` and `/` all
  # change the MEANING of a URL rather than breaking it, which is worse: a `&` in a query
  # silently splits it into two parameters and the request succeeds with the wrong query.
  url_construction:
    rule: >
      any value entering a URL -- query strings, path segments, service-supplied ids --
      is built with a URL encoder. Never string concatenation, never interpolation.
    applies_to: [query_strings, path_segments, service_supplied_ids]
    failure_mode: silently_different_request
    why_fixtures_cannot_catch_it: >
      a fixture never has to become a URL, so it cannot exercise the encoding. This is
      the argument for real-network validation stated as a rule.

  # ---- transport retry (M15C maintenance, 2026-08-25) ----------------------
  # Measured that day: a single TLS connect from this machine succeeds 5-8 times out of
  # 10, on EVERY host (UniProt 8/10, EBI 7/10, PyPI 5/10). With bounded retry all three
  # reach 10/10. The earlier reading -- "rest.uniprot.org is blocked" -- came from
  # single probes and was wrong; a transient transport failure was being reported as an
  # unavailable endpoint, which then became a release-evidence excuse.
  #
  # So retry belongs in the transport. It does NOT belong in the resolver: a transport
  # that ran and failed must never cause a different transport to be chosen, because
  # that would silently change which bytes the database is made of.
  transport_retry:
    attempts: 5
    backoff_seconds: [1, 2, 4, 8]
    retry_on:
      transport: [connection_reset, tls_eof, connect_failed, timeout, empty_reply]
      http: [429, 500, 502, 503, 504]
    fail_immediately_on:
      http: "any other 4xx -- it is an answer about the request, not a bad connection"
      integrity: "count/uniqueness/truncation failures never retry and never re-resolve"
    never: "changing transport because a transport failed"
    data_preservation: >
      unchanged. Retry happens before anything is published; a completed database is
      still protected by the no-destructive-write-without-explicit-restart invariant.

  preexisting_blast_db:
    # A bare --blast-db PATH is not enough: Stage 2 needs DB_PHAGE and DB_HOST at
    # the same time, so the flag takes a logical name -> path mapping.
    cli: "--blast-db <logical_name>=<path>, repeatable"
    examples:
      # single-quoted on purpose: in a YAML double-quoted scalar the Windows path
      # separators are read as escape sequences and the file stops parsing
      - '--blast-db phage=C:\rbpfinder\db\caudoviricetes'
      - '--blast-db host=C:\lab\db\uniprot_klebsiella'
    config_alternative:
      blast_databases:
        phage: {path: ..., metadata: ...}
        host: {path: ..., metadata: ...}
    verify_metadata: true
    verify_checksum_when_available: true

  direct_compressed_download:
    preferred: true
    note: "one .fasta.gz is minutes on a normal connection"

  rest_stream:
    fallback_when_direct_unavailable: true

  rest_cursor_pagination:
    fallback_only: true
    resumable: true
    query_bound_state: true
    page_atomic: true
    why_only_a_fallback: >
      it is the ONLY path that works behind this build machine's proxy, which makes
      it easy to mistake for the normal route. It is not: measured 20 s/page here
      against a 2.5-4.8 s server response, so most of the cost is local pathology.
      Shipping it as the default would impose this machine's illness on every user.

  # ---- M15C-2a runtime semantics, frozen before any transport was written -------
  # The hierarchy above says which order to TRY. These rules say what may and may not
  # cause a move down that list, and they are the part that is easy to get wrong.
  runtime:
    method_authority:
      rule: >
        an explicitly requested method is authority, not a preference. `--method direct`
        that cannot run FAILS; it never silently becomes cursor pagination. Only
        `--method auto` walks the hierarchy.
      applies_the_same_rule_as: [blast executable resolver, database precedence]

    # THE invariant of this milestone.
    fallback_invariant:
      allowed: "transport unavailability may trigger fallback"
      forbidden: "integrity failure must NOT trigger fallback"
      why: >
        a 404, an unsupported endpoint or a blocked connection says nothing about the
        data. A checksum mismatch or a record-count shortfall says the bytes are wrong,
        and quietly re-fetching them by another route would dress real corruption up as
        a network compatibility problem -- and hand the user a database that looks
        successfully acquired.
      examples:
        direct_endpoint_404: "may fall back to rest_stream"
        direct_download_checksum_mismatch: "HARD FAIL; no other method is attempted"

    direct_compressed_availability:
      assume_present: false
      enabled_only_when: "the spec supplies a trusted bulk artefact with a stable URL and checksum"
      absent_is_not_a_failure: "auto simply proceeds to rest_stream"

    cursor_pagination_label: fallback_transport
    cursor_pagination_not: slow_transport
    cursor_note: >
      the same code measured ~1,160 records/min one night and ~8,700/min the next
      morning on the same machine. Throughput is a property of the proxy at that
      moment, not of the method; last night's experience must not be encoded as a
      product assumption.

    # Never write into the database people are currently using.
    staging:
      final_destination_is_never_a_download_target: true
      pipeline: [staging, fetch_validate, build, build_validate, atomic_publish, register]
      on_failure:
        existing_database: untouched
        staging: retained_for_resume
        persistent_config: "must not point at a half-built database"
      resume_binding: [spec_hash, biological_query]
      resume_refuses_when: "the staged state belongs to a different spec"

    # Two different strengths of "verified" must never collapse into one boolean.
    verification_levels:
      structural_only:
        blast_sidecars_present: true
        blastdbcmd_checked: false
      blast_verified:
        blast_sidecars_present: true
        blastdbcmd_checked: true
      forbidden: "recording either as a bare verified: true"

  # Promoted to a permanent invariant by M15C-2b gate 13.
  availability_invariant:
    rule: >
      database availability is decided by BLAST sidecars AND by acquisition lifecycle
      state. Any artefact belonging to an acquisition that is not PUBLISHED must never be
      reported AVAILABLE by the resolver, by doctor, or by a run.
    why: >
      without blastdbcmd the file layout alone cannot distinguish "build finished but
      publish did not" from a real database, and a half-built directory that reads as
      available is how a partial dataset becomes a silent scientific error.
    applies_to: [resolver, doctor, run-time database lookup]

  direct_compressed_absence_is_not_an_error:
    rule: >
      when no trusted bulk artefact is defined for a DatabaseSpec, direct_compressed
      reports availability=unavailable with a reason, and `auto` proceeds to the next
      method. That is a normal outcome, not a failure.
    explicit_method_differs: >
      `--method direct` is authority: if it is unavailable the command fails rather than
      silently choosing another transport.

  forbidden:
    - "treating cursor pagination as the normal or default path"
    - "rebuilding a database when a compatible verified --blast-db is supplied"

  # One database identity, whichever of the three sources produced it.
  prebuilt_manifest_fields:
    - database_name
    - taxonomy_id
    - uniprot_release
    - sequence_count
    - fasta_sha256
    - blast_db_manifest_sha256
    - blast_version
  purpose: >
    a lab share, a mirror download and a local build must all resolve to the same
    database identity, verifiable without trusting the source.

# Documentation must separate these two numbers. Reporting the build machine's
# five-hour download as if it were analysis time would give a badly wrong
# impression of what running RBPfinder costs.
runtime_expectations:
  one_time_setup:
    steps: [database acquisition, makeblastdb]
    note: "network-dependent; minutes on a normal connection, hours behind a hostile proxy"
    not_per_genome: true
  per_genome:
    mode_a_local_genbank: "seconds; no network at all"
    mode_b_cloud_annotation: "3-13 min (measured: K11 176 s, T7 197 s, T5 452 s, T4 739 s, EP75 810 s)"
    stage2_local_blast: "seconds per genome"
    ranking_and_audit: "seconds"
  headline: "one genome end to end is minutes, not hours"


# ---------------------------------------------------------------------------
# DATA_PRESERVATION_REGRESSION -- permanent regression class, 2026-08-22.
#
# Raised from "a script bug" to a release gate after a completed 176 MB / 5-hour
# download was destroyed by re-running the command that produced it. A finished
# download stores an EMPTY cursor; the resume branch required a NON-EMPTY cursor;
# execution fell through to a branch that called Clear-Content.
#
# "Re-running does not destroy existing data" is a release requirement in the same
# sense that "finds the right RBP" is. A tool that loses a user's database is not
# usable regardless of how good its predictions are.
# ---------------------------------------------------------------------------
data_preservation:
  invariant: >
    no operation without an explicit --Restart / --reset may delete, truncate or
    overwrite an existing non-empty database file.

  # Structural, not behavioural. The ordinary fetch/continue path must not even have
  # the opportunity to call these -- correctness should not depend on an `if` being
  # written correctly.
  destructive_operations:
    names: [Clear-Content, Remove-Item, "SetLength(0)", overwrite_mode, truncate]
    may_appear_only_in: "an explicit restart/reset function"
    forbidden_in: [fetch_path, continue_path, resume_path, verification_path]
    rationale: >
      an architecture where the destructive call is unreachable from the normal path
      is safer than one where a conditional guards it.

  # State machines take their truth from disk, not from captured output. The wrapper
  # missed a COMPLETE line because stdout was not captured, concluded the download was
  # unfinished, and re-invoked the fetcher -- which then wiped its own result.
  truth_source_priority:
    - disk_state_or_marker_file
    - process_exit_code
    - stdout_log
  stdout_role: "for humans to read; never the source of truth for a persistent state machine"

  # Counting records is not enough: a rewritten file can have the same record count
  # with different content, ordering or line endings.
  regression_test:
    id: DATA_PRESERVATION_REGRESSION
    procedure:
      - "run the fetch to completion"
      - "re-run the same command through the wrapper, without --Restart"
      - "re-run the fetcher directly, without --Restart"
    must_hold:
      - "no network fetch is performed"
      - "the run reports already_complete"
      - "sha256 before == sha256 after"
      - "byte size before == byte size after"
      - "record count before == record count after"
    weakest_acceptable_check: sha256
    why_not_record_count: >
      62 records before and 62 after does not prove the bytes are unchanged.

  idempotency:
    requirement: >
      the first and the tenth run of the same database-preparation command must leave
      the same state on disk, and the tenth run must be near zero cost when a complete
      database is already present.
    applies_to: [database acquisition, makeblastdb, cache population]

stage0:
  input_modes:
    A_annotated:
      recommended: true
      required: [genbank]
      optional: [proteins_faa, cds_table_tsv]
      action: "validate, then proceed to S0.2"
    B_raw_fasta:
      required: [genome_fasta]
      action: "route to s0_cloud_annotation (no breakpoint needed — it is a plain REST call)"
      resume_artifacts: [genbank, proteins_faa, cds_table_tsv]
      forbidden: "silently substituting a different gene caller (changes CDS boundaries)"

  # --- Cloud annotation: pharokka + phold + phynteny in one call, zero install ---
  # This is the cloud-first replacement for the old local-install path AND for the
  # step previously numbered stage3.3a. Verified end to end on 2026-08-19.
  s0_cloud_annotation:
    service: https://phage-annotation.org
    auth: none          # no API key, no account
    input: nucleotide_fasta_only
    limits: {contigs: 20, total_bp: 2000000, upload_mb: 50}
    runs: [pharokka, phold, phynteny]
    # CORRECTED 2026-08-19: the earlier "84 s" figure was read off an in-flight
    # status poll, not a finished job. Real end-to-end timing below.
    observed_runtime:
      genome: NC_043029            # jumbo, 346,602 bp, 549 CDS, prodigal-gv
      pharokka_s: 35
      phold_s: 806                 # 13 m 26 s  <- dominates
      phynteny_s: 599
      total_s: 1440                # ~24 min
      scaling: "approximately linear in CDS count; budget ~1.5 s/CDS for phold"
    observed_coverage:             # same job; see benchmark/q6_cloud_probe/FINDINGS.md
      annotation_method: {foldseek: 378, pharokka: 96, none: 75}
      still_unknown_function: 357  # 65% - structural hits often land on unknown-function PHROGs
    params:
      gene_predictor: {values: [phanotate, prodigal, prodigal-gv], default: phanotate,
                       note: "prodigal-gv for jumbo phages / giant viruses (stage0 branch E)"}
      fast: true
      meta_mode: auto
    endpoints:
      submit: "POST /jobs   (multipart; MUST send Accept: application/json)"
      poll: "GET /jobs/{id}/status.json   (every 10-30 s; never tighter)"
      annotations: "GET /jobs/{id}/browser.json"
      file: "GET /jobs/{id}/files/{path}"
      archive: "GET /jobs/{id}/download"
    key_artifact: phold/phold_per_cds_predictions.tsv
    field_map:                    # 37 columns; see benchmark/q6_cloud_probe/phold_server_columns.txt
      protein_id: cds_id
      genomic_span: [start, end, strand]
      hit_id: tophit_protein
      annotation: [phrog, function, product]
      scores: [bitscore, fident, evalue]
      region_span: [qStart, qEnd, qLen, qCov]     # satisfies region-level evidence requirement
      target_span: [tStart, tEnd, tLen, tCov]
      provenance: [annotation_method, annotation_source]
      confidence: annotation_confidence            # high | medium | low
      threedi_quality: prostt5_confidence
      multi_domain_signal: "*_bitscore_proportion (9 PHROG categories)"
    # --- Signals derived from the phold table (not columns the server labels as such) ---
    derived_signals:
      - id: divergent_fibre
        rule: "fident low AND qCov high AND function == tail"
        empirical: >
          On NC_043029 the structural components (tail tube / sheath / baseplate / major tail,
          n=11) had median fident 0.849 with a floor of 0.629, while fibres and spikes (n=11)
          had median 0.777 but reached 0.115. A tail-annotated CDS whose fident falls below the
          structural floor is a divergent fibre -- the variable-locus signature C5 looks for.
        example: "CDS_0543  fident 0.115  qCov 0.82"
        status: empirical_heuristic_pending_calibration
        threshold_todo: "the 0.63 floor is one genome, n=11. Recalibrate on the validated set."
      - id: uncovered_terminal_region
        rule: "qStart > 1 + margin OR (qLen - qEnd) > margin, on a tail-annotated CDS"
        meaning: "conserved fibre backbone carrying a divergent terminal domain -- candidate RBD"
        example: "CDS_0543 qLen 1194, hit 209-1192 -> 208 aa uncovered N-terminus, fident 0.115"
        frequency_warning: >
          RARE. 13 of 15 large tail proteins were covered full length (<=2 aa uncovered).
          Phold region evidence therefore degenerates to whole-protein in most cases; it does
          NOT provide reliable domain decomposition. Domain-level work still needs AF3/HHpred.

    # --- Measured limits of this channel. Recorded so implementers do not over-trust it. ---
    does_not_do:
      - id: no_dark_matter_rescue
        finding: >
          Of 357 unknown-function CDS on NC_043029, ZERO had tail_bitscore_proportion > 0.2.
          (The *_bitscore_proportion columns are populated on 182/549 rows, so this is a real
          negative, not a parsing artefact.)
        consequence: >
          C3 (dark-matter channel) MUST NOT be made to depend on Phold. Phold confirms and
          types proteins that were already annotatable; it does not pull unannotated proteins
          into the tail category. C3 keeps relying on position (C1/C4) and comparative
          genomics (C5).
        confidence: "n=1 genome, and a jumbo T4-like with unusually good annotation. Recheck on W073/G385."
      - id: no_role_separation_within_tail
        finding: >
          CDS_0540-0549 are ten consecutive CDS all labelled tail fiber / tail spike / tail
          protein. Phold delivers the cluster, not a ranking inside it.
        consequence: "Phold is a nomination + typing channel, never the arbiter for RBP vs connector."

    # --- Empirical support for audit A2 (structure-positive, position-negative) ---
    multi_locus_evidence:
      genome: NC_043029
      tail_cds_loci: ["0043-0046", "0064-0066", "0069-0089 (baseplate)", "0100", "0157", "0480", "0512", "0540-0549"]
      finding: "the main fibre cluster sits ~450 CDS away from the baseplate module"
      consequence: "a single window anchored on the baseplate misses 0540-0549 entirely; audit A2 is mandatory, not optional"

    usage_constraints:
      retention: "results deleted after the server retention window — download immediately"
      rate_limit: "per IP; the bundled example counts too"
      bulk_prohibited: >
        The service explicitly asks users NOT to run bulk annotation against it. Per-genome
        skill use is fine; the benchmark (hundreds of genomes) is exactly the case it asks
        you to avoid. Do not point the benchmark at this service — see benchmark.compute_route.
      terms: "submission implies accepting the site's terms of use — a HUMAN must accept, never the agent"
      data_exposure: "uploaded sequence is processed on shared infrastructure; unpublished genomes need explicit owner consent per submission"

    # --- Degradation: the structural screen is a COST optimisation, never a
    # --- single point of correctness. Observed 2026-08-19: the service was
    # --- unreachable from one network path while fine from another, so this
    # --- branch is a routine operating state, not a rare edge case.
    on_failure:
      triggers: [unreachable, rate_limited, job_failed, consent_withheld, out_of_size_limits]
      flag: STRUCTURAL_SCREEN_UNAVAILABLE
      must_not:
        - "lower any candidate's tier"
        - "drop any candidate from P"
        - "skip structural analysis altogether"
        - "treat a missing Phold call as negative evidence"   # invariant absence_is_not_counter_evidence
      must:
        - "record the flag on every affected evidence record and in the final report"
        - "assign AF3 priority from the remaining families G/S/D/C/M alone"
        - "EXPAND P1 — with no cheap structural triage, more candidates must go to AF3, not fewer"
        - "state in the report that T-family coverage is incomplete, so R1 promotions relying on T were unavailable"
      fallback_routes:
        - id: prostt5_only
          endpoint: "https://3di.foldseek.com/predict/<AA_SEQUENCE>"
          verified: "2026-08-19, 129 aa -> 129 3Di chars, 1.3 s"
          gives: "3Di tokens only — no search backend, so no fold assignment on its own"
          caution: "sequence travels in the URL (server-log exposure); throttle to 1 request / 2 s"
        - id: foldseek_server
          endpoint: "https://search.foldseek.com"
          databases: [BFVD, AFDB50, PDB, ESM30]
          gives: "fold assignment from real structures (AF3), independent of phold"
          loses: "PHROG functional labels and the phage-specific 1.36M-structure database"
        - id: annotated_input
          note: "Mode A — user supplies a GenBank annotated elsewhere; skill proceeds without the cloud call"

  qc_checks:
    - id: completeness
      question: "complete genome or contigs?"
      on_contigs: "warn; module-window channels (C1, C4) degrade in reliability"
    - id: circularity
      question: "circular / terminal repeats present?"
      consequence: "all neighbourhood ops MUST use circular adjacency"
    - id: origin_linearisation
      question: "was the genome linearised inside the structural module?"
      consequence: "tail module may be split across the origin"
    - id: origin_spanning_cds
      question: "any CDS spanning the sequence origin?"
    - id: small_orfs
      question: "very small ORFs possibly missed by the caller?"
      min_aa_to_flag: 30
      calibration: pending
    - id: frameshift
      question: "candidate programmed translational frameshift in tail genes?"
      note: "common in tail assembly chaperones and some fibres; a missed frameshift splits one RBP into two partial CDS"

  circular_adjacency:
    required_for: [c1_window, c4_tandem_cluster, a3_neighbourhood_audit]
    rule: "index arithmetic must be modulo n_CDS when genome is circular"

  near_neighbour_retrieval:
    method: "all-vs-all blastn + VIRIDIC-style intergenomic similarity"
    formula: "sim(A,B) = non-redundant identical bases in A->B and B->A / (len_A + len_B) * 100"
    ictv_reference_values:
      same_genus: 70
      same_species: 95
    usage: "near-relative and reference-panel selection ONLY"
    not_usage: "hard taxonomic routing for all phages"
    limitation: "BLASTN sensitivity collapses at low similarity; switch to protein-level methods (proteome trees, marker phylogeny) for distant relationships"
    untrusted_inputs: [directory_name, sample_label, submitted_taxonomy]

  architectures:
    # emits: loci to prioritise, role templates, k_default. NOTHING that can stop a search.
    A_sipho_gpJ:
      markers: [tape_measure_protein, dit, tal, lambda_like_tail_module]
      expected_rbp_range: [1, 3]
      k_default: 5
      priority_loci: ["gpJ central fibre", "downstream accessory modules"]
    B_myo_baseplate:
      markers: [tail_sheath, tail_tube, baseplate_cluster]
      expected_rbp_range: [2, 4]
      k_default: 6
      priority_loci: ["long tail fibre locus", "short tail fibre locus", "independent adaptor (gp38-like)"]
      note: "RBPs sit in TWO separate loci; single-window scanning systematically misses one"
    C_podo_T7:
      markers: [short_tail, no_tape_measure_protein]
      expected_rbp_range: [1, 2]
      k_default: 4
      priority_loci: ["tail fibre adjacent to tail tube"]
    D_N4_schitoviridae:
      markers: [giant_virion_packaged_rnap]
      expected_rbp_range: [1, 2]
      k_default: 4
      priority_loci: ["single tandem tail fibre cluster"]
    E_jumbo_or_unresolved:
      markers: [genome_length_gt_200kb, unclassifiable]
      expected_rbp_range: null
      k_default: null
      priority_loci: ["whole genome"]
      note: "synteny unusable; C1 degrades to genome-wide scan; no fixed k"
    OUT_OF_SCOPE:
      markers: [inoviridae, tailless, ssdna, rna_phage]
      action: "emit OUT_OF_SCOPE_ARCHITECTURE and stop"
      forbidden: "falling back to tail-module rules"
    calibration: pending

  # -------------------------------------------------------------------------
  # AUTOMATIC ARCHITECTURE TYPING -- M11, rules frozen 2026-08-23 BEFORE the
  # classifier was written and before any confusion matrix was seen.
  #
  # This is a SOFT PRIOR, not a classifier that gates anything. It chooses which
  # windows to prioritise and which k_default to display. It can be wrong and the
  # run must still find every RBP -- which is why the acceptance gate below is
  # recall under auto-typing, not typing accuracy.
  #
  # Signature satisfaction with conflict resolution, never a weighted score: the
  # project has no weighted totals anywhere and this is not the place to introduce
  # a hidden one.
  # -------------------------------------------------------------------------
  architecture_typing:
    implemented: v1_mvp
    role: soft_prior_only
    method: signature_satisfaction_with_conflict_resolution
    forbidden:
      - exclude_candidate_based_on_architecture
      - cap_window_count_based_on_architecture
      - use_benchmark_rbp_labels
      - use_benchmark_architecture_labels_to_build_rules
      - infer_absence_from_missing_annotation
      - weighted_score_across_signatures
      - genome_length_as_primary_criterion
    outputs: [architecture_prior, architecture_confidence, architecture_evidence,
              architecture_conflicts, auto_prediction, user_override, override_used]
    fallback:
      class: E_jumbo_or_unresolved
      on: [conflicting_signatures, insufficient_evidence]
      forbidden: "guessing A-D when no signature is satisfied"

    # Absence is never positive evidence for a class. "No sheath" may only break a
    # tie between classes whose own signatures are already satisfied -- the same
    # invariant as absence_is_not_counter_evidence, applied at Stage 0.
    absence_use: conflict_resolution_only

    signatures:
      # Contractile tail. The sheath is the single most diagnostic component; a
      # tube plus a wedge/hub baseplate is the same machine described part-wise.
      B_myo_baseplate:
        strong_any_of:
          - all_of: ["tail sheath"]
          - all_of: ["tail tube", "baseplate wedge"]
          - all_of: ["tail tube", "baseplate hub"]
        supporting: ["baseplate", "tail sheath stabilizer", "baseplate tail tube cap"]
        note: >
          a dual-role product such as N4 gp65 "tail sheath and receptor binding protein"
          supports the ARCHITECTURE here; it says nothing about whether that protein is
          an RBP. The two questions are answered by different stages.

      # Schitoviridae/N4. Requires the lineage-specific virion-packaged RNAP.
      # Bare "rna polymerase" is NOT accepted: every phage may carry one.
      D_N4_schitoviridae:
        unique_any_of:
          - all_of: ["virion rna polymerase"]
          - all_of: ["n4-like rna polymerase"]
        supporting: ["virion-associated rna polymerase", "vrnap"]
        forbidden_markers: ["rna polymerase"]
        note: "if the specific marker is absent, fall to E -- never infer D by elimination"

      # T7-like short tail. Internal virion proteins are the hallmark ejectosome.
      C_podo_T7:
        # v1.1, 2026-08-23. `internal virion protein` was a strong marker in v1.0 and
        # that was inconsistent with this file's own exclusivity principle: the same
        # test already demotes bare "rna polymerase" for D, because a term shared with
        # other lineages cannot carry a lineage claim on its own. Virion-internal
        # ejection proteins occur well outside the T7 group -- the SMA myoviruses carry
        # "internal virion protein with endolysin domain" -- so it is supporting
        # evidence, never a strong signature. The T7-specific hallmark is the tail
        # TUBULAR module.
        #
        # DISCLOSURE: the inconsistency was noticed while reading the M11 confusion
        # matrix, so the 48 manual labels are no longer a blind set for the B/C
        # boundary. Post-fix accuracy is reported as validated-after-repair, never as a
        # blind estimate.
        strong_any_of:
          - all_of: ["tail tubular protein"]
          - all_of: ["tail tubular"]
        supporting: ["internal virion protein", "short tail", "gp11", "gp12"]
        non_exclusive_markers: ["internal virion protein"]
        contextual_cue_only: ["genome_length_lt_60kb"]

      # Long non-contractile tail. NOTE: a tape measure protein is present in
      # contractile tails too, so it can never separate A from B on its own. The
      # separation is done by B's signature being absent, under absence_use above.
      A_sipho_gpJ:
        strong_all_of_any: ["tail length tape measure protein", "tape measure"]
        supporting: ["major tail protein", "tail terminator", "distal tail", "minor tail"]
        requires_absent_signature_of: B_myo_baseplate

    resolution_order:
      - "D unique satisfied            -> D, confidence high"
      - "B strong satisfied            -> B, confidence high"
      - "C strong satisfied and B not  -> C, high if a supporting marker also present else medium"
      - "A strong satisfied and B not  -> A, high if a supporting marker also present else medium"
      - "more than one strong satisfied across B/C/D -> E, confidence low, conflicts recorded"
      - "no strong satisfied           -> E, confidence low"

    # --- M11 acceptance, frozen before implementation --------------------------
    m11_acceptance:
      primary_metrics: [auto_architecture_candidate_generation_recall,
                        auto_architecture_complete_recall_at_K]
      diagnostic_only: [architecture_classification_accuracy, confusion_matrix]
      why: >
        architecture is not the deliverable. A 90% accurate typer that still recalls
        114/114 is acceptable; a 98% accurate one that mistypes a single myovirus as a
        siphovirus and thereby loses the second tail locus is not.
      checks:
        - "all 48 genomes receive a prior with no --architecture supplied"
        - "low confidence or conflicting signatures fall to E_jumbo_or_unresolved"
        - "architecture changes prior/window/k_default only, never candidate reachability"
        - "SMA candidate_generation_recall stays 114/114 under auto-typing"
        - "hard negatives stay within their ceilings under auto-typing"
        - "per-genome differential: manual label vs auto prior, pool and ranking diffed"
        - "every misclassification reports WHICH signature fired, not just the label"
        - "--architecture remains an explicit override; run_result records
           auto_prediction, user_override and override_used"
      label_use:
        permitted: "the 48 manual architecture labels VALIDATE the typer"
        forbidden: "the same labels participating in rule construction or tuning"

    # Proposed after the M11 confusion matrix was read, therefore NOT implemented on the
    # dataset that suggested it. Registered so the idea is not lost and cannot quietly
    # become part of an accuracy claim.
    future_hypotheses:
      C_podo_shared_marker_rule:
        status: requires_independent_validation
        hypothesis: >
          internal virion protein may support C_podo_T7 at medium confidence only when no
          strong B_myo contractile-tail signature is present -- structurally the same
          shared-marker-plus-absence shape already used for A_sipho_gpJ.
        provenance:
          proposed_after_reviewing_SMA_confusion_matrix: true
        forbidden_for_current_SMA_accuracy_claim: true

# ---------------------------------------------------------------------------
# STAGE 1 — nomination channels (union, add-only)
# ---------------------------------------------------------------------------
# Maps the annotator's function category onto screening_row.module in evidence_schema.json.
# Kept in YAML because it is a biological mapping, not a code detail.
module_map:
  tail: tail_morphogenesis
  connector: tail_morphogenesis      # head-tail joining region; C1 anchors on it
  head and packaging: head_packaging
  "DNA, RNA and nucleotide metabolism": replication
  lysis: lysis
  transcription regulation: regulation
  integration and excision: other
  moron, auxiliary metabolic gene and host takeover: other
  other: other
  unknown function: unknown
  _default: unknown

stage1:
  combine: union
  channels:

    C1_module_position:
      family: G
      # 2026-08-19, v0.4. Was single-window: first start anchor -> first end anchor.
      # On C277cp1a that built a window at CDS_0002..0022 while the real tail locus sat at
      # CDS_0198..0223, 176 CDS away, and all three reference RBPs were never nominated.
      # "Find the tail module" is not "find a stretch near the first tail anchor" -- Myo and
      # jumbo architectures carry the RBP loci in several places.
      mode: multi_window
      procedure:
        - "scan the WHOLE genome for anchors"
        - "cluster anchor positions by genomic distance"
        - "build one window per cluster"
        - "merge overlapping windows"
        - "union of all windows enters P"

      # Anchor strength exists so a generic 'tail protein' cannot inflate a dozen scattered
      # positions into a dozen large windows.
      anchors_strong: [tape measure, tail sheath, tail tube, baseplate, Dit, Tal,
                       major tail, head-tail adaptor, distal tail,
                       tail fiber, tail fibre, tail spike, tailspike]
      anchors_weak: [tail protein, internal virion protein, minor tail]
      anchors_boundary: [portal, terminase, DNA polymerase, primase, helicase,
                         exonuclease, single strand binding, holin, spanin,
                         major head, major capsid]

      cluster_gap_cds: 10           # anchors this close or closer share a cluster
      window_extension_cds_strong: 5
      window_extension_cds_weak: 2
      window_extension_kb: 3        # applied as a UNION with the CDS-count extension
      boundary_truncates_window: true
      calibration: pending
      provenance: >
        extension of 5 CDS covers a typical RBP cassette (SMA W073 CDS0004-0007 and
        G385 CDS0024-0027 are both 4 CDS). Values are uncalibrated and MUST NOT be
        re-fit against the benchmark.

      architecture_is_prior_only: true
      forbidden: >
        capping the number of windows by architecture. A Myo prior says "expect RBPs in
        more than one locus"; it may never become "at most two windows".

      on_all_anchors_failed:
        action: abandon_channel
        emit_warning: "C1_ANCHORS_NOT_FOUND"
        forbidden: "degrading to a window starting at CDS1"
        rationale: "the v0 awk degraded this way and labelled portal + major head protein as accessory RBP candidates"
      window_contents: "ALL CDS in every window enter P -- no size ranking, no filtering"

    C2_annotation_keywords:
      family: G
      # 2026-08-19 executor v0.1: added adsorption / host range / ig domain. PHROG annotates
      # T7 gp17-adjacent proteins as "host range and adsorption protein", which the original
      # list missed entirely despite being the most on-the-nose RBP wording PHROG produces.
      positive_terms: [fib, fibre, fiber, spike, receptor, adhesin, distal tail, baseplate,
                       lectin, depolymerase, sialidase, glycoside, glycosyl, tailspike,
                       Dit, Tal, tip attachment, hydrolase, esterase, peptidase,
                       adsorption, host range, ig domain]
      high_noise_terms:
        - term: hydrolase
          note: "PHROG mis-annotation in SMA data; the CDS was an Ig-domain adapter rod"
          handling: "nominate anyway; the depolymerase ROLE requires structural support in Stage 4"
      rule: "keyword hit nominates; keyword hit alone never assigns a role"

    C3_dark_matter:
      family: G
      rule: "every noPHROG / hypothetical / unknown-function CDS inside the C1 window enters unconditionally"
      priority: highest_recall_value
      rationale: "SMA G385 CDS0026 (129 aa) and CDS0027 (252 aa) were noPHROG yet genuine accessory RBP modules; every annotation-dependent channel misses them"

    C4_tandem_cluster:
      family: G
      # TRANSFERABILITY: a fixed bp cutoff is the single most dangerous number in the
      # whole spec. It sits inside a recall-critical nomination channel, and gene spacing
      # varies by architecture (compact podophage clusters vs sprawling jumbo tail modules).
      # Too tight on an unfamiliar genus => the cluster never links => a real RBP is missed
      # silently. Because C4 only ADDS candidates, generosity is nearly free; tightness is not.
      detection: "same-strand consecutive CDS linked by EITHER rule below (union, not intersection)"
      linkage_rules:
        - id: adaptive_gap
          rule: "intergenic gap <= max(absolute_floor_bp, gap_percentile of THIS genome's own intergenic distribution)"
          absolute_floor_bp: 100
          gap_percentile: 75
          rationale: "scales to the genome being analysed instead of to the genome it was tuned on"
          provenance: "the 100 bp floor came from SMA W073/G385 clusters — kept only as a floor, never as a ceiling"
        - id: cds_neighbourhood
          rule: "within +/-2 CDS of a nominated member regardless of bp gap"
          rationale: "survives large intergenic distances and mis-called intervening ORFs"
      # 2026-08-19 executor v0.1, measured on K11. The YAML anticipated the OPPOSITE
      # failure (threshold too tight -> cluster never links -> real RBP missed silently).
      # The observed failure was degeneration: in a compact T7-like genome most consecutive
      # genes are same-strand with sub-100 bp gaps, so gap-linkage merged nearly the whole
      # genome into ONE cluster and "whole cluster enters" nominated 40 of 55 CDS.
      # A cluster larger than the cap is not a tail-fibre apparatus, it is a linkage artefact.
      max_cluster_cds: 12
      max_cluster_cds_calibration: pending
      max_cluster_cds_provenance: "SMA apparatus clusters were 4 CDS; the NC_043029 fibre cluster was 10"
      on_cluster_exceeds_cap:
        action: "do not bulk-add the cluster; fall back to the cds_neighbourhood rule alone"
        rationale: "the +/-2 neighbourhood is inherently bounded, so recall protection survives"
        emit_warning: C4_CLUSTER_CAP_EXCEEDED
      rule: "if ANY cluster member is nominated by any channel, the WHOLE cluster enters (subject to max_cluster_cds)"
      rationale: "RBPs occur as complete apparatus: adapter -> main RBP -> connector -> distal tip"
      circular_adjacency: required
      calibration: pending

    C5_comparative_variable_locus:
      family: C
      implemented: v1_mvp                 # 2026-08-23
      method: "protein-level blast + synteny against near relatives from S0.2"
      rule: "segments where identity drops sharply against an otherwise conserved backbone enter P"
      strongest_when: "the variable locus correlates with a host-range difference"
      rationale: "SMA N335cp1b1 shares 100% identical gpJ with siblings but lyses 65 vs 2 strains; the difference maps to an accessory adhesin tip at 75.6% identity"
      signature: "conserved -- conserved -- VARIABLE -- conserved -- conserved"

      # ---- Cohort selection. LABEL-FREE, and that is a benchmark-integrity rule,
      # not a preference. The 26 RBP-set clusters used for reporting are DEFINED by
      # the answer; selecting comparators with them would let the truth choose which
      # genomes get compared, and the resulting recall number would mean nothing.
      cohort_selection:
        permitted_inputs: [whole_genome_ani, nucleotide_similarity, proteome_similarity,
                           shared_gene_content, taxonomy]
        forbidden_inputs: [rbp_labels, rbp_cds_ids, benchmark_rbp_set_clusters,
                           hard_positive_flags, any_field_derived_from_ground_truth]
        method: shared_gene_content
        # A band, not a floor. Too distant and the backbone is not conserved enough for
        # "variable against a conserved backbone" to mean anything.
        min_shared_fraction: 0.30
        max_shared_fraction: 0.95
        min_cohort: 3
        max_cohort: 12
        on_too_few: no_comparative_cohort

      # ---- C5 v1.1, EXPERIMENTAL sensitivity branch -------------------------
      # Registered 2026-08-23, AFTER M10 was frozen, and deliberately OFF by default so
      # that a default run still reproduces M10 byte for byte. Activated per run with
      # --c5-near-clone-fallback, the same shape as --allow-remote: the parameters live
      # here, the authorisation is per run.
      #
      # Why it exists: the 0.95 ceiling was written on the assumption that a near-clone
      # carries no variability signal. The detector does not test "is this relative
      # close?", it tests "conserved neighbourhood + sharp local identity drop", so a
      # sibling that is 99% identical genome-wide and 75% at one tail tip is the HIGHEST
      # information comparator available. The YAML's own N335 rationale is exactly that
      # case. Measured cost of the ceiling: 11 of 48 SMA genomes have their only
      # available comparators above it and therefore cannot run C5 at all.
      #
      # Accepting or rejecting v1.1 is NOT decided by complete_recall@K. That would be
      # benchmark tuning. It is decided by: does it fix a `no comparator despite a
      # biologically valid comparator` state, does specificity and pool burden hold, and
      # are the loci produced without touching the truth.
      ultra_close_fallback:
        status: EXPERIMENTAL_SENSITIVITY
        baseline: M10
        enabled_by_default: false
        activation: per_run_flag        # --c5-near-clone-fallback
        trigger: no_primary_comparator  # only when the primary band yields too few
        min_shared_fraction: 0.95
        max_shared_fraction: 1.00
        max_members: 12
        note: >
          a fallback, never a supplement. A database full of near-clones must not be
          allowed to crowd out comparators with real phylogenetic spread, so the ultra
          -close set is consulted ONLY when the primary band cannot fill a cohort.

      # Ten comparators that are the same genome are one observation, not ten. Without
      # this, a clone group votes ten times in the identity baseline and a locus that is
      # divergent in one real lineage looks average.
      clone_group_dedup:
        applies_to: ultra_close_fallback_runs
        method: per_cds_identity_profile
        identity_tolerance_pp: 1.0     # mean |delta identity| within a clone group
        min_profile_overlap: 0.9       # fraction of target CDS both comparators hit
        representative: highest_shared_gene_content
        rationale: >
          computed from the identity vectors already produced by the cohort search, so it
          costs no extra BLAST and uses no taxonomy, no filename and no label.

      # The local test does NOT get easier because a comparator is close. If anything a
      # near-clone should make a local anomaly MORE interpretable, not the bar lower.
      thresholds_unchanged_under_fallback:
        [min_identity_drop_pp, min_flank_presence, require_tail_context]

      ortholog_call:
        method: best_hit_per_cohort_genome
        min_identity_pct: 30
        min_query_coverage_pct: 50
        max_evalue: 1.0e-5
        mvp_limitation: >
          a forward best hit, not a reciprocal best hit. Paralogous tail-fibre families can
          therefore register as present when the true ortholog is absent, which makes this
          test CONSERVATIVE for C5: it under-calls variability, so it can miss a variable
          locus but cannot invent one. Upgrade to RBH before any threshold is loosened.

      # Variability has TWO shapes and v1.0 implemented only the first. The rule text
      # above says "identity drops sharply against an otherwise conserved backbone",
      # and the N335 rationale is explicit that the adhesin tip is PRESENT in every
      # sibling at 75.6% while the backbone is 100%. A presence/absence test is
      # structurally blind to that case: Q185cp1a1_CDS_0222, a confirmed RBP, has an
      # ortholog in 100% of its cohort at 92-100% identity, yet its own mean identity
      # is 57.7% against a 93% neighbourhood.
      variability:
        signals: [absent_or_replaced, present_but_divergent]

        # -- shape 1: the module is gone or swapped for another family
        max_self_presence: 0.5        # ortholog found in at most half the cohort
        min_flank_presence: 0.8       # while its neighbourhood is present in nearly all

        # -- shape 2: the module is there in everyone, but far more divergent than the
        # backbone it sits in. The threshold is on the GAP, never on absolute identity:
        # cohorts differ in how distant they are, and an absolute floor would fire on
        # every gene of a distant cohort and none of a close one.
        min_identity_drop_pp: 20      # percentage points below the flanking mean
        min_presence_for_identity_test: 0.5
        min_flank_identity_samples: 3

        flank_cds: 3
        require_tail_context: true
        tail_context_radius_cds: 5
        circular_adjacency: required

      # ---- Evidence semantics, locked BEFORE any result was seen. ----
      evidence:
        family: C
        direction: supports_apparatus_membership
        strength: moderate
        forbidden_direction: supports_receptor_binding
        why_forbidden: >
          "fast-evolving in near relatives" is not "binds the receptor". Tail structural
          proteins, immunity determinants and anti-defence modules all sit in variable
          loci. Letting comparative variability alone assert receptor binding would make
          every rapidly evolving tail protein an RBP.
        upgrade_condition: >
          a stronger direction is permitted ONLY when a host-range or receptor difference
          co-segregates with the orthogroup across the cohort. That data does not exist in
          v1, so v1 never emits supports_receptor_binding from C5.

    C6_external_ml:
      family: M
      tools:
        - name: phold
          threshold: default
          note: "also yields structural screening output used in Stage 3a"
        - name: phagerbpdetect_v4
          threshold: 0.3
          default_threshold_upstream: 0.5
          calibration: pending
        - name: deposcope
          threshold: lowered
          calibration: pending
      rule: "nomination only; lowered thresholds; never used to filter"
      rationale: "captures RBPs outside the tail module — the blind spot of C1 and C4"

  output:
    pool: P
    typical_size: [8, 20]
    per_candidate_provenance: "list of nominating channels — required"

# ---------------------------------------------------------------------------
# STAGE 2 — sequence evidence (all of P)
# ---------------------------------------------------------------------------
stage2:
  # ---------------------------------------------------------------------------
  # Sequence and profile evidence. The executor never learns whether a result
  # came from EBI, NCBI, a local BLAST or a hand-imported .hhr -- providers
  # normalise everything into EvidenceRecords before it reaches the pipeline.
  # ---------------------------------------------------------------------------

  # SMA genomes are UNPUBLISHED. Submitting a candidate protein to a public
  # service uploads it. That is a different act from reading a local GenBank, so
  # it is off unless a human turns it on for a specific run.
  remote_submission_allowed: false
  remote_policy:
    rule: "the executor MUST NOT send any sequence to a third-party service while this is false"
    override: "--allow-remote on the command line, per run, never persisted"
    on_blocked: "record REMOTE_SUBMISSION_BLOCKED and continue with local providers only"
    forbidden: "silently degrading to a remote call because a local provider returned nothing"

  providers:
    sequence_homology:                       # family S
      - {id: local_uniprot_blast_tsv, kind: local, needs_upload: false}
      - {id: local_blast_tabular, kind: local, needs_upload: false}
      - {id: remote_ebi_blastp, kind: remote, needs_upload: true, implemented: false}
    domain_profile:                          # family D
      - {id: local_interproscan_json, kind: local, needs_upload: false}
      - {id: local_hhpred_hhr, kind: local, needs_upload: false}
      - {id: remote_ebi_interproscan, kind: remote, needs_upload: true, implemented: true}

  # A single top hit is a poor summary. "top hit = hypothetical protein" hides the
  # fact that 6 of the next 9 homologs are annotated tail fibre.
  # ---------------------------------------------------------------------------
  # Local sequence-search cascade. DB1 first: a curated functional annotation is
  # worth more than a bulk phage homolog. DB2 runs only when DB1 produced nothing
  # usable. That keeps the big database off most candidates, and it makes the
  # eventual AF3 justification precise -- "Swiss-Prot searched, phage-UniProt
  # searched, nothing informative" is a far stronger reason for a structure than
  # a bare STAGE2_REQUIRED.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Local sequence-search databases.
  #
  # 2026-08-19: the first design ordered these by ANNOTATION QUALITY -- Swiss-Prot
  # first, TrEMBL as fallback. Measured on the regression panel, Swiss-Prot
  # contributed essentially nothing: 1 hit across 13 proteins, apparatus-level.
  # All 50 decisive W073 homologs are TrEMBL, and the two that settled the RBP
  # call (LamG domain protein, Exo-alpha-sialidase) are unreviewed Stenotrophomonas
  # entries. Reviewed status simply does not track where the signal lives for a
  # non-model host genus.
  #
  # So the layering is by INFORMATION SOURCE, not by curation status.
  # ---------------------------------------------------------------------------
  local_search_databases:
    - id: DB_PHAGE
      scope: "Caudoviricetes UniProtKB, reviewed AND unreviewed"
      # ---- M7C acceptance, frozen 2026-08-22 BEFORE the download finished ----
      # The bar is set now so it cannot be adjusted after seeing which way the
      # numbers fell.
      m7c_acceptance:
        # L0 runs BEFORE everything else. "Downloaded successfully" must mean
        # "complete AND safe to re-run", not merely "the file was once complete".
        l0_data_preservation:
          gate_order: "L0 -> state consistency -> L1 integrity -> makeblastdb -> regression -> ablation"
          checks:
            - "re-run the same command through the wrapper, without --Restart"
            - "re-run the fetcher directly, without --Restart"
            - "expect no network fetch"
            - "expect already_complete"
            - "expect sha256, byte size and record count all unchanged"
          blocking: true
          note: >
            having seen a complete 564,228-record file once is not a reason to skip this.
            That download was destroyed by exactly the rerun this gate tests, so the fixed
            implementation has to prove the property again from scratch.

        # Runs BEFORE integrity. The downloader's bookkeeping was optimised mid-run,
        # and one patch briefly restarted the running count at zero on resume, so
        # every field the state asserts is recomputed independently from the FASTA.
        state_consistency:
          script: scripts/check_download_state.py
          recompute_from_fasta_not_state: [sequence_count, last_accession, bytes_after_append]
          also_checks: [query_binding, cursor_empty]
          rule: "the state file is an assertion under test, never the source of truth"
          completion_judged_by: "cursor empty AND state readable"
          not_judged_by: >
            a sequence count matching an expected total. A count can coincide while the
            cursor still points somewhere, which is how a partial download looks finished.

        # Provenance for the download protocol itself. DB_HOST was fetched with v1 and
        # DB_PHAGE with v2; the content is what matters for the benchmark, but the
        # difference should be traceable rather than mysterious.
        fetcher_provenance_required:
          fields: [script, protocol_version, max_time_seconds, transport_retry_owner,
                   incremental_last_accession, page_size, delay_seconds]
          v1_vs_v2: >
            v1 used curl --max-time 180 with curl's own --retry 3, so a single hung
            connection could cost 4 x 180 s; measured 223 s/page against a 2.5-4.8 s
            server response. v2 gives curl one attempt with a 45 s ceiling and leaves
            retries to the outer checkpointing loop -- measured 6.8 s/page, a 33x
            improvement with no change to what is downloaded.

        integrity:
          - "sequence count within 3% of X-Total-Results at download start"
          - "unique accessions == sequence count, zero duplicates"
          - "no truncated final record"
          - "state file readable, query-bound, cursor cleared"
          - "frozen: query, query_hash, retrieval_start/end, total_at_start, sha256, blast version"
        ablation:
          arms: [DB_PHAGE_only, DB_HOST_only, DB_PHAGE_plus_DB_HOST]
          question_answered: >
            what does each database contribute ALONE, and are they complementary rather
            than merely additive? A combined arm that only reproduces the union of hits
            would mean one database is redundant.
          metrics: [informative_S_rate, positive_rbp_S_rate, apparatus_S_rate,
                    sequence_evidence_exhausted_count, STAGE2_REQUIRED_count,
                    AF3_P1_count, hard_negative_regression, published_validated_ranks]
        must_not_regress:
          sma_candidate_generation_recall: "114/114 -- any drop blocks the milestone"
          hard_negatives: "no negative may exceed its recorded ceiling"
        success_signal: >
          STAGE2_REQUIRED falls substantially and AF3 P1 becomes PURER -- a P1 list that
          means "sequence evidence was searched and exhausted" rather than "never looked".
        note_on_expectations: >
          DB_PHAGE is expected to restore apparatus-level homologs that DB_HOST cannot
          see. N136 CDS0101 is the standing case: it hit a lambda tail fibre in the old
          viral set and fell to uninformative under DB_HOST alone, because a host-genus
          database contains no phage proteins at all.
      supplies: "phage evolutionary homologs -- tail fibres, spikes, baseplate parts"
      fixed: true
      rationale: "every in-scope input is a tailed phage, so this database never varies"
      probed_2026_08_19: {total: 564228, reviewed: 1750, unreviewed: 562478, est_fasta_mb: 253}
      reviewed_share_note: >
        Only 1,750 Caudoviricetes proteins in all of UniProtKB are reviewed -- 0.3%. That
        single number explains the Milestone 7A result: a Swiss-Prot-only DB1 could not
        have worked for phage RBPs no matter how the query was written.

    - id: DB_HOST
      scope: "UniProtKB for the HOST lineage, reviewed AND unreviewed"
      supplies: >
        host-context functional homologs -- the glycan-binding and glycan-degrading
        proteins that actually carry RBP function words (LamG, sialidase, CBM,
        xylanase). These sit in the host and its relatives, not in phage entries.
      fixed: false
      selected_from: "the host taxonomy the USER supplies for this phage"
      # Level is chosen from a PROBED count against a size budget, never fixed at a rank.
      # Probed 2026-08-19 (UniProtKB X-Total-Results, metadata only, nothing downloaded):
      #
      #   Caudoviricetes  564,228   (reviewed 1,750 -- see reviewed_share_note)
      #   Xanthomonadales 1,102,789 | Xanthomonadaceae 779,676 | Stenotrophomonas 131,775
      #   Enterobacterales 2,329,888 | Klebsiella 112,551 | K. pneumoniae 33,248
      #   Pseudomonadales 2,435,457 | Acinetobacter 317,155
      #
      # Order level is NOT universally viable: three of the orders probed exceed 1 M
      # sequences (~1 GB each). Genus level lands in a narrow, workable band across
      # unrelated hosts -- Stenotrophomonas 132k, Klebsiella 113k, Acinetobacter 317k --
      # which is why genus is the default rather than a guess tuned to SMA.
      level_selection:
        default: genus
        budget_sequences: 350000
        widen_to_family_when: "the genus has fewer than 20,000 entries"
        narrow_to_species_when: "the genus exceeds budget_sequences"
        probe_before_download: true
        probe_method: "UniProtKB search, size=1, read X-Total-Results; downloads nothing"
      level: {options: [species, genus, family, order], chosen_by: probed_sequence_count}
      examples:
        - {phage_host: Stenotrophomonas, db_host: "Xanthomonadales or narrower"}
        - {phage_host: Klebsiella,       db_host: "Enterobacterales or narrower"}
      anti_overfit: >
        Xanthomonadales is NOT hardcoded. It is derived at run time from the host the
        user already knows. Writing it into the rules would tune RBPfinder to the SMA
        collection and bias every future Klebsiella / Pseudomonas / Acinetobacter run.
      no_ground_truth_leakage: >
        host identity is an INPUT the user supplies, not something read off the answer,
        so choosing DB_HOST from it does not leak benchmark labels.

  host_unknown_policy:
    rule: "no host taxonomy -> DB_PHAGE only"
    then: "if that yields nothing informative, go straight to the structural layer"
    forbidden: >
      downloading the whole bacterial UniProtKB to cover an unknown host. That destroys
      the cost funnel and the database would never fit on a working machine.

  search_cascade:
    - {step: 1, db: DB_PHAGE, stop_when: "consensus is informative"}
    - {step: 2, db: DB_HOST, runs_when: "step 1 gave nothing, or only apparatus-level hits"}
    - {step: 3, outcome: sequence_evidence_exhausted,
       means: "an AF3 request is justified on evidence, not on absence of effort"}

  # Curation status is kept as PROVENANCE only. It no longer decides anything.
  provenance_tags:
    record: [reviewed_hit_count, unreviewed_hit_count, database_id]
    forbidden: "using reviewed status to order the search or to weight strength"

  # Both databases answer the same question with the same method.
  database_count_rule:
    rule: "DB_PHAGE and DB_HOST never increase the evidence-family count"
    forbidden: "counting a phage hit and a host hit as two independent votes"
    attribution: >
      keep per-database provenance anyway, so "how much did the phage database contribute,
      and how much did host context add?" stays answerable.

  success_criterion:
    is_not: "every candidate gets a hit"
    is: >
      a characterised functional homolog yields high-quality S evidence, while no hit is
      recorded as SEARCHED AND UNINFORMATIVE -- distinct from never searched, which is
      what STAGE2_REQUIRED means.

  homolog_consensus:
    top_n: 10
    max_evalue: 1.0e-03
    report_full_distribution: true
    forbidden: "using only the best hit's description"

  strength_rules:
    consensus_fraction_strong: 0.5
    consensus_fraction_moderate: 0.25
    evalue_strong: 1.0e-20
    evalue_moderate: 1.0e-05
    calibration: pending

  hhpred:
    min_probability_pct: 80
    strong_probability_pct: 95
    breakpoint: HHPRED_BATCH
    manifest_fields: [candidate_id, sequence_sha256, requested_reason]

  interproscan:
    zero_hits_direction: uninformative
    zero_hits_note: >
      Phage structural proteins routinely return zero InterPro matches -- all three W073
      tail-fibre proteins did. Zero hits is dark matter, never counter-evidence, and must
      not lower any tier.

  region_localisation:
    interproscan: locations[].start/end
    hhpred: "Query HMM columns"
    uniprot_blast_tsv: >
      NOT AVAILABLE in this format -- it carries no query span, so an S record covers the
      full length and says so via region.source=manual. A richer BLAST tabular format with
      qstart/qend supersedes it when present.

  # ---------------------------------------------------------------------------
  # annotation_term_map v0 -- benchmark-driven, deliberately not an encyclopedia.
  # Maps a HOMOLOG'S annotation text onto an evidence direction.
  # ---------------------------------------------------------------------------
  annotation_term_map:
    # 2026-08-19. "tail fiber protein" was in positive_rbp_terms and had to move.
    # It is the annotation carried by the WHOLE fibre cluster: on W073 the Ig-adapter
    # rod (CDS0004), the real RBP (CDS0005), the connector (CDS0006) and the tip
    # (CDS0007) all have homologs named "tail fiber protein". The term identifies the
    # APPARATUS; it cannot discriminate receptor binding inside it, and leaving it here
    # lifted three standing hard negatives above their ceilings.
    #
    # This is the RBP_core vs RBP_associated distinction stage4 already draws, and it is
    # the W073 report's own reasoning: CDS0005 is the RBP because its homologs carry
    # LamG lectin / exo-alpha-sialidase / endoglucanase / xylanase annotations, while
    # CDS0006 carries none. Receptor binding needs a FUNCTIONAL term, not a part name.
    # M20-b2A, 2026-09-01: `tail spike` / `tailspike` added here, moved out of
    # apparatus_terms. Unlike `tail fiber` above, a tailspike is ONE protein that both
    # sits in the tail and recognises the receptor -- P22 gp9 is the case. The 2026-08-19
    # reasoning for demoting `tail fiber protein` (a whole cluster shares the annotation)
    # does not apply to it, and the measurement agreed: 2 of 424 candidates change, both
    # confirmed_rbp_core, no tail-fibre subunit touched.
    # M20-b2D4, 2026-09-03: `lectin` REMOVED from this list. It is a molecular activity,
    # not a claim about receptor contact on this protein in this virion, and on its own
    # it produced word-level false conclusions (N136 CDS0100, a human pulmonary
    # surfactant protein reached by HHpred; T4 gp35, an apparatus hinge carrying
    # PROSITE GG_LECTIN). It now falls through to UNINFORMATIVE.
    # The contextual rescue half of the M20-b2D2 contract was NOT adopted: M20-b2D3
    # searched UniProtKB and found it has no real input (OBSERVED_ZERO over 1546
    # accessions; 2 of its 5 context-only phrases match no entry in any taxon).
    # NOT in scope, because none of them was measured: concanavalin, discoidin, LamG,
    # laminin G/-G, carbohydrate-binding, CBM. Several are lectin folds biologically;
    # widening to them would be a new claim, not this adoption.
    positive_rbp_terms: [tail spike, tailspike,
                         receptor binding, receptor-binding, adhesin, host range, adsorption,
                         LamG, laminin G, laminin-G, discoidin, concanavalin,
                         carbohydrate-binding, carbohydrate binding, CBM,
                         depolymerase, glycoside hydrolase, glycosidase, glycosyl hydrolase,
                         sialidase, neuraminidase, hyaluronidase, hyaluronate lyase,
                         pectate lyase, pectin lyase, polysaccharide lyase,
                         endo-alpha-sialidase, endoglucanase, xylanase, endosialidase]
    # M20-b2C2, 2026-09-02. Terms matched as whole tokens instead of naked substrings.
    #
    # `Tal` and `Dit` are genuine baseplate protein aliases and belong in the vocabulary.
    # Three letters matched anywhere in a string is not a name, it is a coincidence
    # generator:
    #
    #     Tal   fired inside porTAL, caTALytic, meTAL, crysTAL, toTAL
    #     Dit   fired inside conDITion, adDITion, eDITing
    #
    # Measured before adoption on the frozen M20-b2C1 corpus: 1181 of 156,987 evidence
    # records changed direction, every one of them apparatus -> uninformative, 621 of
    # them portal proteins. 0 new hard negatives, completeness unchanged on 548 runs.
    #
    # A term listed here is matched with non-alphanumeric boundaries on both sides, so
    # ordinary punctuation still delimits it: `(Tal)`, `Tal/Dit`, `baseplate-Tal` all
    # match. Case-insensitive, exactly as substring matching already was -- introducing a
    # regex must not quietly change case semantics too.
    #
    # This key is REQUIRED. `Rules.get()` raises on a missing key, and that is the
    # intent: if it were dropped from a package and the code fell back to substring
    # matching, the 1757-record defect would come back silently.
    token_match_terms: [Tal, Dit]

    positive_terms_provenance: >
      every functional term above is attested in an SMA per-phage report. LamG was added
      because W073 CDS0005 has a "LamG domain-containing protein" homolog that the first
      version scored as uninformative -- a real gap, not a benchmark-driven addition.
    # M20-b2A, 2026-09-01: `tail spike` / `tailspike` REMOVED from here and added to
    # positive_rbp_terms above. A tailspike is a dual-role virion component whose
    # annotation supports direct receptor binding.
    #
    # Generic `tail fiber` / `tail fibre` deliberately STAY. The term names a
    # multi-protein fibre apparatus and can describe subunits that never contact the
    # receptor -- T4 gp35 (hinge) and gp36 (small distal) are both annotated `Long-tail
    # fiber protein gpNN` and are curated `connector_baseplate` by this project. That is
    # the same reasoning the 2026-08-19 note above gives for demoting it in the first
    # place, found again from the other end.
    #
    # `tip attachment` stays too: ambiguous between binding AT the tip and attaching the
    # tip, with no positive/negative panel to settle it.
    apparatus_terms: [tail fiber, tail fibre,
                      distal tail, tip attachment, baseplate wedge, tail tip,
                      tail terminator, Dit, Tal]
    structural_only_terms: [baseplate, connector, tail tube, tail sheath, major tail,
                            tail adaptor, tail adapter, Ig-like, immunoglobulin,
                            collagen, fibritin, trimerisation, trimerization,
                            assembly chaperone, tail assembly, head-tail]
    high_noise_terms:
      - term: hydrolase
        note: >
          bare 'hydrolase' is not a depolymerase. W073 CDS0004 carries PHROG hydrolase and
          is an Ig-adapter rod -- it is a standing hard negative. A hydrolase hit needs a
          specific glycan-active term or structural support before it counts as positive.
        handling: "does not count toward positive consensus on its own"
      - term: peptidase
        handling: "does not count toward positive consensus on its own"
      - term: esterase
        handling: "does not count toward positive consensus on its own"
    uninformative_terms: [hypothetical protein, uncharacterized protein, unknown function,
                          putative protein, DUF]
    calibration: pending
    provenance: "seeded from the SMA regression panel; extend only when the benchmark shows a miss"

  outputs:
    per_candidate: [homolog_consensus_table, domain_hits, profile_hits]
    missing_evidence: "recorded explicitly as an uninformative EvidenceRecord, never omitted"

stage3:
  # ---------------------------------------------------------------------------
  # Structural evidence -- family T. Same provider pattern as Stage 2: the
  # executor never learns whether a result came from the Foldseek web server, a
  # local Foldseek, an existing AF3 job or a hand-imported old analysis.
  # ---------------------------------------------------------------------------
  remote_submission_allowed: false      # inherits the Stage 2 rationale: unpublished genomes

  providers:
    structural_homology:
      - {id: local_foldseek_json, kind: local, needs_upload: false}
      - {id: local_af3_model, kind: local, needs_upload: false}
      - {id: remote_foldseek_server, kind: remote, needs_upload: true, implemented: false}

  # Which Foldseek databases can carry FUNCTIONAL identity. PDB and CATH entries are
  # characterised structures with descriptive titles; AFDB/BFVD/MGnify entries are mostly
  # uncharacterised predicted models whose title is just an accession, so they can support
  # apparatus membership at most.
  functional_databases: [pdb100, cath50]
  apparatus_only_databases: [BFVD, afdb50, afdb-proteome, afdb-swissprot, bfmd,
                             gmgcl_id, mgnify_esm30]

  hit_consensus:
    top_n: 10
    min_probability: 0.5
    max_evalue: 1.0e-03

  # A structural hit to something merely NAMED a tail fibre is apparatus membership,
  # exactly as in Stage 2. The same fix was already forced there: on W073 the adapter rod,
  # the real RBP, the connector and the tip all have tail-fibre-named relatives.
  # Receptor binding needs a functional identity -- CBM, lectin, glycosidase, sialidase,
  # a characterised tailspike binding domain -- not a part name.
  direction_rule:
    reuse: stage2.annotation_term_map
    applied_to: "the Foldseek target's DESCRIPTION, not its accession"

  # AF3 geometry is a shape heuristic and can never, on its own, mean receptor binding.
  # Elongated + trimeric describes an Ig adapter rod and a collagen fibre just as well as
  # a real RBP, so allowing it would systematically promote the hard negatives.
  geometry:
    is_heuristic: true
    may_support: [fibrous_stalk, head_plus_stalk, structural_fibre]
    may_never_support: supports_receptor_binding
    rg_ratio_fibrous: 1.5
    calibration: pending

  # ---------------------------------------------------------------------------
  # Leakage guard. landscape_groups.csv clusters SMA proteins by TM >= 0.5, and some
  # groups contain reference RBPs. "Shares a fold group with another SMA candidate that
  # happens to be in the answer key" is not evidence -- it is the answer key leaking into
  # the prediction. Fold-group co-membership may support apparatus membership only.
  # ---------------------------------------------------------------------------
  internal_fold_group_guard:
    rule: "co-membership of an internal SMA fold group MUST NOT confer receptor-binding evidence"
    max_direction: supports_apparatus_membership
    rationale: "the reference set is the ground truth; deriving RBP-ness from it is circular"

  decorrelation:
    reuse: evidence_families.correlations
    note: >
      a ProstT5/Phold Foldseek hit and a real-AF3 Foldseek hit to the same target family
      count ONCE in T; the real-structure result supersedes the prediction rather than
      adding a second vote.

  # ---------------------------------------------------------------------------
  # AF3 priority. NOT "run AF3 on whatever is still in doubt" -- that rule produces
  # selection bias and works against recall, because a novel RBP with no BLAST, no
  # InterPro and no HHpred result is exactly the case that needs structure most, and
  # exactly the case a doubt-based rule ranks lowest. The criterion is INFORMATION GAIN.
  # ---------------------------------------------------------------------------
  af3_priority:
    forbidden_rule:
      id: run_only_if_still_in_doubt
      why: "selection bias; violates invariant absence_is_not_counter_evidence"

    P1_mandatory:
      any_of:
        - id: context_strong_sequence_empty
          test: "G family present AND an S/D provider RAN and returned nothing informative"
          not_the_same_as: >
            "no S/D record exists". A candidate nobody has searched yet is UNKNOWN, not
            empty -- invariant absence_is_not_counter_evidence. Measured 2026-08-19: with
            the looser reading, 96 of C277cp1a's 126 candidates became P1, which is not a
            priority list, it is the whole pool.
        - id: dark_matter_in_rbp_cluster
          test: "unannotated CDS nominated by C3 or C4"
        - id: variable_locus
          test: "nominated by C5"
        - id: ml_nominated_unexplained
          test: "nominated by C6 while annotation stays uninformative"
        - id: modular_tail_fibre_length
          test: "length_aa >= modular_fibre_min_aa and apparatus evidence present"
        - id: evidence_conflict
          test: "one counted record supports receptor binding while another supports non-RBP identity"
          note: "structure is the arbiter the precedence ladder calls for"
      modular_fibre_min_aa: 600
      calibration: pending

    P2_recommended:
      any_of:
        - id: localise_rbd
          test: "receptor-binding evidence exists but is not localised to a sub-region"
        - id: separate_rbp_from_adapter
          test: "tier R2 or R3 with apparatus evidence only"
        - id: primary_set_decision
          test: "ranked inside k_default but not yet R1"

    STAGE2_FIRST:
      test: "no sequence or profile provider has run for this candidate"
      action: "emit STAGE2_REQUIRED, not an AF3 request"
      rationale: >
        BLAST is cheap and AF3 is not. Ordering a structure prediction for a protein that
        has never been searched inverts the cost funnel.

    P3_unnecessary:
      any_of:
        - id: positive_non_rbp_identity
          test: "tier N"
        - id: role_already_resolved
          test: "R1 with a localised receptor-binding region from a characterised structure"

    batch:
      breakpoint: AF3_MONOMER_BATCH
      auto_submit: false
      manifest_fields: [candidate_id, priority, trigger, sequence_sha256, length_aa,
                        requested_reason]
      rule: "emit the request list only; a human runs AF3 and returns the models"

  multimer:
    stage: 3d
    blocking_for_milestone_6: false
    note: "adapter<->RBP and RBP<->tip topology; not needed to answer the G385 question"


# ---------------------------------------------------------------------------
# EVIDENCE FAMILIES -- count independent FAMILIES, never tools
# ---------------------------------------------------------------------------
evidence_families:
  definitions:
    G: "genomic context -- module position, synteny neighbourhood, tandem cluster, annotation keyword"
    S: "sequence homology -- UniProt/NCBI blastp homolog functional annotations"
    D: "domain / profile -- InterProScan, HHpred, PHROG"
    T: "structural -- Foldseek (ProstT5 or real structure), AF3 geometry"
    C: "comparative genomics -- variable locus, host-range-linked divergence"
    M: "machine learning -- PhageRBPdetect, DepoScope, SpikeHunter"

  counting_rule: "within a family take the STRONGEST evidence; each family contributes AT MOST ONE independent unit"

  correlations:
    # 2026-08-19 executor v0.1. Found while implementing: C2 matches keywords IN THE PHROG
    # PRODUCT STRING. The D-family record for the same CDS is that same PHROG assignment.
    # Counting both is the anti_pattern in its purest form -- one annotation, two votes.
    - tools: [c2_keywords, pharokka_phrog, phold]
      relation: "C2 reads the product string that the PHROG assignment produced"
      rule: >
        a C2 keyword hit whose match came from the annotator-assigned product contributes NO
        independent G unit; it collapses into the D record for that CDS. G is then earned only
        by genuinely positional channels (C1, C3, C4).
    - tools: [pharokka_phrog, phold]
      relation: "Phold's database core derives from PHROG"
      rule: >
        a Phold call that merely echoes the PHROG annotation counts ONCE, in D. Phold
        contributes an independent T unit only when its hit is a structural match to
        PDB/AFDB/BFVD not traceable to the PHROG label.
    - tools: [foldseek_on_prostt5, foldseek_on_af3_structure]
      relation: "same search, different structural input"
      rule: "hits to the same target family count once in T; a real-structure hit supersedes the ProstT5 hit"
    - tools: [interproscan, hhpred]
      relation: "both profile-based"
      rule: "count once in D; HHpred supersedes on conflict"
    # 2026-08-19. An HHpred hit to a PDB template and a Foldseek hit to that same PDB
    # entry are ONE datum seen two ways -- the same template match, once by profile
    # inference and once by structural alignment. Letting both stand would give G385
    # CDS0026/0027 a D and a T unit off the single 9RQI hit.
    - tools: [hhpred, foldseek_structure]
      relation: "the same structural template reached by profile vs by structure"
      rule: >
        when both name the same PDB identifier, count ONCE. The real-structure result
        supersedes the profile inference and the unit lands in T; the HHpred record is
        kept and marked superseded_by, never deleted.
      note: "does not apply when they hit genuinely different templates"
    - tools: [phagerbpdetect, deposcope, spikehunter]
      relation: "overlapping public training sets"
      rule: "count once in M regardless of how many agree"
    - tools: [c1_module_position, c2_keywords, c3_dark_matter, c4_tandem_cluster, phynteny]
      relation: >
        all read the same annotated genome. Phynteny assigns PHROG categories to unknown CDS
        from SYNTENY -- gene-order context -- so it is genomic context, not a second opinion
        on top of Phold.
      rule: "count once in G"
      caution: "Phynteny arrives in the same server response as Phold; co-delivery is not independence"

  # phold reports hits against its OWN bundled databases, whose ids come from several
  # namespaces: `protein<N>` (PHROG-derived) and `envhog_<id>` (the EnvHog environmental
  # protein set) are both observed. None of them is a PDB / AFDB / BFVD structure.
  #
  # 2026-08-21: the first version of this pattern matched only `protein<N>`, so a single
  # `envhog_2TI6j` tophit on T7 was read as a genuine structural source and tripped the
  # Stage 6 A2 capability probe. EnvHog is another sequence-derived database, so counting
  # it as T would have been exactly the double-counting the de-correlation rules exist to
  # stop. The test is now on the namespace, and it is a WHITELIST of what may count as T
  # rather than a blacklist of what may not.
  phold_internal_tophit_pattern: "^(protein[0-9]+|envhog_.+|acr_.+|defensefinder_.+|card_.+|vfdb_.+)$"
  phold_phrog_derived_tophit_pattern: "^(protein[0-9]+|envhog_.+|acr_.+|defensefinder_.+|card_.+|vfdb_.+)$"

  # A hit may be promoted to an independent T unit ONLY if its target is a real structure
  # entry. Anything else stays in D no matter which phold sub-database produced it.
  structure_database_tophit_pattern: "^(pdb[_|:]?[0-9A-Za-z]{4}|[0-9][A-Za-z0-9]{3}_[A-Za-z0-9]+|AF-[A-Z0-9]+-F[0-9]+|BFVD_.+|MGYP[0-9]+)$"

  # 2026-08-19, v0.4. C1, C3, C4, A1a, A1b and A3 all answer "is this CDS worth LOOKING at?",
  # from the same annotated genome. Four of them agreeing is still one genomic-context unit.
  # They raise visibility, never confidence.
  visibility_channels_are_one_unit:
    tools: [c1_module_position, c3_dark_matter, c4_tandem_cluster,
            s6_a1_module_sweep, s6_a1b_tail_adjacent_unknown, s6_a3_neighbourhood]
    rule: "count once in G, no matter how many of them fired"

  # An audit is an error-correction mechanism, not biological evidence.
  stage6_recovery_confers_no_tier_advantage:
    rule: >
      a CDS recovered by Stage 6 is tiered by exactly the same rules as one nominated by
      Stage 1. S6-* provenance is recorded so the Stage 1 miss stays visible, and it
      contributes nothing to tier_r or tier_e.

  # ---------------------------------------------------------------------------
  # GENERAL PRINCIPLE, frozen 2026-08-21 after the Milestone 8A finding.
  #
  # Capability detection must POSITIVELY IDENTIFY the namespace it is looking for.
  # It must never infer a capability from the absence of a known one -- "this hit
  # is not from a sequence database, therefore it is structural" is invalid.
  #
  # The 8A case: the A2 probe blacklisted phold's `protein<N>` ids and treated
  # everything else as structural. phold reports against several bundled
  # sequence databases, so `envhog_2TI6j` (T7) and `WP_069473082.1` (lambda,
  # an NCBI RefSeq protein) both read as structural evidence that did not exist.
  #
  # This class of bug is more dangerous than an ordinary annotation error: it
  # manufactures a PHANTOM INDEPENDENT EVIDENCE FAMILY. A wrong annotation moves
  # one candidate; a phantom family silently inflates tier_e for every candidate
  # the source touches, and the de-correlation rules cannot catch it because the
  # family looks legitimately distinct.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # DUAL-ROLE PROTEINS: a structural role and RBP_core are NOT mutually exclusive.
  #
  # N4 gp65 forms the phage tail sheath AND is required for adsorption, interacting
  # directly with the E. coli outer-membrane receptor NfrA (McPartland & Rothman-Denes
  # 2009). Under annotation alone, "tail sheath protein" resolves to
  # structural_only, so a true RBP_core protein is tiered R3.
  #
  # The conservative keyword rule is NOT relaxed to fix this -- loosening it would
  # re-promote W073 CDS0004 (Ig adapter rod) and N136 CDS0100 (collagen stalk), both
  # standing hard negatives. The correct resolution is precedence:
  # ---------------------------------------------------------------------------
  dual_role_precedence:
    rule: >
      direct experimental or structural receptor-binding evidence OVERRIDES an
      annotation-derived structural_only direction. A structural name may never veto
      a positive binding result.
    forbidden: "using a structural product name to exclude a protein from RBP_core"
    recall_is_unaffected: >
      gp65 still enters pool P regardless: 'tail sheath' is a C1 strong anchor, so the
      protein is nominated and audited either way. The cost of the conservative reading
      falls on RANKING, not on candidate generation -- exactly the split that
      candidate_generation_recall exists to keep visible.
    benchmark_use: "N4 gp65 is the standing regression case for this rule"

  capability_detection_principle:
    rule: "detect by whitelist of known identifier namespaces, never by exclusion"
    forbidden: "treating 'not a recognised sequence database' as evidence of a structure database"
    applies_to: [structural_sources, machine_learning_sources, any_future_evidence_family]
    failure_mode: phantom_independent_evidence_family
    why_worse_than_annotation_error: >
      an annotation error misplaces one candidate; a phantom family inflates tier_e
      across every candidate that source touches, and de-correlation cannot detect it
      because the family appears genuinely distinct.
    review_check: "when adding any provider, ask what its identifiers look like BEFORE deciding which family it feeds"

  anti_pattern:
    description: "counting '5 of 6 methods positive' as 5 independent votes"
    correct_form: "count independent FAMILIES, not tools"

  constraint_G_alone:
    rule: "G alone can never reach R1"
    rationale: >
      every structural component of the tail also sits in the tail module; genomic context
      cannot distinguish RBP from connector.

stage4:
  candidate_unit: "CDS + region"
  rationale: "whole-protein search lets a dominant structural domain drown a terminal receptor-binding domain in a large tail fibre"
  region_sources: [foldseek_hit_span, interpro_domain_span, hhpred_alignment_span, plddt_segmentation, low_complexity_repeat_boundaries]
  protein_call_derivation: "protein-level role is derived from its regions; RBP evidence must be localised to a residue range"

  # product-string -> evidence direction. Checked in the order given by direction_precedence.
  direction_map:
    supports_receptor_binding: [tail fiber, tail fibre, tail spike, tailspike, receptor,
                                adhesin, lectin, depolymerase, sialidase, adsorption,
                                host range, tip attachment, glycoside, glycosyl]
    supports_non_rbp_identity: [DNA polymerase, RNA polymerase, primase, helicase, exonuclease,
                                endonuclease, terminase, major head, head assembly, portal,
                                holin, spanin, amidase, ligase, kinase, methyltransferase,
                                transcription, nucleotide]
    supports_structural_only: [tail tube, tail sheath, major tail, baseplate, head-tail adaptor,
                               connector, tail protein, internal virion protein,
                               structural protein, ig domain]
    _default: uninformative
  direction_precedence: [supports_receptor_binding, supports_non_rbp_identity, supports_structural_only]

  # A compound title normally resolves to the conservative reading. These terms are
  # the exception: they are an EXPLICIT functional claim, not an incidental keyword,
  # so a co-occurring structural word must not demote them.
  #
  # 2026-08-21. The conservative rule was added for three real cases where an RBP word
  # appeared without an RBP claim:
  #   `glycosyl` matched inside `glycosylase` (a DNA repair enzyme)
  #   `tail fiber` in "tail fiber assembly protein" (the head noun is the chaperone)
  # Applying it blindly then broke N4 gp65, whose RefSeq product is literally
  # "tail sheath AND receptor binding protein" -- an explicit dual role, confirmed by
  # both the adsorption experiments and the 9LC0 cryo-EM structure. The distinction is
  # grammatical: is the RBP word the claim, or a modifier on something else?
  explicit_rbp_terms:
    - receptor binding
    - receptor-binding
    - adsorption protein
    - host range and adsorption
  explicit_rbp_rule: >
    when a product contains one of these, the receptor-binding direction stands even
    if a structural term co-occurs. This is what makes dual_role_structural_rbp
    representable at all.
  forbidden: >
    letting an annotation-derived structural word suppress an explicit receptor-binding
    claim. N4 gp65 is the standing regression case.

  # annotator confidence -> evidence strength
  confidence_map:
    high: strong
    medium: moderate
    low: weak
    pharokka: moderate
    none: weak
    _default: weak

  role_vocabulary:
    RBP_core:
      - id: main_rbp
        criteria: "receptor-binding fold (CBM / lectin / tailspike beta-helix / glycosidase) localised to a region, plus fibrous geometry or head-stalk architecture"
      - id: depolymerase_rbp
        criteria: "glycosidase catalytic domain plus structural fibre stalk"
      - id: distal_tip_rbp
        criteria: "compact distal domain WITH direct receptor-contact evidence"
    RBP_associated:
      - id: distal_tip_unproven
        criteria: "compact distal domain, credible interface with the main RBP, but no direct binding evidence"
      - id: ig_adapter_rod
        criteria: "tandem Ig-like beta-sandwich, elongated but ordered full length, no head domain"
      - id: connector_baseplate
        criteria: "well folded, homolog annotations baseplate/tail protein, no glycan-binding or enzymatic signal"
      - id: structural_fibre
        criteria: "fibrous but no binding head"
    structural_tail_component:
      - id: assembly_chaperone
        criteria: "fibritin / collagen repeat / trimerisation domain, homolog annotation assembly chaperone"

  experimental_candidate_set: "RBP_core UNION selected RBP_associated"

  tiers:
    axis_likelihood:
      R1:
        label: "strong RBP"
        require_all:
          - ">= 2 independent evidence families supporting a receptor-binding role"
          - "at least one family from {T structural fold, D domain, S direct RBP-family homology}"
          - "no hard_contradiction"
        forbid: "G-only support"
      R2:
        label: "plausible RBP / recall-protection"
        require_any:
          - "strong G or C signal PLUS at least one additional positive evidence family, direct receptor-binding evidence incomplete"
          - "strong T evidence but ambiguous or absent genomic context"
      R3:
        label: "RBP-associated"
        require: "clearly part of the receptor-binding apparatus, but no direct receptor-recognition evidence"
      N:
        label: "positive non-RBP assignment"
        require: "hard_exclusion evidence"
    axis_completeness:
      E3: ">= 3 independent evidence families"
      E2: "2 independent evidence families"
      E1: "1 family, or unresolved"
    report_format: "<CDS>: <R><E>   e.g. CDS0025: R1-E3"
    calibration: pending

  weighted_score:
    permitted: false
    reason: "no calibration dataset exists; evidence sources are correlated; a numeric total would fake a precision we do not have"
    revisit_when: "benchmark with >= 3 architectures and a leakage-checked positive/negative split exists"

  downgrade_levels:
    hard_exclusion:
      requires: "positive strong evidence of non-RBP identity"
      examples: [dna_polymerase, terminase, primase, helicase, major_capsid, portal, holin, endolysin, transcription_factor]
      effect: "tier N; still reported in all_CDS_screening.tsv"
    strong_downgrade:
      requires: "multiple structural AND sequence lines converging on assembly-only role"
      effect: "tier R3; remains in output"
      ceiling_rule: "a structural-protein-like fold with no known CBM can reach AT MOST strong_downgrade — a novel receptor-binding fold is indistinguishable from this"
    no_positive_evidence:
      is_a_downgrade_reason: false
      effect: none
      note: "listed explicitly so implementations cannot treat it as a third downgrade tier"

  terminology:
    forbidden_word: "exclusion (except hard_exclusion)"
    preferred_word: "downgrade"

# ---------------------------------------------------------------------------
# STAGE 6 — RBP completeness challenge (mandatory, adversarial)
# ---------------------------------------------------------------------------
stage6:
  name: "RBP completeness challenge"
  mandatory: true
  skippable_when_expected_count_met: false
  framing_question: "If my current result is wrong or incomplete, which CDS am I most likely to have missed?"

  audits:
    A1_module_sweep:
      question: "which CDS in the tail/morphogenesis module never entered P?"
      action_on_hit: "reopen pool"
      # 2026-08-19, v0.4. A1 previously saw ONLY CDS whose function category is
      # tail_morphogenesis. A dark-matter RBP is by definition 'unknown function', so the
      # candidates most worth protecting were invisible to the audit that exists to protect
      # them. On C277cp1a, CDS_0221 and CDS_0223 sit either side of CDS_0222 (a real tail
      # component) and were still never flagged.
      sub_checks:
        A1a:
          scans: "CDS whose module is tail_morphogenesis"
        A1b:
          scans: "hypothetical / unknown / noPHROG CDS in the neighbourhood of a tail_morphogenesis CDS"
          adjacent_unknown_radius_cds: 3
          max_unknown_chain: 4
          independent_of_c1_window: true
          rationale: >
            deliberately does not read the C1 window. If C1 builds its windows in entirely
            the wrong place, A1b can still recover an RBP through
            'tail CDS -> adjacent unknown CDS'.
          bounded_because: >
            an unbounded unknown-island walk would re-explode the pool on compact genomes,
            which is exactly the failure max_cluster_cds was added to stop.
    A2_context_negative_signal_positive:
      question: "genome-wide, which CDS have positive structural (Phold/Foldseek) or ML signal but negative positional signal?"
      rationale: "the classic scattered-RBP miss that C1 and C4 structurally cannot see"
      action_on_hit: "reopen pool"
    A3_neighbourhood:
      question: "for EVERY assigned RBP, do the +/- N flanking CDS contain a possible accessory RBP or distal tip?"
      n_cds: 3
      calibration: pending
      circular_adjacency: required
      action_on_hit: "reopen pool"
    A4_variable_locus_accounting:
      question: "is every comparative-genomics variable locus explained by an assigned candidate?"
      action_on_hit: "reopen pool"

  # --- Capability gating. An audit that cannot run must say so, never pass. ---
  a2_capability:
    requires_genome_wide_family_any_of: [T, M]
    t_source_test: >
      a structural hit whose target is NOT matched by
      evidence_families.phold_phrog_derived_tophit_pattern. A phold hit against its own
      PHROG-derived database is D and may never be promoted to T to make A2 runnable.
    m_source_test: "any C6 machine-learning tool result present in the run"
    on_unavailable: not_executable_due_to_missing_genomewide_T_or_M
    note: "capability-aware: the same code begins executing as soon as a qualifying source appears"
  a4_capability:
    requires_channel: C5
    on_unavailable: not_executable_due_to_missing_C5
    # Three states, not two. The same distinction as searched-no-hit vs never-run:
    # a capability that exists and had nothing to work on has ANSWERED the question,
    # while a capability that does not exist has not. Collapsing them would leave every
    # single-genome run permanently terminated_cleanly=false, which trains people to
    # ignore the flag.
    on_no_cohort: not_applicable_due_to_no_comparative_cohort
    no_cohort_counts_as_resolved: true
    states:
      not_implemented: "C5 code absent -> unresolved, termination not clean"
      implemented_but_no_comparator_data: >
        C5 present, no cohort passed cohort_selection (single genome, or no relative in
        the shared-gene-content band) -> A4 resolved as not_applicable, clean termination
        permitted
      executable: "C5 present and a cohort was selected -> A4 accounts for every variable locus"

  a3_applies_to:
    tiers: [R1, R2]
    also_any_definition_layer: [RBP_core]

  # Stable hit identity = (audit_id, cds_id, reason_class). Guarantees idempotence:
  # a hit already acted on is never re-opened in a later cycle.
  reason_classes:
    A1: tail_module_cds_not_in_pool
    A1b: unknown_cds_adjacent_to_tail_module
    A2: genomewide_signal_without_positional_support
    A3: flank_of_assigned_rbp
    A4: unexplained_variable_locus

  reopen:
    counts: "cycles in which the pool actually changed, NOT audit invocations"
    reenters_at: stage2
    max_cycles: 3
    on_cap_reached: "report REOPEN_CAP_REACHED with the unresolved CDS list — never silently stop"

  termination_condition: "all four audits return either no unexplained CDS, or unexplained CDS each carrying a written reason"

# ---------------------------------------------------------------------------
# STAGE 7 — output
# ---------------------------------------------------------------------------
stage7:
  # Added by executor v0.1: stage7 said "topped up with the strongest R2" without defining
  # strongest. Ranking must be total and deterministic or reruns reorder candidates.
  ranking:
    order_by:
      - {key: tier_r, direction: asc, scale: [R1, R2, R3, N]}
      - {key: tier_e, direction: asc, scale: [E3, E2, E1]}
      - {key: independent_family_count, direction: desc}
      - {key: receptor_binding_family_count, direction: desc}
      - {key: max_receptor_binding_strength, direction: desc, scale: [strong, moderate, weak]}
      - {key: cds_id, direction: asc}
    final_tiebreak_must_be_deterministic: true

  candidate_set:
    sizing: dynamic
    primary_set:
      typical_size: [2, 4]
      contents: "R1 candidates, topped up with the strongest R2"
      meaning: "recommended wet-lab targets"
    rescue_set:
      typical_size: [1, 3]
      contents: "remaining R2, plus R3 carrying any direct-binding hint"
      meaning: "carried purely to protect recall"
    truncation_to_k:
      permitted: false
      note: "a phage with six R1/R2 candidates reports six; the experimental budget is the user's decision"

  outputs:
    - file: "all_CDS_screening.tsv"
      mandatory: true
      granularity: "one row per CDS in the genome"
      purpose: "post-mortem — must be able to answer 'why was CDS0041 not a candidate?'"
    - file: "RBP_candidates.tsv"
      granularity: "one row per candidate REGION"
    - file: "RBP_candidates.faa"
      header_format: ">{phage}_CDS_{id} {annotation} {start}..{end} {aa}aa {phrog} {tier} {role} rbd:{region}"
    - file: "RBP_report.md"
      contents: [per_protein_interpretation, apparatus_topology, evidence_table, completeness_audit_log, heuristic_disclaimers, wet_lab_recommendations]
    - file: "completeness_audit.json"
      contents: [audit_results, reopen_cycles, unresolved_cds_with_reasons]

# ---------------------------------------------------------------------------
# BENCHMARK — gates v1.1; no threshold above may be re-fit without it
# ---------------------------------------------------------------------------
benchmark:
  # Composition measured 2026-08-19 — see benchmark/DATASET_ASSESSMENT.md
  sets:
    positive: "experimentally or literature supported true RBPs"
    hard_positive: "divergent, hypothetical/noPHROG, multi-RBP phages, accessory RBPs"
    negative:
      definition: "structural proteins from WITHIN the same tail module (the hard negatives)"
      status: POPULATED                       # 2026-08-19
      file: benchmark/SMA_hard_negatives.tsv
      n: 3
      members: [W073cp2a2_CDS0004, W073cp2a2_CDS0006, W073cp2a2_CDS0030]
      removed_2026_08_19:
        - {member: N136cp1a1_CDS0100, moved_to: ambiguous_or_associated,
           reason: "a hard negative that legitimately reaches R2 was never hard enough"}
      provenance_rule: >
        every entry carries previous_label + label_status, so a demotion is auditable and
        doubles as a regression test. W073_CDS0004 and N136_CDS0100 were both demoted by the
        same precedence rule RBPfinder enforces internally: a later high-resolution analysis
        (HHpred / Foldseek / AF3) overturns an earlier low-resolution summary annotation.
      regression_use: >
        if the hydrolase keyword ever pushes W073_CDS0004 back to R1/R2, C2 high_noise_terms
        handling has regressed.
    # 2026-08-19. Neither side of the evidence supports a hard call, so it carries no
    # benchmark obligation in either direction: not a positive the finder must recover,
    # not a negative it must suppress.
    ambiguous_or_associated:
      members: [N136cp1a1_CDS_0100]
      include_in_complete_recall_denominator: false
      include_in_hard_negative_regression: false
      rationale: >
        the per-phage report confirms only CDS0101 and CDS0102, so there is no basis to
        restore it as a confirmed RBP. But its profile is not a clean structural-collagen
        case either: HHpred returns 96.4% collectin / C-type lectin and 82.1%
        mannose-binding lectin, and the original manual note called it a suspected distal
        tip adhesin. A collectin is a collagen stalk PLUS a lectin head, so the hit titles
        cannot say which part the alignment covered. Calling it a hard negative would force
        the benchmark to demand suppression of a reasonable RBP_associated candidate.
      revisit_when: >
        AF3/Foldseek resolves the aligned region. A collagen-stalk-only match sends it back
        to hard_negative; a distinct lectin/RBD head promotes it to RBP_core. Do not decide
        that in advance of the structural evidence.
      value: >
        a good system should keep it as apparatus-associated without calling it RBP-core
        absent direct RBD localisation -- exactly the three-layer definition in stage4.

    negative_narrow:
      source: "0806 KL2 阴性结果相关序列"
      nominal_n: 50
      effective_n: 22        # 90% identity clustering; top two clusters hold 30 of 50
      finding: "all exactly 578 aa; 100% of pairs >70% identity — one homologous family, not a general negative set"
      usable_for: "one specific discrimination question (is this family a KL2 depolymerase?)"
      forbidden: "using this as benchmark.sets.negative"

  strata:
    klebsiella_depolymerase:
      source: "0706-已经报道的RBP_核查补全版.xlsx"
      n_records: 180
      evidence: "100% grade A (154 recombinant protein / direct activity, 26 DepoCat experimental)"
      genomes_with_accession: 153
      unique_accessions: 105
      unique_phages: 129
      host_genus: "Klebsiella only"
      rbp_type: "capsule depolymerase only"
      capsule_types: 93
      lifecycle: {lytic: 160, prophage: 20}
      metric_supported: known_RBP_recall_at_K       # NOT complete_recall
      reason: "only the known depolymerase is labelled per genome; other RBPs in the same genome are unannotated"
    published_validated:
      # Two-stage construction, locked 2026-08-21:
      #   structured resources -> DISCOVERY / triage  (which phages to review)
      #   primary literature   -> ADJUDICATION         (what the ground truth is)
      # A structured resource may never become ground truth on its own.
      name: "Published wet-lab-validated benchmark"
      construction:
        stage_1_discovery:
          sources: [uniprot_experimental_evidence, depocatalog, published_rbp_compilations]
          answers_only: "which public model phages are worth human review"
          forbidden: "letting a structured resource define ground_truth_status"
        stage_2_adjudication:
          source: primary_literature
          must_establish:
            - "which proteins have experimental receptor-binding / adsorption / host-range support"
            - "whether several RBPs exist, and whether they can be listed completely"
            - "which neighbouring tail proteins are assembly / helper / baseplate / connector, NOT RBPs"
          output: benchmark/published_validated_adjudication.tsv

      # Split by whether the literature supports a COMPLETE per-genome RBP set.
      # This absorbs the Klebsiella lesson: a true single positive still cannot
      # support a phage-level complete-recall denominator.
      subsets:
        published_validated_complete:
          admits: "literature supports a substantially complete known RBP set for this phage"
          supports_metric: complete_recall_at_K
        published_validated_positive_only:
          admits: "specific proteins are wet-lab validated, completeness unknown"
          supports_metric: known_RBP_recall_at_K
          forbidden: "entering the complete_recall denominator"

      # Model phages are deeply represented in PHROG / UniProt / structure databases,
      # so a good score here can be memorisation rather than inference.
      # ---- Leakage grading, frozen 2026-08-21 before M8B was executed ----
      # Graded, not boolean. 98% identity over one short conserved domain and 98%
      # over 95% of the length are not the same kind of memory, so identity is
      # always read together with coverage.
      leakage_tiers:
        L0:
          label: no_obvious_near_exact_memory
          criteria: "no hit above L1 thresholds"
        L1:
          label: close_family_homolog_present
          min_identity_pct: 40
          min_query_coverage: 0.50
        L2:
          label: near_exact_homolog
          min_identity_pct: 90
          min_query_coverage: 0.80
        L3:
          label: exact_or_self_equivalent_entry
          min_identity_pct: 98
          min_query_coverage: 0.95
        calibration: pending
        both_axes_required: >
          a tier is only reached when identity AND coverage clear it. High identity over a
          short conserved stretch stays at the lower tier.

      # Reporting an identity number is not enough. The question the reader has is
      # "would this still rank here without the memorised entry?", so the analysis
      # masks the leakage-carrying evidence and re-runs the tiering.
      # ---- Scope of the leakage measurement. Naming discipline, not a detail. ----
      # phold's own fident/qCov conveniently answer both "which CDS is this true RBP"
      # and "does the annotation database already contain a near-exact copy". That is
      # cheap and correct FOR THAT SOURCE ONLY. It says nothing about whether UniProt,
      # HHpred or the PDB also hold a near-exact entry.
      leakage_measurement_scope:
        measured_sources: [phold, phrog]
        not_measured: [uniprot_blast, hhpred, interproscan, pdb, afdb, bfvd]
        report_name_when_only_annotation_db_masked: annotation_db_leakage_aware
        forbidden: >
          calling a run `leakage_aware` without qualification while only annotation-database
          evidence was masked. The unqualified name claims every evidence source was
          de-memorised, which would overstate what was done.
        to_widen_scope: >
          mark leakage per evidence FAMILY with its own source measurement, then the
          unqualified name becomes accurate.

      leakage_counterfactual:
        mandatory: true
        method: "mask evidence records whose supporting hit is L2 or L3, then re-tier and re-rank"
        report_per_true_rbp: [tier_with_all_evidence, rank_with_all_evidence,
                              tier_after_masking, rank_after_masking,
                              families_lost_to_masking]
        preferred_over: "dropping samples above an identity cutoff"
        why: >
          a cutoff throws away the sample and answers nothing; the counterfactual answers
          the actual question, which is how much of the result the memory was carrying.

      leakage_reporting:
        mandatory: true
        report_as: [published_validated_raw, published_validated_leakage_aware]
        record_per_protein: [query_target_identity, self_family_proximity,
                             exact_or_near_exact_homolog_in_annotation_db]
        forbidden: "merging these results into the SMA primary metric"

      first_batch:
        size: [10, 11]
        selection_rationale: "deliberately spread across architecture and RBP type"
        candidates: [T4, T5, T7, lambda, P22, Sf6, SPP1, K1F, BPP-1, N4, EP75]
        additions:
          N4: "retained despite thin discovery coverage; gp65 has direct receptor evidence"
          EP75: "added as a genuine multi-RBP system (four tailspikes with O-antigen
                 specificity data), rather than replacing N4"
        multi_rbp_representative: EP75
        leakage_stress_case: T4
        gate: "each phage passes a completeness gate BEFORE being assigned to a subset"

      # A discovery resource missing a protein says nothing about the biology.
      # Swiss-Prot triage returned almost nothing for N4, yet N4 gp65 has direct
      # deletion/complementation, adsorption and receptor-interaction evidence. Dropping
      # N4 on that basis would let resource coverage shape the benchmark's scope.
      discovery_coverage_caveat:
        rule: "structured-resource coverage never determines benchmark membership"
        flag: structured_resource_undercovered
        applies_to: [N4, EP75]
        remedy: "literature-sourced candidates are added manually and adjudicated normally"

      # ---- Frozen 2026-08-21, from the first literature adjudication round ----
      # ---- Operational standard for whole_phage_complete, frozen 2026-08-21 ----
      # The naive reading of "complete" would demand an experiment proving every other
      # tail protein never touches the host. Nothing in the literature is written that
      # way, so that standard admits nothing and the subset stays empty forever.
      #
      # What can actually be established, and what T5 satisfies:
      whole_phage_complete_standard:
        requires_all:
          - "a reasonably complete inventory of the adsorption apparatus components"
          - "every known receptor-recognition STEP assigned to a named protein"
          - "no unassigned receptor-binding step left open in the literature"
        does_not_require: >
          proving experimentally that each remaining tail protein never contacts the host
        discriminates:
          T5_passes: >
            the two-stage recognition is fully assigned -- pb1 to reversible O8/O9 LPS
            contact, pb5 to irreversible FhuA -- and the remaining tip proteins (p132
            collar, pb4 central fiber, pb3 baseplate hub, pb9 distal tail) carry
            structural or mechanical roles. Nothing is left unattributed.
          T7_fails: >
            the same literature that establishes gp17 as the reversible LPS RBP also
            describes a SUBSEQUENT irreversible interaction whose participating protein
            was not determined. That open step is exactly what blocks completeness.
        note: >
          the discriminator is not how strong the positive evidence is -- T7 gp17 is as
          clean as pb5. It is whether the literature leaves a recognition step unassigned.
        ground_truth_source: >
          literature only. Cloud annotation of the tail region is executor regression
          material and must never be used to argue completeness.

      completeness_rules:
        - id: binding_does_not_imply_completeness
          rule: "direct binding or adsorption evidence does NOT imply whole-phage RBP completeness"
          why: >
            "at least two proven RBPs" and "these are all the RBPs" are different claims.
            T4 has direct receptor evidence for gp37 AND gp12, and still cannot be called
            complete until a source rules out a third. T7 is the clearest case: gp17 is a
            proven reversible LPS RBP, but the same literature describes a subsequent
            irreversible interaction whose participating protein was undetermined.
          consequence: "a phage enters positive_only unless completeness is argued explicitly"

        - id: enzymatic_plus_localisation
          rule: >
            demonstrated enzymatic activity against a known host-surface receptor, PLUS
            virion or tail localisation, is strong experimental support for RBP_core.
          not_sufficient: "a product name containing 'tailspike' or 'tail fiber'"
          why: >
            keeps enzymatic RBPs (P22 gp9, Sf6 TSP, K1F EndoNF, EP75 TSP1-3) and
            non-enzymatic ones (lambda gpJ, T4 gp37, N4 gp65) under ONE operational
            definition, instead of letting annotation vocabulary decide the route.

      regression_classes:
        - id: compound_title_helper
          description: >
            a product name carrying BOTH an RBP word and a helper/structural word, where
            the protein is the helper. Recurs across independent systems: W073 CDS0004
            (PHROG 'hydrolase', an Ig adapter rod), N136 CDS0100 ('collectin, c-type
            lectin', a collagen stalk), T4 P04532/P03739 and lambda P03740 ('Tail fiber
            assembly protein', all chaperones).
          status: standing_regression_class
          rule: "resolve to the conservative reading; only adjudication may overturn it"
        - id: dual_role_structural_rbp
          description: "a structural tail component with direct receptor-binding evidence"
          example: "N4 gp65 -- tail sheath, binds NfrA"
          status: standing_regression_class
          rule: "see evidence_families.dual_role_precedence"

      adjudication_fields: [phage, protein, role, definition_layer, receptor,
                            experimental_assay, direct_binding_evidence,
                            adsorption_evidence, host_range_evidence,
                            structural_evidence, primary_reference,
                            ground_truth_status, completeness_status,
                            ambiguity_note, leakage_risk]
      ground_truth_status_values: [confirmed_rbp_core, rbp_associated, hard_negative, ambiguous]
      reuses_existing_semantics: "same four labels as the SMA layer; no parallel vocabulary"

      # --- retained from the 2026-08-20 draft of this stratum ---
      # Proposed 2026-08-20; ground truth NOT yet adjudicated, so this stratum is not
      # live. It complements SMA rather than replacing it: public, wet-lab validated,
      # cross-host, and it carries its own hard negatives.
      seed_source: >
        87 curated RBP-like entries already present in the local reviewed viral subset,
        e.g. T5 pb5 (P23207, FhuA), T4 gp37/gp35/gp12, T7 gp17, lambda P03764,
        P22 tailspike P12528, K1F endosialidase Q04830, BPP-1 Mtd Q775D6.
      built_in_hard_negatives: >
        the same set contains T4 tail fibre assembly helper, Mu tail fibre assembly
        proteins U/U', and six T4 baseplate wedge proteins -- all named "tail fibre" or
        sitting in the apparatus while being chaperones or structural parts. They test
        RBP_core vs RBP_associated vs structural_tail_component directly, and they are
        the public counterpart of the SMA W073 CDS0030 case.
      # Memorisation is the central threat here, so the split is defined BEFORE any run.
    sma_stenotrophomonas:
      # Inventory measured 2026-08-19 -> benchmark/SMA_inventory_report.md
      name: "SMA expert-reference benchmark"
      forbidden_name: "experimentally validated benchmark"
      naming_rationale: >
        ground truth here is curated_computational_structural (AF3 + Foldseek + HHpred +
        phylogeny expert reading), NOT wet-lab validation. This stratum measures whether
        RBPfinder can automatically reproduce and completely cover the expert reference set.
        It must stay separated from the Klebsiella grade-A wet-lab stratum.
      source: "_phylo_all/master_inventory.csv, expanded, plus per-phage report corrections"
      source_is_insufficient_alone: >
        master_inventory lists unique RBP SEQUENCES; complete_recall needs the complete RBP
        set PER GENOME. It must be expanded over `members`, supplemented with structure-only
        and novel RBPs that are absent by construction, and corrected where a later per-phage
        report overturns it.
      n_phages: 48
      n_rbp_assignments: 114
      rbp_count_distribution: {1: 6, 2: 19, 3: 22, 4: 1}
      genomes_local: true                     # pharokka_annotation/*.genbank, no upload needed
      architectures: {A_sipho_gpJ: 23, B_myo_baseplate: 12, C_podo_T7: 11, D_N4_schitoviridae: 2}
      dark_matter_phages: 29
      metric_supported: complete_recall_at_K
      note: "currently the ONLY stratum that can support the primary metric"

  primary_metric:
    name: complete_recall_at_K
    definition: "for a phage with n true RBPs, success iff ALL n appear in the top K"
    K_values: [3, 4, 5, 6]
    scale: phage_level_binary
    binary_rule: >
      3 of 3 -> 1. 2 of 3 -> 0. 1 of 3 -> 0. Partial recovery is NOT 66.7% complete recall;
      it is a failure for that phage. Protein-level recall may be reported SEPARATELY but
      must never be blended into or labelled as complete recall.
    requires: "complete per-genome RBP annotation — only the SMA stratum qualifies today"

  # --- How SMA results must be reported. Locked 2026-08-19. ---
  reporting_layers:
    - id: A_per_phage
      unit: "48 genomes"
      purpose: "inspection — which strain missed which RBP"
      is_headline: false
    - id: B_cluster_weighted
      unit: "26 unique RBP-set clusters, equal weight each"
      purpose: "THE primary benchmark metric"
      is_headline: true
      rationale: >
        8 Smasvirus strains share one identical RBP protein set; unweighted they would
        contribute 8 successes for a single biological result and inflate the metric 8-fold.
    - id: C_raw_48
      unit: "48 genomes, unweighted"
      purpose: "supplementary — behaviour on the dataset as it actually is"
      is_headline: false
  sensitivity_analysis:
    identical_genome_dedup:
      mandatory: true
      pairs: [[B091cp2a, D462cp2a]]
      note: "identical nucleotide sequence, different filenames and file hashes; recompute
             with one of each pair removed and report alongside, so pseudo-replication
             cannot be raised against the result later"
  secondary_metric_for_partial_labels:
    name: known_RBP_recall_at_K
    definition: "was each KNOWN RBP recovered in the top K"
    applies_to: [klebsiella_depolymerase]
    interpretation:
      miss: "a genuine failure signal"
      extra_candidate: "UNINTERPRETABLE — cannot distinguish false positive from a real second RBP"
    forbidden: "reporting this under the name complete_recall_at_K"
  # Separates the two failure modes that complete_recall@K conflates.
  candidate_generation_recall:
    definition: "of the expert-reference RBPs, how many entered P after Stage 1 + Stage 6"
    scale: protein_level
    why: >
      'not in P' is a candidate-GENERATION failure (C277cp1a). 'in P but ranked 55' is an
      EVIDENCE failure (N136 CDS0101, a confirmed tailspike depolymerase that pharokka
      calls hypothetical). Fixing them needs opposite work, so they must be measured apart.
    more_informative_than_complete_recall_while: "Stage 2 and Stage 3 are unimplemented"

  # --- Reporting rules frozen 2026-08-23 (M11) -------------------------------
  reporting_rules:
    complete_recall_at_k_default:
      must_report: [numerator, denominator]
      forbidden_use: "comparing architecture-classifier versions"
      why: >
        E_jumbo_or_unresolved carries k_default=null, so a genome that falls to E leaves
        the DENOMINATOR. M11 measured 30/48, 27/35 and 18/36 across three typers whose
        candidate pools and rankings were byte-identical -- the ratio moved only because
        the denominator did. Cross-version comparison uses the fixed-K curve.
      k_default_is: >
        a presentation prior: how many candidates to show by default. It is NOT a claim
        that every true RBP lies within that K.

  secondary_metrics: [candidate_generation_recall, mean_candidate_burden,
                      per_architecture_recall, per_host_genus_recall]
  forbidden_metrics: [accuracy, f1, auroc]
  stratification: [architecture, host_genus, rbp_count]
  leakage_check:
    mandatory: true
    against: "public training sets of every ML tool used in C6"
    identity_thresholds: [100, 90]
    reporting: "overlapping entries reported as a separate stratum"
    severity_note: >
      Near-certain for the klebsiella_depolymerase stratum: it is curated from DepoCatalog,
      a public database, while DepoScope is trained on depolymerase sequences and
      PhageRBPdetect's training data likely includes many of the same entries. These 180
      records are plausibly INSIDE the training sets of the very tools being evaluated.
    blocking_rule: "no M-family result may be reported for this stratum until the leakage check has run"

  # Locked 2026-08-20. Each step tests ONE hypothesis; running them in parallel would
  # confound "is the database strategy sound?" with "does the cloud link work?".
  work_order:
    - {step: 1, id: db_host_acceptance, tests: "does a host-genus DB supply functional homologs the phage DB cannot?"}
    - {step: 2, id: stage2_strategy_frozen, depends_on: 1,
       note: "if step 1 fails the database strategy changes, so nothing downstream may start first"}
    - {step: 3, id: cloud_provider_smoke, depends_on: 2,
       scope: "2-3 PUBLIC phages (T5/T7/lambda) only",
       verifies: [submit, poll, retrieve, format_normalisation, provenance]}
    - {step: 4, id: published_ground_truth_adjudication, depends_on: 3}
    - {step: 5, id: published_validated_benchmark, depends_on: 4}
  forbidden: "opening a second large workstream before step 1 reports"

  # The benchmark must NOT reuse the skill's own cloud route. See stage0.s0_cloud_annotation.
  compute_route:
    status: RESOLVED_FOR_SMA          # 2026-08-19
    resolution: >
      No cloud call is needed for the SMA stratum: 83 pharokka .genbank files already exist
      locally in pharokka_annotation/, covering all 48 phages, and the executor consumes them
      through input Mode A. The bulk-annotation conflict with the shared free service does not
      arise. Trade-off: no phold output, so the run flags STRUCTURAL_SCREEN_UNAVAILABLE and
      T-family evidence is absent — which the degradation path already handles without
      lowering any tier.
    still_unresolved_for: [klebsiella_depolymerase]
    legacy_status: UNRESOLVED
    conflict: >
      Cloud-first makes phage-annotation.org the runtime path for a single genome, but that
      service explicitly asks users not to run bulk annotation against it. A benchmark over
      hundreds of validated genomes is precisely bulk annotation. The runtime route and the
      benchmark route therefore cannot be the same.
    options:
      - id: local_linux
        note: "install pharokka+phold on any Linux box / lab server / HPC; fastest and fairest. Not this Windows machine."
      - id: stratified_subset
        note: "cut the benchmark to a few dozen genomes stratified by architecture and host genus; stays within polite use but weakens per-stratum statistics"
      - id: ask_maintainers
        note: "contact the phage-annotation.org maintainers describing the academic purpose and request a quota"
    rule: "never silently point a bulk benchmark run at the shared free service"

# ---------------------------------------------------------------------------
# BREAKPOINTS
# ---------------------------------------------------------------------------
breakpoints:
  max_human_touchpoints_per_genome: 3
  defined:
    - id: ANNOTATION_REQUIRED
      stage: 0
      returns: [genbank, proteins_faa, cds_table_tsv]
    - id: HHPRED_BATCH
      stage: 2
      returns: [hhr_files]
    - id: AF3_MONOMER_BATCH
      stage: 3b
      returns: [af3_model_zips]
    - id: AF3_MULTIMER_BATCH
      stage: 3d
      returns: [af3_multimer_zips]
  error_states:
    - id: OUT_OF_SCOPE_ARCHITECTURE
    - id: C1_ANCHORS_NOT_FOUND
    - id: REOPEN_CAP_REACHED


# ---------------------------------------------------------------------------
# PRODUCT CONTRACT -- v1, frozen 2026-08-23 (M12)
#
# Written after the engine was measured, and deliberately NARROWER than the
# original ambition. The old contract asked for four things that pull against
# each other: miss no true RBP, keep the shortlist small, adapt to every tail
# architecture, and recover proteins that have no homolog anywhere. Held all at
# once as hard promises, they are what grew G/S/D/T/C, Stage 6, architecture
# typing, provider policy, leakage checks, C5 and AF3 priority.
#
# What the measurements actually showed:
#   * candidate generation misses nothing (114/114 across 48 genomes);
#   * after full Stage 2 there is NO failure of the form "correct evidence,
#     ranker did not surface it" -- every miss is missing evidence;
#   * C5 recovers some of those and structurally cannot recover the rest;
#   * architecture typing changes neither pool nor ranking.
#
# So the binding constraint is evidence availability, not machinery. v1 promises
# what the evidence supports and says so plainly when it cannot compress.
# ---------------------------------------------------------------------------
product_contract:
  version: v1
  goal: >
    Given a tailed dsDNA phage genome, generate a high-recall, interpretable
    experimental shortlist of candidate receptor-binding proteins.

  output_layers:
    - id: primary
      meaning: "proteins with the strongest evidence for a direct receptor-binding role"
      default_visible: true
    - id: rescue
      meaning: >
        additional proteins retained because excluding them would create an
        unacceptable false-negative risk
      default_visible: true
    - id: completeness_assessment
      meaning: >
        whether the available evidence is sufficient to compress the candidate space
        confidently, or whether unresolved candidates remain
      default_visible: true
    - id: internal_pool
      meaning: "the recall-protection pool Stage 6 audits against"
      default_visible: false
      note: >
        an implementation detail. Judging the product by its size is a category error:
        a median pool of 31 with a primary set of 2-4 is not a 31-protein ask.

  non_goals:
    - "identification of every true RBP in every phage"
    - "a universally fixed maximum shortlist size"
    - "complete automatic interpretation of every tail architecture"
  non_goal_rationale: >
    Measured on SMA, some myovirus RBPs have no sequence homolog in either local
    database and no comparative signal in any available relative. Promising to find
    every one of them forces an endless march of new evidence channels. The honest
    output for those genomes is a stated limitation, not a silently widened rescue set.

  # Two states that were previously one boolean. "The program finished" and "the
  # biology is settled" are different claims and were being conflated by
  # terminated_cleanly, which read as failure whenever an OPTIONAL capability had
  # nothing to do.
  run_status:
    values: [completed, failed]
    meaning: "did the executor finish and write a schema-valid result"

  # M14A calibration. Before it, every one of 48 genomes reported `limited` and the
  # signal carried no information: one environment-wide gap (A2 has no genome-wide T/M
  # source on this machine) and one near-universal fact (some tail CDS has no homolog)
  # were both being scored as severe.
  #
  # Two different questions, now two different fields:
  #   completeness_assessment  how much SAMPLE-SPECIFIC unresolved RBP risk remains
  #                            after the analyses that actually ran
  #   assessment_coverage      whether the optional/deep audit capabilities relevant to
  #                            this run were available at all
  #
  # An environment gap can cap the assessment, but must never by itself produce
  # `limited` -- otherwise a well-resolved phage on an under-equipped machine is
  # indistinguishable from a genuinely intractable one.
  completeness_assessment:
    values: [complete, partial, limited]
    meaning: >
      how much sample-specific unresolved RBP risk remains after the analyses that ran
    semantics:
      complete: >
        assessment coverage is full AND no sample-specific unresolved locus of concern
      partial: >
        localized unresolved risk exists, OR assessment coverage is reduced, but no
        module-scale unresolved region is present -- the shortlist is still a meaningful
        experimental compression
      limited: >
        sample-specific unresolved risk is module-scale, or otherwise makes the short
        experimental shortlist unreliable; Primary+Rescue must NOT be read as
        close to exhaustive
    derivation:
      sample_specific_risk_none_and_coverage_full: complete
      sample_specific_risk_none_and_coverage_reduced: partial
      sample_specific_risk_localized: partial
      sample_specific_risk_substantial: limited
    forbidden:
      - "widening the rescue set until recall looks complete"
      - "an environment-wide capability gap producing `limited` on its own"
      - "choosing a state by whether the reference RBPs happen to be in the shortlist"

  # Kept separately so the reason for a `partial` is never lost. "This phage looks
  # converged, but this installation did not run the full audit" and "this phage has an
  # unresolved module" are different findings that would otherwise print the same word.
  sample_specific_assessment:
    values: [complete, partial, limited]
    meaning: "the assessment from sample evidence ALONE, before any coverage cap"

  reported_completeness:
    definition: "sample_specific_assessment, capped by assessment_coverage"
    note: >
      `completeness_assessment` in run_result IS this reported value. The uncapped
      judgement stays available as sample_specific_assessment.

  assessment_coverage:
    values: [full, reduced]
    meaning: >
      were all optional/deep completeness-audit capabilities relevant to this run
      available. This is a property of the INSTALLATION, not of the phage.
    reduced_caps_assessment_at: partial
    note: "a run with reduced coverage may not report a bare `complete`"

  limitation_kinds:
    capability_unavailable:
      scope: environment
      effect: "assessment_coverage -> reduced; caps assessment at partial"
      never: "produces `limited` on its own"
    sample_specific:
      scope: sample
      effect: "localized -> partial; substantial -> limited"
    informational:
      scope: run
      effect: "none -- recorded so the user knows what did and did not run"

  limitation_sources:
    - id: audit_not_executable
      kind: capability_unavailable
      text: "completeness audit {audit} could not run: {blocker}"
    # C5 already answers this in three states, and `no comparator` is the RESOLVED one.
    # Re-importing it as a completeness penalty would flatten that three-state model back
    # into two and punish every single-genome run.
    - id: no_comparative_cohort
      kind: informational
      text: "comparative analysis had no informative cohort, so it was not applicable"
    # A fact, not a severity. Some tail protein having no homolog is ordinary. It becomes
    # serious only when the exhausted proteins form a stretch that cannot be ruled out.
    - id: sequence_evidence_exhausted_tail
      kind: sample_specific
      severity: partial
      text: "sequence evidence exhausted for {n} tail-associated candidate(s)"
      note: "a FACT about the sequence layer; severity comes from the locus rule, not from n"
    # Severity by SCALE, not by the mere presence of a C5 finding -- "there is a C5
    # locus" must not be a shortcut to `limited`.
    - id: unresolved_variable_tail_locus
      kind: sample_specific
      severity: by_unresolved_locus_rule
      text: "comparative analysis identified {n} unresolved variable tail locus/loci"
    # Renamed in M14C: the members are defined by unresolved RBP-resolution state, not
    # by absence of sequence evidence. The old id described the defect, not the rule.
    - id: unresolved_rbp_risk_locus
      kind: sample_specific
      severity: by_unresolved_locus_rule
      text: >
        {n} stretch(es) of adjacent tail-associated CDS remain unresolved for a possible
        receptor-binding role (longest {longest} CDS); an RBP cannot be excluded there
    - id: reopen_cap_reached
      kind: sample_specific
      severity: limited
      text: "the Stage 6 reopen cap was reached; unresolved candidates remain"
    - id: unresolved_cds
      kind: sample_specific
      severity: limited
      text: "{n} candidate(s) left documented but unresolved"

  # ---- M14C: RBP-resolution state --------------------------------------------
  # M14B's P22 control exposed the defect: the completeness layer was reading
  # `direction == uninformative` as "we know nothing about this protein", when what it
  # actually means is "this evidence does not point at receptor binding". A
  # `head scaffolding protein` is IDENTIFIED; it is simply irrelevant to RBP-ness. Both
  # printed the same word, so 16 of P22's 26 "unresolved" proteins were in fact settled.
  #
  # The question the completeness layer must ask is not "is there an annotation?" but:
  #
  #     is the existing evidence enough to take this CDS OUT of the set of proteins that
  #     could still be carrying an unresolved receptor-binding role?
  #
  # It reuses EvidenceRecord directions, so no second product-name vocabulary appears.
  rbp_resolution_state:
    unresolved_rbp_risk_member:
      require:
        - tail_or_adsorption_context
        - no_resolving_receptor_binding_evidence
    resolved_if_any:
      - supports_non_rbp_identity
      - supports_structural_only
    # Already on the shortlist: the question has been answered, not left open.
    also_resolved_if:
      - supports_receptor_binding
    not_resolved_by_itself:
      - supports_apparatus_membership
      - generic_functional_annotation
      - generic_tail_component_name
      - searched_no_hit
      - uninformative
    apparatus_membership_note: >
      THIS IS THE LOAD-BEARING LINE. A specific-sounding tail name tells us the protein
      belongs to the apparatus; it does not settle whether that protein also contacts the
      receptor. N4 gp65 is annotated "tail sheath and receptor binding protein" and is a
      genuine dual-role RBP. Clearing every tail-named protein as `resolved` would delete
      exactly the tips, fibres and needles that must stay under suspicion.
    hypothetical_note: >
      an unannotated CDS in tail context has no resolving evidence and therefore stays in
      the risk set -- but "unannotated" is not the criterion, "unresolved" is.

  # DETECTION and SEVERITY are two different questions and were wrongly sharing one
  # threshold. "There is an unresolved locus here" fires on 48/48 SMA genomes -- that is
  # a true statement about the dataset, not a broken rule. What was wrong was the further
  # assumption that any unresolved locus makes the whole shortlist unreliable.
  unresolved_locus_rule:
    # -- detection: written semantically before any result was seen and NOT revised.
    contiguous_run_min: 3
    adjacency_gap_cds: 1
    requires_tail_context: true
    detection_meaning: >
      three or more adjacent tail-associated CDS without informative sequence, profile or
      structural evidence constitute a localized unresolved locus.

    # -- severity: added in M14A, after detection and severity were found to be coupled.
    # The anchor is not new: max_cluster_cds = 12 is the largest extent this system
    # recognises as one apparatus cluster. A dark run that REACHES that scale is large
    # enough to accommodate a complete apparatus-scale module, so a short shortlist
    # should not be read as close to exhaustive.
    module_scale_cds: 12
    module_scale_provenance: >
      stage1.channels.C4_tandem_cluster.max_cluster_cds, a pre-existing biological and
      algorithmic scale anchor for the maximum recognised apparatus-cluster extent.
      It was NOT chosen from how the SMA genomes happened to split.
    severity_rule:
      partial: "3 <= longest unresolved run < 12 -- localized, the shortlist is still useful"
      limited: ">= 12 -- module-scale, the shortlist must not be treated as near-exhaustive"

  # ---- Pre-M15 presentation patch, frozen 2026-08-24 -------------------------
  # M14D found 11 of 48 genomes handed the user an EMPTY shortlist while their own
  # rank-1 internal candidate was often the reference RBP. Two things were true at once:
  # the evidence layer had no bug (those proteins genuinely carry only apparatus or
  # structural evidence), and the product had a real gap (a quarter of runs say "I am
  # not sure" and then offer nothing to do next).
  #
  # The fix is presentational, NOT scientific. Nothing about tiers, directions, sets or
  # ranking moves. Fixing this by widening direction_map would have re-opened evidence
  # semantics to make a benchmark number look better -- the exact loop that turns a
  # benchmark into a training set.
  presentation_policy:
    exploratory_candidates:
      name: top_unresolved_candidates
      forbidden_names: [rescue, fallback_rescue, low_confidence_rbp]
      forbidden_names_why: >
        each of those names re-blurs the evidence semantics this project spent M13 and
        M14C separating. These proteins are shown BECAUSE the evidence was insufficient,
        not because a weaker tier of RBP evidence exists.
      triggers:
        primary_and_rescue_empty: must_display
        limited_with_nonempty_shortlist: display_collapsed_by_default
      selection: "the top N of the existing internal ranking, minus anything already shown"
      n_default: 3
      n_max: 5
      n_is: "a display cap, never a biological cutoff"
      invariants:
        - "tier is unchanged: R3 stays R3"
        - "rescue stays empty"
        - "direct_binding_hint stays absent"
        - "these are NOT a fourth evidence set"
      excluded_from:
        - primary_union_rescue_recall
        - any_benchmark_recall_metric
      excluded_why: >
        `Primary+Rescue recall` asks how far the evidence itself reaches.
        `exploratory display coverage` asks whether the tool still gives an
        experimentalist an executable next step when the evidence falls short.
        Blending them would let a UI change inflate a scientific number.

  execution_modes:
    default:
      runs: [G, S, D, existing_T]
      produces: [primary, rescue, completeness_assessment]
      note: "minutes, no new structure prediction, no comparative search"
    deep:
      triggers: [sequence_evidence_exhausted, multiple_unresolved_tail_associated,
                 stage6_unaccounted_locus]
      adds: [C5_comparative, new_structure_prediction, deeper_completeness_audit]
      note: >
        an escalation path for hard cases, not a step every genome must pay for. A
        T7-like phage whose gp17-like candidate is already rank 1 with G+S+D gains
        nothing from comparative genomics.


# ---------------------------------------------------------------------------
# RESCUE POLICY -- M13, frozen 2026-08-23 BEFORE implementation.
#
# The bug it fixes: `rescue` had become "everything in the pool that is not
# primary" -- 116 proteins on Q185cp1a1 -- which is the internal pool wearing a
# different name. stage7.candidate_set.rescue_set has always said something much
# narrower; the code simply did not implement it.
#
# The distinction the whole contract rests on:
#
#   RESCUE     "the evidence is weaker than primary, but I think this protein is
#              worth validating alongside them."
#   LIMITATION "there is unresolved biology here, so I cannot claim the candidate
#              space has been safely compressed."
#
# Recall-risk signals belong in the SECOND. "I do not know what this protein is"
# must never be converted into "worth testing whether it is an RBP" -- that is
# exactly how a rescue set grows back into a pool while looking principled.
# ---------------------------------------------------------------------------
rescue_policy:
  admit:
    - remaining_R2                    # already plausible RBP, just not in primary
    - R3_with_direct_binding_hint     # R3 carrying evidence that actually points at binding

  direct_binding_hint:
    definition: >
      At least one non-superseded EvidenceRecord whose direction is
      supports_receptor_binding.
    allowed_families: [S, D, T, M]
    consumes: normalized_evidence_records
    forbidden: >
      re-deriving this from product keywords. A second RBP-term vocabulary living in
      set assignment would drift from stage4.direction_map within one edit.

  # Each of these is a real reason not to feel safe. None of them is a reason to put a
  # protein on a bench list.
  do_not_admit_by_itself:
    - audit_reopened
    - sequence_evidence_exhausted
    - comparative_variable_locus_C5
    - apparatus_only_domain_or_structure
    - genomic_context_only
    - R3_E1_hypothetical

  redirected_to_completeness:
    audit_reopened: "internal provenance; completeness limitation if unresolved"
    sequence_evidence_exhausted: sequence_evidence_exhausted_tail
    comparative_variable_locus_C5: "unresolved variable tail locus"
  c5_note: >
    C5 is locked at supports_apparatus_membership and forbidden from asserting
    receptor binding. Admitting a candidate to rescue merely for carrying a C5 record
    would re-import C5 as RBP evidence through the back door of set assignment.

  sizing:
    typical_size_is: expected_distribution_not_a_cap
    forbidden:
      - "truncating rescue to make the number look small"
      - "padding rescue because a genome 'should have' some"
    note: "five candidates satisfy the rule -> report five. Zero satisfy it -> report zero."

  independence:
    rule: "completeness limitations are computed independently of set assignment"
    forbidden: "a limitation disappearing because rescue shrank"


# ---------------------------------------------------------------------------
# REMOTE STAGE 2 BACKEND -- M16, contract frozen 2026-08-24 before implementation.
#
# Motivation is product weight, not science: the local route needs a 176 MB
# DB_PHAGE plus a host database per genus, which is a heavy ask for someone
# analysing three phages. The scientific contract does not change -- PHAGE and
# HOST are still searched separately, merged at hit level, and still produce
# exactly ONE S EvidenceRecord.
#
# What DOES change is provenance: a frozen local snapshot and a live UniProtKB
# are different epistemic objects, and the record must say which one answered.
# ---------------------------------------------------------------------------
# ===========================================================================
# genome annotation (M19) -- orchestration only, no scientific decision
# ===========================================================================
# A bare FASTA cannot enter the analysis: every stage downstream reads CDS features and
# translations. Until M19 the answer to "I have a FASTA" was a list of tools to install
# -- WSL, Ubuntu, pharokka, phold, Foldseek -- which is a developer toolchain handed to a
# user, not a product.
#
# This block decides HOW an annotation is obtained. It decides NOTHING about what the
# annotation means. Candidate generation, direction, tiers, Primary/Rescue, completeness
# and Stage 6 are frozen and are not reachable from here.
# ===========================================================================
# capability matrix (M19-b1) -- what this installation can do, and what this RUN did
# ===========================================================================
# Field report, 2026-08-25: RBPfinder writes `HHPRED_BATCH.tsv` and
# `AF3_MONOMER_BATCH.tsv`, and a user reasonably reads the existence of those files as
# "HHpred and AlphaFold have been run". They have not. They are request lists.
#
# One boolean cannot say this, which is why the matrix has THREE axes. They answer three
# different questions and conflating any two of them is how the misreading happens:
#
#   result_import   can RBPfinder PARSE a result of this kind if handed one?
#   executor        does this installation RUN the tool itself?
#   run_state       did it happen in THIS run?
#
# HHpred today is simultaneously `result_import: available`, `executor: not_bundled`
# and `run_state: not_run`. Collapse those and you get either "HHpred works" or "HHpred
# is unsupported", and both are wrong.
#
# When a live HHpred provider is added later, only the executor cell changes. The state
# vocabulary does not have to be reinvented.
capability_matrix:
  status: M19B1

  axes:
    result_import: [available, unavailable]
    executor: [bundled, not_bundled, configured, not_configured, request_list_only]
    run_state: [completed, partial, not_run, not_applicable, failed]

  # A capability is evidenced by the TOOLS that produce its records, not by its family.
  # Caught while building this: pharokka's PHROG call is family D, so keying on the
  # family alone reported InterProScan and HHpred as COMPLETED on a run where neither
  # had ever executed -- the exact misattribution this matrix exists to prevent.
  evidence_binding: by_tool_id

  # run_state is DERIVED FROM THE EVIDENCE RECORDS THE RUN PRODUCED, never from which
  # code path executed. The Ceiling section of RUN_REPORT was hardcoded prose asserting
  # "no Stage 2 evidence was collected" while the same report's table showed D+G+S -- a
  # report that contradicts itself is worse than one that says less.
  run_state_source:
    rule: "read the canonical EvidenceRecords; never infer from the execution path"
    forbidden:
      - "deciding evidence exists because a provider was configured"
      - "deciding evidence is absent because a provider was not invoked"
      - "hardcoded prose describing what a run collected"
    why: >
      manifest-imported sequence evidence is sequence evidence. A run that imported S
      records via --stage2-manifest collected Stage 2 evidence, whatever path delivered
      it.

  capabilities:
    - id: genome_annotation
      tools: [pharokka_phrog]
      group: "Genome annotation"
      label: "Input annotation"
      family: null
      result_import: available
      executor: not_bundled
      note: "annotated GenBank in; remote annotation provider is M19-f"

    - id: ebi_blastp
      tools: [uniprot_blastp]
      group: "Sequence homology"
      label: "EBI / UniProtKB BLAST"
      family: S
      result_import: available
      executor: bundled
      note: "remote BLASTP against UniProtKB; needs authorisation per run"

    - id: local_blast_db
      tools: [local_blast_db, local_blast]
      group: "Sequence homology"
      label: "Local BLAST"
      family: S
      result_import: available
      executor: configured
      note: "requires blastp and a configured database"

    # Not an independent evidence family -- it explains S records rather than adding
    # one. It IS its own capability: "did we look up what those hits are" is a different
    # question from "did the sequence search run", and one boolean cannot answer both.
    - id: uniprot_enrichment
      tools: [uniprot_enrichment]
      group: "Sequence homology"
      label: "UniProt functional enrichment"
      family: S
      result_import: available
      executor: bundled
      note: "annotation of hits Stage 2 already returned; adds no independent family"

    - id: interproscan
      tools: [interproscan, existing_interpro_import, from_interproscan]
      group: "Domain / profile"
      label: "InterProScan"
      family: D
      result_import: available
      executor: not_bundled
      note: "results can be imported; RBPfinder does not run it"

    - id: hhpred
      tools: [hhpred, hhpred_hhr, existing_hhr, from_hhpred]
      group: "Domain / profile"
      label: "HHpred"
      family: D
      result_import: available
      executor: not_bundled
      note: "HHPRED_BATCH.tsv is a REQUEST LIST, not a result"

    - id: alphafold
      tools: [af3, alphafold_server, existing_af3_import]
      group: "Structure"
      label: "AlphaFold / AF3"
      family: T
      result_import: available
      executor: request_list_only
      note: "AF3_MONOMER_BATCH.tsv is a REQUEST LIST, not a result"

    - id: foldseek
      tools: [foldseek_structure, local_foldseek, existing_foldseek_import]
      group: "Structure"
      label: "Foldseek"
      family: T
      result_import: available
      executor: not_bundled
      note: "results can be imported; RBPfinder does not run it"

    - id: c5_comparative
      tools: [c5_comparative_variable_locus]
      group: "Comparative genomics"
      label: "C5 comparative"
      family: G
      result_import: available
      executor: bundled
      note: "runs when a comparator cohort is supplied"

  # Anything that emits a batch file MUST say so, or the file reads as a result.
  request_list_capabilities: [hhpred, alphafold]
  request_list_warning: >
    a batch file is a list of work to be done by a person or another service. Its
    existence is not evidence that the work happened.

genome_annotation:
  status: M19A_CONTRACT
  applies_to: "--fasta input, i.e. a genome with no CDS features"

  modes:
    remote:
      summary: "submit the genome to an annotation service; recommended for most users"
      transmits: true
      requires: [remote_allowed_policy, explicit_annotation_authorisation]
    existing:
      summary: "use a GenBank that was annotated earlier"
      transmits: false
    local:
      summary: "run locally installed annotation tools"
      transmits: false
      note: >
        advanced. This is the ONLY path that requires WSL/Linux, pharokka, phold or
        Foldseek. Those are not RBPfinder prerequisites and must never be presented as
        such -- they are what a user takes on deliberately when they refuse to transmit
        the genome at all.

  # ---- authorisation is NOT shared with Stage 2 ---------------------------
  # Stage 2 sends candidate protein sequences. Annotation sends the ENTIRE genome. The
  # exposure is different in kind, so one consent cannot stand for the other, and an
  # authorisation for either must never be inferred from the other being present.
  authorisation:
    stage2_flag: "--allow-remote"
    annotation_flag: "--allow-remote-annotation"
    independent: true
    forbidden: >
      treating --allow-remote as permission to transmit a genome, or
      --allow-remote-annotation as permission to submit candidates to EBI
    provenance: "both authorisations are recorded separately, each with what was disclosed"

  disclosure:
    must_state:
      - "the COMPLETE genome sequence is transmitted, not a selection of proteins"
      - "the phage identifier and any metadata the provider requires are transmitted"
      - "the annotation is downloaded and parsed automatically"
      - "the user never retrieves or re-uploads a result file"
      - "the user must be authorised to transmit this genome"
      # The one that keeps the two consents from being read as a bundle. A user may be
      # willing to send candidate proteins to EBI and unwilling to send an unpublished
      # genome to an annotation service; the notice must say they are separate decisions
      # rather than let silence imply they are one.
      - "remote annotation is separate from the later EBI Stage 2 submission"
    notice: |
      Remote genome annotation will send the following data to a third-party service:

      - the complete phage genome sequence
      - phage identifier
      - any metadata required by the annotation provider

      The returned annotation will be downloaded automatically.
      You will not need to retrieve or upload result files manually.

      This is SEPARATE from the later EBI Stage 2 submission, which sends only
      selected candidate proteins. Authorising one does not authorise the other.

      Continue only if you are authorised to transmit this genome.
    prompt: "Continue with remote annotation? [y/N] "

  # ---- Galaxy Europe / Pharokka (M19-f2) ----------------------------------
  # Chosen over phage-annotation.org because the Galaxy API is designed for programmatic
  # use and the tool emits GenBank directly. It is NOT a zero-configuration path, and
  # calling it one would be the misleading part: Galaxy refuses anonymous job creation
  # (`POST /api/histories` -> 403), so every user needs an account and an API key.
  #
  # The original M19 goal was "a new user does not have to install WSL, Ubuntu and
  # Foldseek". That still holds. "A new user has to configure nothing at all" does not,
  # and the documentation says so rather than pretending.
  # Provider hierarchy, re-frozen 2026-08-28 after reading the CURRENT public API and
  # terms rather than a second-hand note. The earlier demotion of this service rested on
  # "the site asks users not to run bulk annotation", which is true and which I read as
  # disqualifying. It is not: the terms discourage BULK, and the whole API exists for
  # scripted single-genome use. That was an over-reading of an accurate note.
  provider_priority: [phage_annotation_server, galaxy_europe_pharokka]

  providers:
    phage_annotation_server:
      endpoint: "https://phage-annotation.org"
      pipeline: [pharokka, phold, phynteny]
      tool_versions: {pharokka: "1.10.1", phold: "1.3.0", phynteny_transformer: "0.1.3"}
      classification: open_remote_provider
      zero_configuration: true
      account_required: false
      api_key_required: false
      automation_surface: documented_rest_api
      retention_days: 30
      self_hostable: true          # MIT licensed
      output: "phold/phold.gbk"

      # Frozen from /openapi.json and the official /api/client.py, not from prose.
      api:
        submit: {method: POST, path: "/jobs", encoding: multipart,
                 accept_header: "application/json",
                 file_field: fasta,
                 fields: [gene_predictor, fast, email, example],
                 returns: job_id, ok_status: [200, 202]}
        status: {method: GET, path: "/jobs/{job_id}/status.json",
                 fields: [state, stage, elapsed_s]}
        fetch:  {method: GET, path: "/jobs/{job_id}/files/{rel_path}"}
        archive: {method: GET, path: "/jobs/{job_id}/download"}
      terminal_states: [completed, failed, expired]
      error_fields: [error_code, error_message, error_hint]
      # The official client uses 10s; the API page advises 10-30s. Not invented.
      poll_seconds: 10
      poll_timeout_seconds: 5400

      # Published caps. Checked BEFORE upload so an oversized genome fails locally
      # rather than by consuming someone else's rate limit.
      input_caps:
        max_contigs: 20
        min_contig_bp: 100
        max_contig_bp: 2000000
        max_total_bp: 2000000
        max_upload_bytes: 52428800
        nucleotide_only: true       # protein FASTA is detected and rejected upstream

      # 429 semantics are NOT documented and the official client does not handle them.
      # M15C established that a retry policy must never be guessed -- and here guessing
      # would be worse than useless, because automatically retrying a rate limit IS the
      # circumvention the terms forbid.
      rate_limit_handling:
        documented: false
        on_429: fail_with_guidance
        never: automatic_retry_of_a_rate_limit
        reason: "terms section 6 asks users not to circumvent the per-IP limits"

      # The service asks that bulk work be run locally. That is enforced in code, not
      # left as a note someone may not read.
      product_policy:
        one_genome_per_user_invoked_analysis: true
        batch_submission_loop: forbidden
        automatic_queue_fan_out: forbidden
        bulk_use: "install the tools locally; the terms say so and they are right"

      # Zero account is NOT zero disclosure. A complete genome still leaves the machine,
      # so --allow-remote-annotation remains a hard gate.
      disclosure_still_required: true
      confidential_sequences: "use local mode; the service's own terms say the same"

    galaxy_europe_pharokka:
      endpoint: "https://usegalaxy.eu"
      tool_id: "toolshed.g2.bx.psu.edu/repos/iuc/pharokka/pharokka/1.3.2+galaxy0"
      tool: Pharokka
      tool_version: "1.3.2+galaxy0"
      output: pharokka_gbk            # format: genbank, straight from the tool
      classification: authenticated_remote_provider
      role: fallback
      zero_configuration: false
      account_required: true
      api_key_required: true

      # Surfaced BEFORE authorisation, not buried in provenance. A methodological
      # difference that can move CDS boundaries and functional calls is not a footnote.
      version_notice: |
        Remote annotation provider: Galaxy Europe / Pharokka 1.3.2

        This provider currently runs an older Pharokka release than the current
        upstream release. Annotation results may therefore differ from a newer
        local Pharokka run.

      # Two claims that must never be merged into one.
      evidence_boundary:
        technical_programmatic_use: "SUPPORTED by Galaxy API design"
        usegalaxy_eu_automated_use_terms: "NOT YET VERIFIED"
        forbidden_inference: >
          "Galaxy has an API, therefore usegalaxy.eu permits RBPfinder to submit
          automatically". The first is about a software interface; the second is about
          one operator's terms, and only a person reading those terms can settle it.

      # The gate before the first real genome leaves the machine.
      manual_tos_gate:
        required_before: first_real_genome_submission
        statement: >
          the current usegalaxy.eu Terms of Service, acceptable-use and data-retention
          policy have been read by a person, and nothing in them forbids low-frequency,
          single-sample programmatic analysis of this kind
        until_then: "stub and API-contract tests only; no genome is transmitted"

  # ---- credentials --------------------------------------------------------
  # An API key is a CREDENTIAL, not contact information like the EBI email, and is
  # handled one level more strictly.
  credentials:
    galaxy_api_key:
      sources: ["--galaxy-api-key", "GALAXY_API_KEY"]
      precedence: "explicit CLI > environment > unavailable"
      # Same authority rule as the BLAST resolver: an explicit value that does not work
      # is a failure, never a reason to quietly try something else. Falling back would
      # mean a run silently used a different account than the one the user named.
      explicit_invalid_is_fatal: true
      never_persisted_to:
        - run_result.json
        - provenance
        - checkpoint
        - event log
        - stdout
        - stderr
        - exception messages and reprs
        - fixtures
        - HTTP debug dumps
      error_text: "authentication failed"
      forbidden_in_errors: ["the key itself", "the Authorization header"]

  # ---- what a provider must return ----------------------------------------
  # RBPfinder does not care which service produced it. `phage-annotation.org`, a pharokka
  # server, a phold server or something that does not exist yet are interchangeable as
  # long as they satisfy this contract.
  provider_contract:
    input: [genome_fasta, phage_id, data_policy, remote_authorisation]

    # What a provider MUST return for the annotation to count as done. ORF/CDS calling
    # is the whole point: without CDS features and translations there is nothing for the
    # executor to analyse.
    required_output:
      annotated_genbank: "parseable by the existing ingest, with CDS features and translations"
      cds_features: "at least one CDS carrying a translation"

    # Enrichment. Absent -> recorded, never punished, and NEVER a reason to fail the
    # annotation. Making a structure service a hard condition is how a FASTA workflow
    # ends up blocked on something that has nothing to do with calling genes.
    optional_output: [phold, phynteny, foldseek, annotation_tables]
    optional_output_is_never_required: true

    # Recorded for every annotation, whatever the provider was.
    provenance_fields:
      - annotation_status
      - provider
      - input_fasta_sha256
      - submitted_at
      - completed_at
      - annotated_genbank_path
      - artifact_paths
      - tool_versions          # when the provider exposes them; null when it does not

  # Three outcomes, and the middle one is the reason there are three.
  annotation_status:
    completed: "annotated GenBank returned, with CDS; every requested enrichment present"
    completed_with_missing_enrichment: >
      annotated GenBank returned with CDS, but one or more optional artifacts did not
      arrive. The run continues; the missing capability is recorded not_run and is never
      evidence against a candidate.
    failed: >
      no usable annotated GenBank. The run does NOT enter candidate generation --
      producing a shortlist from no annotation would be inventing one.

  # ---- failure semantics ---------------------------------------------------
  # The distinction the whole project rests on, applied to a new stage.
  failure_semantics:
    no_annotated_genbank:
      outcome: fail
      reason: >
        without CDS features there is nothing to analyse. This is a failed run, not a
        run with reduced coverage -- reporting a shortlist from no annotation would be
        inventing one.
    base_annotation_ok_optional_artifact_missing:
      outcome: continue
      record: "capability not_run, with the reason"
      effect: "assessment_coverage may drop to reduced"
      forbidden: >
        treating a missing artifact as evidence against a candidate. A phold result that
        never arrived says nothing about the protein -- missing is not negative, exactly
        as absence_is_not_counter_evidence and searched-no-hit vs not-run.

  optional_enrichment:
    tools: [phold, foldseek]
    status: optional_annotation_enrichment
    not: rbpfinder_prerequisite
    rule: >
      present -> used, and recorded. Absent -> the core run is not blocked, and the
      capability provenance says so honestly.

# ===========================================================================
# UniProt functional enrichment (M20-a)
# ===========================================================================
# Stage 2 already searches UniProtKB. This does not add a search: it takes the accessions
# that search returned and asks what UniProt says about them. Two different questions,
# one evidence family:
#
#   BLAST evidence      "this candidate resembles some known protein"
#   UniProt enrichment  "here is how that known protein is described"
#
# The second explains the first. It is not independent of it.
uniprot_enrichment:
  status: M20A
  scope: "accessions already returned by Stage 2 -- never a new search"

  # ---- the trap this block exists to avoid --------------------------------
  # A BLAST hit to a tail fiber, plus a UniProt name saying "tail fiber protein", is ONE
  # observation described twice. Counting it twice would manufacture an independent
  # family out of a single datum -- exactly what evidence_families.correlations forbids
  # for C2 keywords and the annotator's PHROG call.
  family: S
  adds_independent_family: false
  may_set_tier_directly: false
  role: "explain and qualify an existing S record; never create one"

  normalized_record:
    - accession
    - entry_name
    - reviewed              # true for Swiss-Prot, false for TrEMBL. Kept, never assumed.
    - protein_names
    - function_comments
    - domain_comments
    - subunit_comments
    - cross_references
    - organism
    - taxonomy
    - source                # always "uniprot"
    - retrieved_at
    - database_release

  # ---- cross-references are associations, NOT executions -------------------
  # The capability matrix had to be rebuilt once because evidence was attributed to a
  # tool that never ran. A UniProt cross-reference is a statement that some database
  # holds a related entry. It is not a result RBPfinder obtained, and it must never
  # light up a capability or contribute a family.
  cross_reference_policy:
    interpro_xref_means_interproscan_ran: false
    pfam_xref_means_profile_search_ran: false
    pdb_xref_is_structure_evidence: false
    rule: >
      a cross-reference records that another database has a related entry. It is context
      for a human and a pointer for later work. It is never evidence RBPfinder gathered,
      never a completed capability, and never family D or T.

  # ---- names inform, they do not decide ------------------------------------
  # `putative receptor-binding protein` is a description someone else wrote. It can
  # sharpen or soften a reading; it cannot BE the reading. Direction and tier stay with
  # the frozen decision rules, which this milestone does not touch.
  naming_policy:
    may_influence: [direction_reading, strength_qualification, human_explanation]
    may_not: [set_tier_directly, promote_on_string_match_alone]

  # ---- absence -------------------------------------------------------------
  failure_semantics:
    no_function_comment:
      meaning: "UniProt records nothing about this protein's function"
      is_negative_evidence: false
    enrichment_unavailable:
      meaning: "the lookup did not happen"
      effect: "the S record from BLAST stands exactly as it was"
      forbidden: "turning an existing BLAST hit into not_run because enrichment failed"

  # How many of a record's hits get looked up. The consensus can hold dozens; asking
  # UniProt about all of them for every candidate would be a lot of traffic to explain
  # one reading. The top few carry the reading -- `consensus.per_hit` is already ranked.
  # An explicit bound, in the rules, rather than a number buried in a loop.
  max_accessions_per_record: 3

  endpoint: "https://rest.uniprot.org/uniprotkb"
  # Same bounded retry as every other transport here: this machine drops 20-50% of
  # outbound TLS connections, and a lookup is idempotent.
  transport_retry: {attempts: 3, backoff_seconds: [1, 2, 4]}

remote_stage2:
  status: M16_IN_PROGRESS
  provider: ebi_job_dispatcher
  backends: [local, ebi]
  default_backend: local
  policy_gate: >
    submitting a candidate sequence is transmission. It obeys data_policy exactly as
    every other remote provider does: forbidden in `private`, requires remote_allowed
    plus per-run authorisation.

  # ---- informed consent, product-level (M16-e, 2026-08-25) ------------------
  # The data-policy gate answers "is this run allowed to transmit". It does not answer
  # "does the person know what is being transmitted, and what the email is for". Those
  # are different questions and only the second one is about the user.
  #
  # The failure this prevents is specific and was predicted from the bare `Email:`
  # prompt: a user reads it as an address the RESULTS will be sent to, waits for a mail
  # that never comes, and concludes the tool is broken -- or worse, goes to the EBI web
  # form, runs the search by hand, and tries to feed the file back. Nothing in the
  # product requires that, and the disclosure has to say so before they can believe it.
  #
  # Same place as the policy gate, for the same reason: before the first sequence
  # leaves the machine, never after.
  disclosure:
    must_state:
      - "candidate protein sequences are transmitted to EMBL-EBI"
      - "the email is EBI Job Dispatcher contact information"
      - "the email is NOT an RBPfinder account, and NOT where results arrive"
      - "RBPfinder polls, retrieves and parses the results itself"
      - "the user never has to fetch, download or hand back a result file"
    notice: |
      Remote Stage 2 uses EMBL-EBI.

      The following data will be transmitted:
      - candidate protein sequences
      - contact email required for EBI job submission

      RBPfinder will retrieve and parse the BLAST results automatically.
      You will not need to return any result files manually.
    prompt: "Continue with remote submission? [y/N] "
    email_field_label: "EBI contact email"
    email_field_help: |
      Used only as contact information for the EMBL-EBI Job Dispatcher.
      RBPfinder retrieves results automatically.
    cli_bypass: >
      --allow-remote is the ONLY way past the prompt, and it is an authorisation, not a
      silencer: the notice is still printed and still recorded in provenance. A
      non-interactive run without --allow-remote refuses; it never assumes consent from
      the absence of a terminal.
    gui_requirement: >
      one explicit confirmation dialog carrying the same five statements, shown before
      submission, not a checkbox buried in settings.
    acceptance:
      - "backend=ebi + missing email            -> refuse BEFORE transmission"
      - "backend=ebi + no remote authorisation  -> refuse BEFORE transmission"
      - "backend=ebi + authorised               -> submit/poll/retrieve/parse automatically"
      - "authorised runs never require a manually returned result file"

  # ---- hard gate on the result format -------------------------------------
  # The legacy EBI result table carries no query span, which is why every S record
  # built from it had to claim the full protein length. Local BLAST localises to a
  # span (W073cp2a2_CDS_0005's sialidase sits at 140-208 of a much longer protein).
  # A remote backend that cannot do that would be born weaker than the local one on
  # a dimension already proven to matter.
  result_format:
    alignment_coordinates: mandatory
    required_fields: [hsp_query_from, hsp_query_to, hsp_hit_from, hsp_hit_to,
                      hsp_align_len, hsp_expect, hsp_identity, hsp_score]
    forbidden: "falling back to the coordinate-free summary table to get something working"
    on_missing_coordinates: reject_provider_output

  # ---- Stage 6 interaction: delta-only resubmission ------------------------
  # Reopened candidates MUST be searched. A candidate left unsearched because of our
  # own execution order is not "the database had nothing" -- it is us not asking, and
  # the whole project rests on those two never being confused.
  reopen_handling:
    mode: delta_only
    already_searched_key: [cds_id, taxonomy, query_sha256]
    rule: "submit only newly reopened candidates that this key has not already covered"
    loop: "search -> evidence -> tier -> audit -> reopen -> search delta -> ... until stable"
    forbidden:
      - "resubmitting candidates already searched in an earlier round"
      - "leaving a reopened candidate as not_run because the round had already ended"

  # A resource guard, never a biological stopping rule.
  remote_round_limit: 4
  on_round_limit:
    run_status: completed
    assessment_coverage: reduced
    limitation: remote_stage2_round_limit_reached
    forbidden: "presenting the evidence as complete after hitting a resource cap"

  # ---- transport retry -----------------------------------------------------
  # Measured 2026-08-25: this machine's outbound TLS drops 20-50% of connections on
  # EVERY host, failing as SSL UNEXPECTED_EOF_WHILE_READING / curl exit 35. One job is
  # at least three round trips (submit, N polls, fetch result), so without retry a run
  # fails in transport far more often than it succeeds -- and a transport hiccup would
  # then be recorded as "the provider had nothing", which is the one confusion this
  # whole project exists to prevent.
  #
  # Retry belongs HERE, inside the transport, exactly as the acquisition fetchers do.
  # It must never travel up and become a different backend choice.
  transport_retry:
    attempts: 5
    backoff_seconds: [1, 2, 4, 8]
    retry_on: [connection_reset, tls_eof, timeout, http_429, http_5xx]
    never_retry_on: [http_400, http_404, job_state_ERROR, job_state_FAILURE]
    rationale: >
      a dropped connection says nothing about the query; a 400 or a job in state ERROR
      says everything. Retrying the second kind would turn a real answer into a hang.
    forbidden: "retrying a job that the service reports as ERROR/FAILURE/NOT_FOUND"

  # ---- failure semantics ---------------------------------------------------
  on_provider_failure:
    candidate: "stays in the pool"
    s_record: not_run
    limitation: remote_stage2_incomplete_for_reopened_candidates
    assessment_coverage: reduced
    run_status: completed
    rationale: >
      a provider outage must not delete candidates or spin the audit loop. It is a
      recorded gap in coverage, exactly like a missing local capability.

  # ---- per-taxonomy search state ------------------------------------------
  # Recorded separately, merged once. `not_applicable` is the honest state for the
  # host route when the run states no host -- it is not `not_run`, because nothing
  # was left undone.
  per_taxonomy_state:
    values: [searched_hits, searched_no_hit, not_run, not_applicable]
    host_without_context: not_applicable
    merge: "hit-level, before sequence_homology.build; still exactly one S record"

  # ---- provenance: a live database is not a frozen one ---------------------
  provenance_required: [provider, endpoint, database, taxonomy, query_sha256,
                        submitted_at, job_id, raw_response_path, database_release]
  database_release_unknown_value: "unknown"
  forbidden: >
    leaving database_release empty. An empty field reads as "not recorded" and then as
    "not searched"; `unknown` states plainly that the service did not tell us.
  raw_response_cache: required
  raw_response_cache_why: >
    the local snapshot is frozen, the remote database is not. Without the raw response
    on disk, re-running the same analysis in six months silently answers a different
    question.

# =============================================================================
# M20-b1 -- how an InterPro result becomes (or fails to become) D evidence.
#
# M20-a was explanation: UniProt describing proteins Stage 2 had already found, staying
# inside family S. This is different in kind. An InterPro signature matched on the
# candidate's OWN sequence is a second, independent observation, and it therefore reaches
# independent_families, direction, tier, Primary/Rescue and Completeness. That makes it a
# scientific change, so the interpretation is frozen here, offline, before any transport
# exists to produce one.
#
# Nothing in this block is applied by a parser. The parser normalises; this decides.
# =============================================================================
interpro_evidence:
  status: M20B1_CONTRACT_ONLY
  contract_only_means: >
    no provider produces these records yet. The schema, the direction ontology, the
    eligibility rules and the candidate-selection policy are frozen first so that the
    transport decision in M20-b2 cannot quietly bring its own science with it.

  # The parser's existing output already carries most of this; `candidate_id` and
  # `origin` are what M20-b1 adds, and `origin` is the field the whole independence
  # argument rests on.
  normalized_match:
    - candidate_id
    - origin
    - signature_accession        # e.g. a Pfam or PANTHER signature
    - signature_name
    - signature_type
    - database                   # the member database the signature came from
    - interpro_accession         # the integrated IPR entry, when the signature has one
    - interpro_description
    - start_aa                   # on the CANDIDATE, not on any subject
    - end_aa
    - evalue
    - score

  # ---------------------------------------------------------------------------
  # Where the match came from. This is the M20-b1 gate that matters most.
  # ---------------------------------------------------------------------------
  origins:
    interpro_execution:
      eligible_for_d_family: true
      means: "a signature scan was run against this candidate's own sequence"
    uniprot_cross_reference:
      eligible_for_d_family: false
      means: >
        an IPR identifier read off the UniProt entry of a BLAST subject. It says another
        database holds a related record about a protein our candidate resembles. Nothing
        was scanned, and the identifier describes the SUBJECT, not the candidate.
      collapses_into: S
      why: >
        counting it as D would manufacture an independent family out of one datum: the
        BLAST hit, once as similarity and once as the subject's own annotation. That is
        the anti-pattern `evidence_families.correlations` exists for, and M20-a already
        refused it once at the capability matrix.

  d_eligibility:
    require_origin: interpro_execution
    require_query_span: true
    why_two_checks: >
      the origin field is a declaration and could be set wrongly by a future provider;
      the query span is structural. A UniProt cross-reference CANNOT carry start/end on
      our candidate, because nothing was aligned to our candidate to produce them. Two
      independent reasons to reject means a single mislabelled field cannot let an
      association through.
    rejected_match_handling: >
      kept in raw with its rejection reason, never silently dropped. A reader must be
      able to see that an IPR identifier was present and was deliberately not counted.

  # ---------------------------------------------------------------------------
  # Direction. Ontology-driven, never decided in code.
  # ---------------------------------------------------------------------------
  direction_ontology:
    # Curated, and consulted first. DELIBERATELY EMPTY at M20-b1: populating it is a
    # curation task against the real InterPro entry list, and inventing accession
    # numbers here would put unverifiable science into the rules file under the
    # appearance of authority. The mechanism is tested with fixture accessions; the
    # content is an open item for M20-b2.
    by_interpro_accession: {}
    by_signature_accession: {}
    curation_status: EMPTY_PENDING_REVIEW

    # Fallback while the curated layer is empty. Reuses the ALREADY REVIEWED vocabulary
    # in `stage2.annotation_term_map` rather than introducing a second keyword list that
    # would drift away from it.
    #
    # Shared vocabulary is not a shared datum. A C2 keyword hit reads the product string
    # the annotator wrote, which is why it collapses into D. An InterPro description is
    # written by InterPro curators about a signature and arrives from a scan of our own
    # sequence; it is an independent observation that happens to be read with the same
    # dictionary.
    by_description_terms:
      reuse: stage2.annotation_term_map
      applied_to: [interpro_description, signature_name]
      note: "the compound-title rule in evidence/terms.py applies here unchanged"

    # Member databases and signature types that describe sequence PROPERTIES rather than
    # function. A coiled coil, a transmembrane helix, a signal peptide or a disordered
    # region is annotation and context; it is never a direction, in either sense. Tail
    # fibres are full of coiled coil, and so are dozens of proteins that are not RBPs.
    non_directional_databases: [COILS, MOBIDB_LITE, PHOBIUS, SIGNALP, SIGNALP_EUK,
                                SIGNALP_GRAM_POSITIVE, SIGNALP_GRAM_NEGATIVE, TMHMM, SEG]
    non_directional_types: [Coil, Region, Repeat, Transmembrane, Signal_peptide]
    _default: uninformative

  category_to_direction:
    receptor_binding: supports_receptor_binding
    apparatus: supports_apparatus_membership
    structural_only: supports_structural_only
    non_rbp_identity: supports_non_rbp_identity
    non_directional: uninformative
    uninformative: uninformative

  zero_matches:
    direction: uninformative
    is_counter_evidence: false
    why: >
      unchanged from `stage2.interproscan.zero_hits_note`. Phage structural proteins
      routinely return nothing; all three W073 tail-fibre proteins did. Zero matches may
      never lower a tier.

  # ---------------------------------------------------------------------------
  # Strength. A curated accession and a word found in a description are not the same
  # quality of claim, and the record should not pretend otherwise.
  # ---------------------------------------------------------------------------
  strength:
    curated_accession: strong
    description_terms_with_evalue: moderate
    description_terms_without_evalue: weak
    strong_evalue_max: 1.0e-10
    non_directional: weak
    cap_note: >
      a description-keyword reading may never be `strong`, however good the e-value. The
      e-value says the signature matched, not that the description means what we read
      into it.

  # ---------------------------------------------------------------------------
  # Who gets sent. The funnel already knows which candidates are unresolved; running
  # everything would invert the cost ordering the whole product is built on, and would
  # transmit far more sequence than the question needs.
  # ---------------------------------------------------------------------------
  candidate_selection:
    order:
      - id: r2_unresolved
        test: "tier_r == R2"
        why: "the band where one independent family decides Primary vs Rescue"
      - id: r3_with_receptor_binding_hint
        test: "tier_r == R3 AND any evidence direction is supports_receptor_binding"
        why: "a hint with nothing independent behind it is exactly what D can settle"
      - id: high_priority_unresolved
        test: "af3_priority == P1 AND D not in independent_families"
        why: >
          already judged worth a structure. A profile scan is orders of magnitude cheaper
          and must be offered the chance to answer first -- the same cost ordering that
          makes STAGE2_FIRST outrank an AF3 request.
      - id: stage6_reopened
        test: "reopened_by_stage6 is true"
        why: "Stage 6 reopened it because something changed; it has not been re-searched"
    exclude:
      - id: already_has_d
        test: "D in independent_families"
        why: >
          InterProScan or HHpred already produced a D record for this candidate. Running
          it again would not add a family -- `correlations` counts interproscan and hhpred
          once in D -- so it would be transmission with no epistemic gain.
      - id: not_a_candidate
        test: "tier_r == N"
      - id: no_sequence
        test: "the candidate has no translation to send"
    max_candidates: 24
    max_candidates_why: >
      a cap on how much leaves the machine in one run, not a scientific limit. Selection
      is ordered, so the cap truncates the least valuable end.
    forbidden_rule:
      id: send_the_whole_pool
      why: >
        the same selection bias `af3_priority.forbidden_rule` names, plus an unnecessary
        transmission of unpublished sequence. Ordering by what the evidence still needs is
        the point of having a funnel at all.

  # ---------------------------------------------------------------------------
  # What this may and may not do to the classification.
  # ---------------------------------------------------------------------------
  may:
    - contribute one D unit to independent_families
    - set a region from the signature's own span on the candidate
    - carry a direction from the ontology
  may_not:
    - count twice with hhpred
    - count a uniprot_cross_reference as D
    - lower a tier on zero matches
    - set a tier directly

  # When several signatures match one candidate, which reading wins. Lower wins.
  # In code this would be a magic dict; here it is reviewable.
  #
  # `structural_only` outranks `apparatus` for the same reason it does in
  # `evidence/terms.py`: a protein named as a specific structural element is a more
  # definite statement than "somewhere in the tail apparatus".
  #
  # `non_rbp_identity` sits last among the directional readings rather than first. A
  # candidate carrying both a receptor-binding signature and, say, a hydrolase signature
  # is a compound protein -- and a phage depolymerase is routinely both. Letting the
  # non-RBP reading win would suppress exactly the proteins this tool exists to find.
  # The co-occurrence is preserved in raw.all_categories for a human to see.
  category_rank:
    receptor_binding: 0
    structural_only: 1
    apparatus: 2
    non_rbp_identity: 3
    non_directional: 4
    uninformative: 5

  # Only the curated layer can produce this category: `evidence/terms.py` has no
  # `non_rbp_identity` output. Recorded so nobody later reads its absence from a
  # description-driven run as evidence that no such signature was found.
  categories_reachable_without_curation: [receptor_binding, structural_only, apparatus,
                                          non_directional, uninformative]

# =============================================================================
# M21-a -- how external evidence is acquired. One contract for every provider.
#
# Before this block each remote tool was on course to invent its own product logic:
# InterPro would have had a submission policy, HHpred another, AF3 a third. They are the
# same product question asked three times -- who operates the third-party service, the
# user or RBPfinder -- so it is answered once, here.
#
# The manual path is the MATURE one, not the fallback. HHPRED_BATCH.tsv, the AF3 batches
# and the manifest import have worked since M7; automation is the newer and more fragile
# addition. The defaults reflect that rather than treating automation as the goal.
# =============================================================================
evidence_acquisition:
  status: M21A_CONTRACT

  modes:
    MANUAL_HANDOFF:
      means: >
        RBPfinder writes a batch file naming which candidates need which analysis and
        why. The user runs the official service, downloads the raw results, and hands the
        files back. RBPfinder parses them and carries on.
      transmits_sequence: false
      transmitted_by: the_user
      why_default_for_expensive_tools: >
        the user keeps control of what leaves their machine and of an account that may be
        rate-limited or bound to their institution, and a batch file survives a dropped
        connection in a way a half-finished polling loop does not.
    AUTOMATED_REMOTE:
      means: >
        with explicit authorisation, RBPfinder submits, polls, retrieves and parses
        without a human in the loop.
      transmits_sequence: true
      transmitted_by: rbpfinder
      requires_authorisation: true
    SKIP:
      means: >
        the user has decided this analysis will not happen. Not "not yet" -- a decision.
      transmits_sequence: false
      stop_asking: true
      why_it_is_a_mode_and_not_an_omission: >
        a user who has said no is not a user nobody has asked. Re-prompting someone who
        already declined is the same failure as re-requesting a search that already ran.

  # ---------------------------------------------------------------------------
  # The invariant that makes the two modes safe to offer.
  # ---------------------------------------------------------------------------
  convergence:
    rule: >
      MANUAL_HANDOFF and AUTOMATED_REMOTE differ ONLY in who moves the bytes. The same
      artefact must produce the same EvidenceRecord whichever way it arrived.
    one_parser_per_artefact: true
    providers_may_not_interpret: >
      a provider fetches and hands over the raw artefact. It never assigns a family, a
      direction, a strength or a tier. Those come from the evidence modules, which is
      the only place they are reviewed.
    forbidden:
      id: two_readings_of_one_artefact
      why: >
        an automated provider that parsed its own downloads would become a second source
        of truth for the same file, and the two would drift. This project has already
        paid for that shape twice: the AF3 priority computed in two places, and the
        Ceiling paragraph asserting from a constant what the evidence records said.
    acquisition_mode_is_provenance_not_evidence: >
      the mode IS recorded, in raw.acquisition, because a reader should know how a result
      arrived. It may never appear in family, direction, strength, region or not_run.

  # ---------------------------------------------------------------------------
  # Per provider. `parser` and `evidence_builder` are the convergence anchors: both modes
  # for one provider must name the same pair, and the gates check that they do.
  # ---------------------------------------------------------------------------
  providers:
    uniprot_enrichment:
      automation_implemented: true
      supported_modes: [AUTOMATED_REMOTE, SKIP]
      default_mode: AUTOMATED_REMOTE
      why_default: >
        read-only accession lookup. No sequence is transmitted, the cost is one small GET
        per accession, and there is nothing for a user to operate by hand -- a manual
        mode here would be busywork, not control.
      manual_batch_file: null
      service_name: UniProt enrichment
      return_kinds: []
      parser: rbpfinder.uniprot_enrichment.normalize
      evidence_builder: rbpfinder.uniprot_enrichment.enrich_record

    interproscan:
      # M21-d. The build now has an implementation; the DEFAULT is still MANUAL_HANDOFF,
      # and AUTOMATED_REMOTE is reachable only when a user asks for it explicitly.
      automation_implemented: true
      supported_modes: [MANUAL_HANDOFF, AUTOMATED_REMOTE, SKIP]
      default_mode: MANUAL_HANDOFF
      why_default: >
        either works. Manual is the default only because it is the mode that exists and
        is tested; M20-b2 may move it once an automated provider has been validated.
      manual_batch_file: INTERPRO_BATCH.tsv
      service_name: InterProScan
      service_url: https://www.ebi.ac.uk/interpro/search/sequence/
      return_kinds: [interproscan_json]
      parser: rbpfinder.parse.interproscan.read
      evidence_builder: rbpfinder.evidence.interpro_contract.interpret

    hhpred:
      automation_implemented: false
      supported_modes: [MANUAL_HANDOFF, SKIP]
      default_mode: MANUAL_HANDOFF
      why_default: >
        HHpred is operated through a submission form with queueing and no stable public
        job API. Automating it would mean driving someone else's web page, which is
        fragile and discourteous in a way a batch file is not.
      manual_batch_file: HHPRED_BATCH.tsv
      service_name: HHpred (MPI Bioinformatics Toolkit)
      service_url: https://toolkit.tuebingen.mpg.de/tools/hhpred
      return_kinds: [hhpred_hhr]
      parser: rbpfinder.parse.hhpred.read
      evidence_builder: rbpfinder.evidence.domain_profile.from_hhpred

    alphafold:
      automation_implemented: false
      supported_modes: [MANUAL_HANDOFF, SKIP]
      default_mode: MANUAL_HANDOFF
      why_default: >
        AlphaFold Server is an interactive service with per-account daily limits. There
        is no submission API to automate against, and the account is the user's.
      manual_batch_file: AF3_MONOMER_BATCH.tsv
      # Written by `evidence/af3_priority.manifest_rows`, not by the plan. Its columns
      # are read by scripts/benchmark_stage2_48.py and scripts/m7c_pipeline_metrics.py,
      # so reshaping it to the M21-a batch contract is a separate decision. Until then
      # the plan records the path and keeps its hands off the file -- relying on write
      # ordering to decide which version survives is not a design.
      batch_writer: external
      service_name: AlphaFold Server
      service_url: https://alphafoldserver.com/
      # Honest, and currently a gap: `providers/local_files.KINDS` has no AF3 kind, so a
      # returned structure cannot be imported directly. It becomes evidence only after
      # Foldseek is run on it. The manual loop for AF3 is therefore NOT closed on its
      # own -- it closes through foldseek.
      return_kinds: []
      return_via: foldseek
      return_loop_closed: false
      parser: null
      evidence_builder: null

    foldseek:
      automation_implemented: false
      supported_modes: [MANUAL_HANDOFF, AUTOMATED_REMOTE, SKIP]
      default_mode: MANUAL_HANDOFF
      why_default: >
        needs a structure to search with, so it follows AF3 in the queue. An automated
        mode is meaningful only once structures are being produced automatically too.
      manual_batch_file: FOLDSEEK_BATCH.tsv
      service_name: Foldseek
      service_url: https://search.foldseek.com/search
      return_kinds: [foldseek_json]
      parser: rbpfinder.parse.foldseek.read
      evidence_builder: rbpfinder.evidence.structural.build

    ebi_blastp:
      automation_implemented: true
      supported_modes: [MANUAL_HANDOFF, AUTOMATED_REMOTE, SKIP]
      default_mode: AUTOMATED_REMOTE
      why_default: >
        the one remote provider already validated end to end, with a real job API,
        checkpointing and resume. It is the exception that shows what an automated mode
        has to earn before it becomes a default.
      manual_batch_file: STAGE2_REQUIRED.tsv
      batch_writer: external          # same writer as the AF3 batch, same reason
      service_name: EBI Job Dispatcher (BLASTP)
      service_url: https://www.ebi.ac.uk/Tools/sss/ncbiblast/
      return_kinds: [remote_blast_tsv, uniprot_blast_tsv, local_blast_tsv]
      parser: rbpfinder.parse.ebi_blast.read
      evidence_builder: rbpfinder.evidence.sequence_homology.build

  # ---------------------------------------------------------------------------
  # What a batch file must tell a person who has never read this codebase.
  # ---------------------------------------------------------------------------
  batch_contract:
    fields: [candidate_id, sequence_sha256, batch_id, sequence, length_aa, priority,
             current_tier, current_evidence_families, why_requested]
    return_binding: [candidate_id, sequence_sha256]

    # M21-c1. Every manual batch ships a pre-filled manifest beside it. A user should not
    # have to learn an internal schema to hand results back -- they fill in one column.
    #
    #     take the batch to the site  ->  download results  ->  fill in `path`  ->  return
    #
    # The column is `cds_id`, not `candidate_id`, because that is what the manifest reader
    # requires; it is pre-filled either way, so nobody has to know that.
    return_template:
      filename_from_batch: "{BATCH}_RETURN_MANIFEST.tsv"
      fields: [cds_id, kind, path, sequence_sha256, batch_id]
      prefilled: [cds_id, kind, sequence_sha256, batch_id]
      user_fills: [path]
      written_when: the_provider_has_a_return_kind
      not_written_when_loop_open: >
        a provider whose results cannot be imported directly gets no template. AF3 is the
        case: there is no manifest kind for a structure, so a template would invite
        someone to fill in a path that nothing can read.
    return_binding_why: >
      a returned file is bound to its request by candidate id AND the hash of the exact
      sequence that was sent. Not by filename: a user who renames a download, submits in
      a different order, or re-runs one candidate after editing the batch would otherwise
      have their result attached to the wrong protein, silently and irreversibly.
    sequence_included: true
    sequence_included_why: >
      the existing HHPRED_BATCH carried only a sha256, which is a checksum, not something
      a person can paste into a submission form. A batch file whose user has to go and
      find the sequences themselves is a list, not a handoff.
    why_requested_must_be_specific: >
      not "more evidence needed" but which family is missing and what this analysis would
      settle. It is the sentence that justifies the user's time.
    tier_and_families_as_fields: >
      as their own columns, not prose inside why_requested. A reader sorting the file
      should be able to see the shape of the request without parsing sentences.

  # ---------------------------------------------------------------------------
  # What comes back. Raw artefacts only.
  # ---------------------------------------------------------------------------
  return_contract:
    accepts: raw_result_files_only
    rejects: [human_summary, transcribed_values, screenshots, pasted_text]
    why: >
      a user describing their results introduces a transcription step between the service
      and the classifier, and every reading in this product is supposed to be traceable
      to an artefact on disk. "The top hit looked like a tail fibre" is not something
      `evidence_families` can de-correlate, supersede or audit.
    same_parser_as_automated: true
    unknown_file_handling: >
      refused by kind, naming what was expected. Never parsed speculatively -- guessing a
      format is how a foldseek export becomes an hhpred record.

  # ---------------------------------------------------------------------------
  # SKIP.
  # ---------------------------------------------------------------------------
  skip:
    run_state: DECLINED
    # DEVIATION, stated so it can be overruled. The proposal said SKIP should report
    # NOT RUN. This project's own invariant argues otherwise: NOT RUN already means
    # "nobody looked", and a user who declined is a different fact from a candidate
    # nobody got round to. Collapsing them costs the report the ability to say why the
    # coverage is what it is -- and it is the same empty-vs-absent merge that has now
    # been found three times. DECLINED is a distinct run_state for that reason.
    distinct_from_not_run: true
    coverage_effect: reduced
    coverage_effect_recorded_where: [capability_matrix, ceiling_paragraph]
    re_prompt: false
    reversible_within_run: true

  # ---------------------------------------------------------------------------
  # What the user is told before an automated mode is enabled.
  # ---------------------------------------------------------------------------
  automation_disclosure:
    must_include:
      - candidate protein sequences are transmitted to a third-party service
      - it usually takes substantially longer than the core analysis
      - it depends on network and service availability
      - it needs more remote calls, wall-clock time and interaction resources
      - a service without a stable API may raise the interaction cost noticeably
    must_not_claim:
      - id: high_token_cost_is_inherent
        why: >
          a deterministic worker doing submit/poll/retrieve costs almost no model
          interaction. The cost is high only where a service cannot be driven through a
          stable API, so stating it as a property of automation would be wrong now and
          would date badly the moment such a worker exists.
      - id: automation_is_faster
        why: "it is usually slower in wall-clock terms; it saves human steps, not time"
    authorisation:
      reuse: stage2.remote_policy
      note: >
        the same per-run authorisation that already governs Stage 2 submission. A second,
        parallel consent mechanism would be one more thing that can silently be false.

  # ---------------------------------------------------------------------------
  # Command line. One switch, not one per tool.
  # ---------------------------------------------------------------------------
  cli:
    global_flag: --evidence-mode
    global_values: [manual, auto, skip]
    per_provider_flag_pattern: --{provider}-mode
    per_provider_overrides_global: true
    unsupported_mode_handling: refuse_and_name_the_supported_modes
    unsupported_mode_why: >
      never silently degrade to a mode the user did not ask for. `stage2.remote_policy`
      already forbids the mirror image of this -- quietly going remote because a local
      provider returned nothing.
    capability_matrix_is_the_authority: >
      the flags say what was asked for; the capability matrix says what a provider can
      actually do and what actually happened. A provider that lists no AUTOMATED_REMOTE
      cannot be forced into it by a flag.

  # ---------------------------------------------------------------------------
  # M21-b. The plan is canonical state: computed once, serialised, never re-derived
  # by a report or a print statement. Same rule as the capability matrix and the AF3
  # priority, both of which had to be fixed for being computed twice.
  # ---------------------------------------------------------------------------
  plan:
    is_canonical_state: true
    fields: [provider, mode, status, candidate_count, candidate_ids, batch_path,
             return_kind, parser, reason, limitations]

    # `status` answers "where does this provider stand", which is NOT the same question
    # as the capability matrix's `run_state` ("did evidence arrive in this run"). Keeping
    # them apart is the standing rule about status axes; overloading one field is how
    # `run_status` and `stage2_remote_status` came to need separating in the first place.
    statuses:
      completed: "an automated provider ran and finished"
      partial: "an automated provider ran; some searches did not complete"
      failed: "an automated provider ran and nothing completed"
      awaiting_user_results: >
        a manual batch was written and the return loop is closed -- the user can hand
        the results straight back
      request_generated: >
        a manual batch was written but the results cannot be imported directly. AF3:
        the structure is a request outcome, not evidence, and reaches the chain through
        Foldseek
      blocked_on_input: "manual, but the prerequisite for the request does not exist yet"
      declined: "the user chose not to run this"
      not_applicable: "nothing needed asking"
      not_authorised: >
        AUTOMATED_REMOTE was asked for and this build implements it, but the run carries
        no authorisation to transmit. Implemented and permitted-to-run-now are two more
        different facts -- the same shape as `no_executor`, one step further along, and
        the plan must not claim a transmission that consent has not been given for.
      no_executor: >
        AUTOMATED_REMOTE was asked for and the contract permits it, but this build has
        no implementation to run it with. Permitted and implemented are two different
        facts, kept apart for the same reason `capability_matrix` keeps `result_import`
        and `executor` apart -- collapsing them makes a plan promise work that cannot
        happen, and M21-b added no new automated provider on purpose.

    # The one that has already cost this project a wrong report.
    batch_is_not_evidence:
      rule: >
        writing a batch file is a REQUEST. It is never a result, never COMPLETED, and
        never a collected evidence family.
      history: >
        HHPRED_BATCH.tsv on disk was read as though HHpred had run. The file exists
        whether or not anyone acted on it, which is exactly why it cannot stand for a
        result.
      capability_run_state_when_batch_written: AWAITING USER
      capability_run_state_when_request_only: REQUEST GENERATED

  declined_effects:
    write_batch: false
    execute_transport: false
    re_prompt: false
    coverage: reduced_if_the_layer_affects_it
    adds_negative_evidence: false
    adds_negative_evidence_why: >
      a candidate nobody looked at with HHpred is not a candidate HHpred rejected. The
      user's decision is about the run, not about the protein -- `absence_is_not_counter_
      evidence` applies to a declined layer exactly as it does to an empty search.

# =============================================================================
# M21-b -- the module inventory, and why a repository with no undo needs one.
#
# On 2026-09-01 a new module was written to `rbpfinder/acquisition.py`, a path already
# held by the M15C database-acquisition module. It was recovered from a wheel built a
# week earlier; there was no git to fall back on. Recovery from a release artefact is
# luck, not a process.
#
# Each module here declares symbols it must export. Overwriting one with something else
# stops being a silent success and becomes a failing gate, because the new file will not
# have them.
# =============================================================================
module_inventory:
  why: "this repository has no working git; an overwritten module cannot be restored"
  gate: scripts/test_module_inventory.py
  modules:
    acquisition: [AcquisitionResolver, DatabaseSpec, IntegrityFailure, Staging,
                  TransportUnavailable, AcquisitionPlan, verification_record]
    evidence_acquisition: [MANUAL, AUTO, SKIP, UnsupportedMode, resolve, resolve_all,
                           batch_rows, handoff_steps, accepts_return, disclosure,
                           provenance, convergence_pairs, plan]
    acquisition_runner: []
    capability_matrix: [build, render, ceiling_paragraph, families_collected]
    uniprot_enrichment: [UniProtEnricher, EnrichmentUnavailable, normalize,
                         capability_note]
    return_binding: [BOUND, STALE_RESULT, UNKNOWN_CANDIDATE, UNBOUND_LEGACY,
                     BindingError, sequence_sha256, is_bound_schema, check,
                     classify_row, provenance, batch_id, summary_lines]
    search_state: [SearchState, TrustConflict, search_key, sequence_sha256]
    events: [EventLog, display_key, read_summary, search_key]
    stage2_remote: [RemoteStage2Session, RemoteUnavailable, disclosure_notice,
                    disclosure_prompt]
    transports: [default_transports, CursorPaginationTransport,
                 DirectCompressedTransport, RestStreamTransport]
    config: [Rules, MissingRule]
    cli: [run]
  provider_modules:
    interpro_remote: [InterProSession, InterProUnavailable, PollBudgetExhausted,
                      http_transport]
    local_files: [Manifest, collect, KINDS]
  evidence_modules:
    ontology: [classify, countable_strength, match_confidence,
               disagreements_with_terms_module]
    interpro_contract: [normalize, eligibility, category_of, interpret,
                        select_candidates, independence_note, ContractViolation]
    domain_profile: [from_interproscan, from_hhpred]
    sequence_homology: [build]
    structural: [build]
    af3_priority: [manifest_rows, assign]
    terms: [classify, direction_for]

# =============================================================================
# M21-c -- proving a returned result belongs to the sequence it was requested for.
#
# M21-b wrote `candidate_id + sequence_sha256` into every manual batch. That is half a
# binding: it tells the user what they are submitting. This is the other half, at the
# door, where a result comes back.
#
# The failure it exists to stop is ordinary, not exotic:
#
#     run 1     CDS_0017 = sequence A   ->  HHPRED_BATCH.tsv
#     later     genome re-annotated, CDS_0017 = sequence B
#     run 2     the user hands back the old .hhr
#
# On candidate_id alone that result attaches to a different protein, silently, and every
# downstream tier is then about a sequence nobody analysed. A locus tag is a label and
# labels get reused; the sequence hash is the only thing in the loop that identifies the
# object actually analysed.
# =============================================================================
return_binding:
  status: M21C

  # A result file does not carry our candidate_id, and it should not be asked to. An
  # `.hhr`, an InterPro TSV and a Foldseek export were all written by tools that never
  # heard of this run. The binding therefore lives in the return manifest the user fills
  # in from the batch we gave them -- never in the result file, and never in its name.
  identity_source: return_manifest
  never_infer_identity_from: [file_name, file_path, directory_layout, file_order,
                              content_of_the_result_file]
  never_infer_identity_why: >
    guessing identity from a filename is how a result for one candidate lands on another
    when someone renames a download or submits in a different order. It also cannot be
    audited: there is nothing to compare against afterwards.

  manifest_schema:
    required: [cds_id, kind, path]
    bound_required: [cds_id, kind, path, sequence_sha256]
    optional: [batch_id, provider, tool]

    # Structural, not a version string. A manifest that HAS the sequence_sha256 column is
    # a bound manifest and every row must carry a hash; a manifest that does not have the
    # column at all is legacy. There is no version field to set wrongly, and no way to be
    # half-migrated by accident -- the same reason M20-b1 keys D-eligibility on whether a
    # span exists rather than on a provider's say-so.
    discriminator: presence_of_the_sequence_sha256_column
    partially_filled_is_an_error: true
    partially_filled_why: >
      a bound manifest with a blank hash on one row is the dangerous middle: it looks
      migrated and is not. It fails, naming the row.

  states:
    BOUND: "candidate_id resolves and the hash matches the candidate's current translation"
    STALE_RESULT: >
      candidate_id resolves and the hash does not match. The result describes a sequence
      this candidate no longer has -- almost always a re-annotation between the batch and
      the return
    UNKNOWN_CANDIDATE: "candidate_id does not exist in this run"
    UNBOUND_LEGACY: >
      a manifest with no sequence_sha256 column at all. Accepted, and marked, so a frozen
      benchmark recording stays replayable

  policy:
    new_manual_returns: sha256_required
    legacy_frozen_manifests: accepted_and_marked
    legacy_must_not_be_silent: true
    legacy_must_not_be_silent_why: >
      backward compatibility for M16/M18 replay is not a compatibility mode for new user
      results. A legacy import is announced every time, so nobody discovers years later
      that their returns were never checked.
    on_stale_result: reject
    on_unknown_candidate: reject
    rejection_is_not_evidence: true

  # What a rejected row must NOT do. This is the same rule the whole product runs on,
  # applied one layer further out.
  rejected_row_effects:
    produces_evidence_record: false
    lowers_tier: false
    counts_as_negative_evidence: false
    why: >
      failing to import a result is a statement about the import, not about the protein.
      A candidate whose HHpred file could not be bound is exactly as unresolved as one
      whose HHpred never ran -- `absence_is_not_counter_evidence`, at the door.
    recorded_where: [run_result.return_binding, stdout, RUN_REPORT]

  # One result file, one input sequence.
  duplicate_binding:
    same_file_two_hashes: reject
    same_file_two_hashes_why: >
      one external analysis being credited to two candidates with different sequences is
      the manual-path version of counting one datum twice. Deduplicating by path would
      not catch it, because the paths are identical -- that IS the problem.
    same_file_same_hash: allow
    same_sequence_reuse:
      allowed: true
      condition: the two candidates' translations are byte-identical
      provenance_required: [same_sequence_reuse, source_candidate_id]
      why: >
        two CDS with an identical translation are different biological objects analysed
        from the same input. Re-running the service would return the same answer, so
        requiring it would be ceremony -- but the record must say the result was reused
        and from which candidate, because the two are not the same gene.

  # Provenance, not identity.
  batch_id:
    role: which_request_plan_this_answers
    is_identity: false
    is_identity_why: >
      it says where a result came from, not what was analysed. Only the sequence hash can
      refuse a stale result, so a matching batch_id must never be accepted in place of a
      matching hash.
    on_mismatch: record_as_note
    on_missing: allowed
    derivation: sha256(run_id + provider + sorted candidate_id:sequence_sha256 pairs)

# =============================================================================
# M21-d -- InterPro AUTO acquisition. How a result arrives, and nothing else.
#
# Every scientific decision about InterPro stays exactly where it is: candidate
# selection, origin/span eligibility, the direction map, the strength ceiling, D-family
# semantics, tiering, Primary/Rescue. This block adds one thing -- RBPfinder can fetch
# the result itself instead of asking a person to.
#
# Convergence is structural rather than asserted. The automated path writes the raw
# InterProScan JSON to disk and registers it in the manifest under `interproscan_json`,
# which is the same kind a returned file gets. From that point the two paths are not
# similar, they are the same code reading the same bytes.
# =============================================================================
interpro_remote:
  status: M21D
  service: EBI InterProScan (Job Dispatcher)
  endpoint: https://www.ebi.ac.uk/Tools/services/rest/iprscan5
  reuses: remote_stage2.transport_retry

  # AUTO is a choice, never a default. `evidence_acquisition.providers.interproscan`
  # keeps `default_mode: MANUAL_HANDOFF`; this only becomes reachable when a user asks
  # for it AND the build implements it.
  requires:
    - explicit mode selection (--interpro-mode auto, or --evidence-mode auto)
    - automation_implemented true for this provider
    - the same per-run authorisation that governs Stage 2 submission
  default_remains: MANUAL_HANDOFF

  authorisation:
    reuse: stage2.remote_policy
    disclosure: >
      InterPro automated mode will transmit selected candidate protein sequences to a
      third-party service. Only candidates selected by the evidence acquisition plan are
      sent. The full phage genome is not transmitted.
    boundary_note: >
      this is the Stage 2 boundary, not the genome-annotation one. M19-f settled that
      RBPfinder does not transmit genomes; sending a handful of candidate proteins to a
      protein-signature service is the same act Stage 2 already performs, under the same
      consent.

  # Reused from M19-d wholesale, including the reason it exists.
  lifecycle:
    states: [PENDING, SUBMITTED, RUNNING, RETRIEVED, PARSED]
    checkpoint_after: [SUBMITTED, RETRIEVED]
    checkpoint_after_why: >
      submitting is the only irreversible step -- it creates work on someone else's
      service. A process killed while polling must be able to resume from a job id
      rather than POST again.
    blocking_submit_and_wait: forbidden
    recovery:
      SUBMITTED_or_RUNNING_with_job_id: poll; never resubmit
      RETRIEVED_with_raw_artifact: parse; never re-download
      PARSED: reuse
    raw_artifact: retained_permanently
    raw_artifact_why: >
      the local file is the evidence; the remote job expires. Re-running the same
      analysis in six months must read the same bytes, not ask the same question of a
      database that has moved on.

  # The line this milestone exists to hold.
  provider_may_not:
    - assign a direction
    - assign a strength
    - assign a family
    - assign or influence a tier
    - decide which candidates to send
  provider_may:
    - submit, poll, retrieve
    - write the raw artefact
    - register it in the manifest as interproscan_json
    - record provenance
  why: >
    a provider that interpreted its own downloads would become a second source of truth
    for a file the manual path already reads. `evidence_acquisition.convergence` forbids
    it in general; this is the first provider where the temptation is concrete, because
    an InterProScan response contains words like "receptor binding" right there in it.

  # Stated because it is easy to assume otherwise once automation exists.
  interpretation_is_unchanged:
    reader_today: rbpfinder.evidence.domain_profile.from_interproscan
    not_yet: rbpfinder.evidence.interpro_contract.interpret
    note: >
      the MANUAL path reaches `domain_profile.from_interproscan`, the older keyword
      reader -- NOT the M20-b1 contract. Routing either path through `interpro_contract`
      is the M20-b1 open item and belongs to M20-b2, with a before/after comparison.
      M21-d joins the manual path exactly as it is, so the two converge on whatever that
      path does today. Automating the fetch does not upgrade the reading.
    curated_ontology_still_empty: true

    # Measured at M21-d, not assumed. The two readers disagree, on the same file:
    #
    #   domain_profile.from_interproscan   strength = strong    (e-value 3.1e-32)
    #   interpro_contract.interpret        strength = moderate  (description reading)
    #
    # The M20-b1 ceiling -- a description reading may never be `strong` however good the
    # e-value -- is a property of the CONTRACT, and the contract is not the reader in
    # use. So the ceiling is not currently in force anywhere in the live path. They agree
    # on direction; the gap is strength alone.
    #
    # M21-d does not close it. Automating the fetch must not quietly change what a result
    # is worth, and routing the live path through `interpro_contract` is a measurable
    # science change that belongs to M20-b2 with a before/after comparison.
    readers_disagree_on_strength: true

    # Found by the M21-d live run, 2026-09-01, and NOT fixed there -- M21-d was
    # acquisition only, and changing a term map to make a result look better is the one
    # thing an acquisition milestone must not do.
    #
    # The two vocabularies disagree about the most canonical RBP word in tailed-phage
    # biology:
    #
    #   stage4.direction_map         tailspike -> supports_receptor_binding
    #   stage2.annotation_term_map   tailspike -> apparatus       <- the LIVE reader
    #
    # `terms.classify`, which every D record goes through, uses the second. So an
    # InterProScan hit naming `P22 tailspike` reads as apparatus membership on its own.
    # The P22 control came out as supports_receptor_binding only because it ALSO carries
    # a pectin-lyase fold signature (SSF51126, G3DSA:2.160.20.20), and `pectin lyase` IS
    # in positive_rbp_terms. A tailspike without a depolymerase fold would read as
    # apparatus -- a real RBP demoted to "somewhere in the tail".
    #
    # Whether that is wrong is a scientific question: `tailspike` is structurally a tail
    # component AND functionally a receptor binder, which is exactly the compound case
    # `terms.classify` has a conservative rule for. It needs deciding, not patching.
    vocabularies_disagree_on_tailspike:
      live_reader: stage2.annotation_term_map
      live_verdict: apparatus
      other_map: stage4.direction_map
      other_verdict: supports_receptor_binding
      observed: "M21-d live run, UniProtKB P12528 (P22 tail spike protein)"
      owner: M20-b2
    live_path_ceiling: none_in_force
    contract_ceiling: moderate_for_description_inference
    gate: scripts/test_m21d_interpro_auto.py D15b

  failure_semantics:
    all_submissions_failed:
      capability: FAILED
      adds_d_evidence: false
      changes_existing_evidence: false
      changes_tier: false
      run_continues: true
      recorded_in: [capability_matrix, evidence_acquisition_plan, limitations]
    why: >
      a service being down is not a finding about a protein. This is the same rule the
      remote Stage 2 arm already follows, and the same one M20-a2 applies to enrichment.

  candidate_selection:
    reuse: interpro_evidence.candidate_selection
    may_not_change_here: true
    may_not_change_here_why: >
      if selection moved in the same milestone as automation, a change in results could
      not be attributed to the new D evidence rather than to a different queue.

# =============================================================================
# M20-b2 -- ONE vocabulary, and a role that does not have to be chosen.
#
# Two independent term maps had drifted, and the M21-d live run found exactly where:
#
#     stage2.annotation_term_map   tailspike -> apparatus        (the LIVE reader)
#     stage4.direction_map         tailspike -> receptor_binding
#
# Five terms disagreed, out of sixteen that appear in both -- tail fiber, tail fibre,
# tail spike, tailspike, tip attachment. Every one of them names a protein that is
# simultaneously part of the tail apparatus AND the thing that binds the receptor. The
# disagreement was not sloppiness; it was a single-valued `direction` being asked to
# express a dual role, and two authors resolving it in opposite directions.
#
# So a term now carries both:
#
#     roles       what the protein IS -- possibly more than one thing
#     direction   whether this evidence supports a direct RBP hypothesis
#
# Acknowledging that a tailspike is part of the tail no longer erases that it binds the
# receptor. P22 gp9 is the case in hand: it read correctly in the live run only because
# it also matched `pectin lyase`. A tailspike without a depolymerase fold would have been
# demoted to apparatus membership -- a false negative on a confirmed RBP core.
#
# STATUS: SHADOW. Nothing reads this yet. `terms.classify` is unchanged and the frozen
# M14D product numbers are untouched until the delta has been measured and accepted.
# =============================================================================
rbp_ontology:
  status: M20B2_SHADOW
  live: false
  live_note: >
    generated from the two existing maps by scripts/build_rbp_ontology.py, then curated.
    Switching the live reader to it is a measurable science change and needs the shadow
    comparison first -- see scripts/m20b2_shadow_delta.py.

  roles: [receptor_binding, apparatus_membership, structural_only, non_rbp_identity,
          enzymatic, noise, uninformative]
  roles_are_not_exclusive: true
  roles_are_not_exclusive_why: >
    a tailspike is a tail component and a receptor binder; a depolymerase is an enzyme
    and a receptor binder. Forcing one label is what made the two maps disagree, and it
    is the same problem the N4 gp65 dual-role case raises from the other end.

  # ---------------------------------------------------------------------------
  # Strength, in two layers rather than one word doing two jobs.
  #
  # An e-value of 3e-32 proves a signature matched. It does not prove the signature's
  # biology means receptor binding. The live path currently lets the first become the
  # second: `domain_profile.from_interproscan` returns `strong` on a good e-value alone.
  # ---------------------------------------------------------------------------
  strength_model:
    match_confidence:
      from: signature significance (e-value, score, coverage)
      answers: "did this signature really match this sequence"
    interpretation_confidence:
      from: this ontology, per term
      answers: "does this signature's biology support a receptor-binding reading"
    countable_strength: min(match_confidence, interpretation_confidence)
    countable_strength_why: >
      a reading can be no stronger than its weaker leg. A perfect match to a domain whose
      functional meaning is uncertain is a certain match to an uncertain thing, and a
      confident interpretation of a marginal hit is a confident reading of noise.
    forbidden:
      id: evalue_alone_makes_strong_rbp_evidence
      why: >
        it is how a fold-level hit becomes a receptor-binding claim. Observed on
        UniProtKB P12528 in the M21-d live run: strength `strong` from an e-value, on a
        term the ontology rates `moderate`.


  # ---------------------------------------------------------------------------
  # What `direction` is FOR. Frozen, because getting this wrong is what produced the
  # original disagreement.
  #
  #   direction  answers: does this evidence support THIS CANDIDATE directly
  #              participating in receptor binding?
  #
  #   roles      answer:  what is this protein, which may be several things at once
  #
  # `direction` is NOT "which virion apparatus does this protein belong to". Under the
  # old single-valued model those two questions shared one field, so a term had to
  # choose, and `tailspike` -> apparatus meant a confirmed RBP core read as a structural
  # part. Separating them is the whole repair:
  #
  #   tailspike               roles [apparatus_membership, receptor_binding]
  #                           direction supports_receptor_binding
  #
  #   gp35-like hinge subunit roles [apparatus_membership]
  #                           direction supports_apparatus_membership
  #
  # Both are in the tail. Only one of them binds anything, and `direction` is where that
  # is said.
  # ---------------------------------------------------------------------------
  direction_semantics:
    answers: "does this evidence support this candidate directly binding the receptor"
    does_not_answer: "which virion apparatus this protein belongs to"
    apparatus_membership_is_a_role_not_a_direction: true

  # ---------------------------------------------------------------------------
  # Group C, and deliberately not natural-language processing. A generic organelle term
  # promotes only when something more specific is present alongside it.
  #
  #   `Long-tail fiber protein gp35`              -> apparatus (no qualifier)
  #   `distal long-tail fiber protein gp37`       -> receptor_binding
  #   `tail fiber tip adhesin gp38`               -> receptor_binding
  #
  # SHADOW, and not applied by anything: the qualifier list needs a positive/negative
  # panel before it decides anything, exactly as `tip attachment` does.
  # ---------------------------------------------------------------------------
  generic_apparatus_terms: ['tail fiber', 'tail fibre', 'tip attachment']
  tail_fiber_qualifiers:
    status: SHADOW_UNAPPLIED
    promotes_to: supports_receptor_binding
    qualifiers: [distal, tip, adhesin, receptor-binding, receptor binding,
                 host recognition, host-recognition, host specificity,
                 host-specificity, adsorption, depolymerase]
    also_promotes_on: curated_signature_accession
    also_promotes_on_why: >
      a curated InterPro or Pfam accession placing a subunit at the distal,
      receptor-contacting end is stronger than any word in a description, and it is the
      path that does not depend on how someone phrased an annotation.
    not_nlp: true
    not_nlp_why: >
      a literal qualifier list is reviewable and its failures are inspectable. A parser
      that infers which subunit an annotation means would be neither, and the first thing
      it would be asked to disambiguate is `Long-tail fiber protein gp36`, where the
      answer is not in the words at all.

  # ---------------------------------------------------------------------------
  # OPEN, found by the shadow measurement and NOT resolved here.
  #
  # `tailspike` and `tail fiber` are not the same kind of word, and treating them alike
  # is what the shadow run exposed.
  #
  #   tailspike    ONE protein that is both a tail component and the receptor binder.
  #                P22 gp9. Promoting it is simply correct.
  #
  #   tail fiber   an ORGANELLE made of several subunits, only the distal one of which
  #                binds anything. T4: gp34 proximal, gp35 hinge, gp36 small distal,
  #                gp37 distal, gp38 tip adhesin. Every one of them is annotated
  #                "Long-tail fiber protein gpNN".
  #
  # The shadow run promoted T4 CDS_0267 and CDS_0268 -- gp35 and gp36 -- from R3 to R2,
  # on annotations reading `Long-tail fiber protein gp35 / gp36`. This project's own
  # curation calls both `connector_baseplate`. They are part of the fibre and they are
  # not the binding tip, so that promotion is a false positive introduced by the term.
  #
  # So the dual-role reconciliation is NOT free after all: 8 of its 10 promotions are
  # candidates already in primary/rescue getting a better-justified tier, and 2 are
  # structural subunits being promoted for sharing a word with the tip.
  #
  # Deciding this needs subunit-level vocabulary (`distal`, `tip`, `adhesin`, `hinge`,
  # `proximal`) or a rule that "tail fiber" alone is weaker than "tail fiber" plus a
  # distal marker. It is a scientific judgement and it is left to whoever makes it.
  open_question_tail_fiber_subunits:
    observed: "shadow run, T4 CDS_0267 (gp35) and CDS_0268 (gp36)"
    project_curation_says: connector_baseplate
    shadow_would_promote_to: supports_receptor_binding
    tailspike_unaffected: true
    tailspike_unaffected_why: "one protein, not a multi-subunit organelle"

